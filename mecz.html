<!DOCTYPE html>
<html>
<head>
    <title>Championship Manager 2D - Spokojne Tempo</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        canvas { background: #236926; border: 4px solid #fff; box-shadow: 0px 0px 25px rgba(0,0,0,0.7); display: block; margin: 10px auto; }
        #commentary { background: #000; border: 2px solid #333; width: 580px; min-height: 45px; margin: 10px auto; padding: 10px; font-size: 14px; color: #00ff00; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>

    <div id="commentary">> Formacje rozstawione taktycznie. Oczekiwanie na pierwszy gwizdek...</div>
    <canvas id="matchCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("matchCanvas");
        const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");

        let scoreA = 0; let scoreB = 0;
        
        // POPRAWKA: Prędkość piłki mocno zmniejszona z 0.08 na 0.03 (leci dużo wolniej i dostojniej)
        let ball = { x: 300, y: 200, targetX: 300, targetY: 200, speed: 0.03 };
        let players = [];
        let stanMeczu = "srodek"; 
        let timerStanu = 0;

        const basePositions = [
            { team: "A", nr: 1, x: 40, y: 200, role: "GK" }, { team: "A", nr: 2, x: 120, y: 80, role: "DEF" }, { team: "A", nr: 3, x: 110, y: 160, role: "DEF" }, { team: "A", nr: 4, x: 110, y: 240, role: "DEF" }, { team: "A", nr: 5, x: 120, y: 320, role: "DEF" }, { team: "A", nr: 6, x: 220, y: 90, role: "MID" }, { team: "A", nr: 7, x: 200, y: 160, role: "MID" }, { team: "A", nr: 8, x: 200, y: 240, role: "MID" }, { team: "A", nr: 10, x: 220, y: 310, role: "MID" }, { team: "A", nr: 11, x: 280, y: 150, role: "ATT" }, { team: "A", nr: 9, x: 280, y: 250, role: "ATT" },
            { team: "B", nr: 1, x: 560, y: 200, role: "GK" }, { team: "B", nr: 2, x: 480, y: 80, role: "DEF" }, { team: "B", nr: 3, x: 490, y: 160, role: "DEF" }, { team: "B", nr: 4, x: 490, y: 240, role: "DEF" }, { team: "B", nr: 5, x: 480, y: 320, role: "DEF" }, { team: "B", nr: 6, x: 380, y: 90, role: "MID" }, { team: "B", nr: 7, x: 400, y: 160, role: "MID" }, { team: "B", nr: 8, x: 400, y: 240, role: "MID" }, { team: "B", nr: 10, x: 380, y: 310, role: "MID" }, { team: "B", nr: 9, x: 320, y: 150, role: "ATT" }, { team: "B", nr: 11, x: 320, y: 250, role: "ATT" }
        ];

        basePositions.forEach(p => {
            players.push({
                team: p.team, nr: p.nr, role: p.role,
                homeX: p.x, homeY: p.y,
                x: p.x, y: p.y,
                targetX: p.x, targetY: p.y,
                // POPRAWKA: Prędkość zawodników zmniejszona o połowę (brak nerwowych szarpnięć)
                speed: 0.02 + Math.random() * 0.01,
                randomOffset: Math.random() * 100
            });
        });

        function updateGame() {
            // Rysowanie boiska
            ctx.fillStyle = "#236926"; ctx.fillRect(0, 0, 600, 400);
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, 600, 400);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();
            ctx.beginPath(); ctx.arc(300, 200, 45, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeRect(0, 110, 70, 180); ctx.strokeRect(530, 110, 70, 180);

            // Wynik
            ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "bold 16px Arial";
            ctx.fillText("FC KULECZKI " + scoreA + " : " + scoreB + " NIEBIESKIE ASY", 190, 30);

            let czas = Date.now();

            players.forEach(p => {
                if (stanMeczu === "srodek" || stanMeczu === "aut" || stanMeczu === "rozny" || stanMeczu === "aut_bramkowy") {
                    // Spokojne, powolne dreptanie w miejscu
                    p.targetX = p.homeX + Math.sin((czas / 500) + p.randomOffset) * 4;
                    p.targetY = p.homeY + Math.cos((czas / 600) + p.randomOffset) * 4;
                } else {
                    // Delikatne, stonowane przesuwanie się całego bloku taktycznego za wolną piłką
                    let przesuniecieX = (ball.x - 300) * 0.12;
                    let przesuniecieY = (ball.y - 200) * 0.12;
                    
                    if (p.role === "GK") { przesuniecieX = 0; przesuniecieY = (ball.y - 200) * 0.08; }

                    p.targetX = p.homeX + przesuniecieX + Math.sin((czas / 700) + p.randomOffset) * 2;
                    p.targetY = p.homeY + przesuniecieY + Math.cos((czas / 700) + p.randomOffset) * 2;

                    // Tylko jeden aktywny napastnik zbliża się spokojnie do piłki
                    if (p.team === "A" && ball.x > 300 && p.role === "ATT" && p.nr === 9) { p.targetX = ball.x - 18; p.targetY = ball.y; }
                    if (p.team === "B" && ball.x < 300 && p.role === "ATT" && p.nr === 9) { p.targetX = ball.x + 18; p.targetY = ball.y; }
                }

                p.x += (p.targetX - p.x) * p.speed;
                p.y += (p.targetY - p.y) * p.speed;

                ctx.fillStyle = p.team === "A" ? "#e53935" : "#1e88e5";
                ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText(p.nr, p.x - 5, p.y + 4);
            });

            ball.x += (ball.targetX - ball.x) * ball.speed;
            ball.y += (ball.targetY - ball.y) * ball.speed;
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.stroke();

            // POPRAWKA: Czas trwania akcji wydłużony ponad TRZYKROTNIE z 160 na 500! 
            // Sędzia podejmuje decyzje rzadziej, dając czas na płynny lot piłki i czytanie tekstu.
            timerStanu++;
            if (timerStanu > 500) {
                timerStanu = 0;
                silnikDecyzjiSedziego();
            }

            requestAnimationFrame(updateGame);
        }

        function silnikDecyzjiSedziego() {
            comment.style.color = "#00ff00";
            let los = Math.random();

            if (stanMeczu === "srodek" || stanMeczu === "aut" || stanMeczu === "rozny" || stanMeczu === "aut_bramkowy") {
                stanMeczu = "akcja";
                if (los < 0.5) {
                    comment.innerText = "> [Atak] Pomocnicy FC Kuleczki spokojnie wymieniają podania i budują atak pozycyjny...";
                    ball.targetX = 430 + Math.random() * 80; ball.targetY = 120 + Math.random() * 160;
                } else {
                    comment.style.color = "#ff5252";
                    comment.innerText = "> [Zagrożenie] Niebieskie Asy szukają luki w naszej obronie. Piłka krąży przed polem karnym...";
                    ball.targetX = 70 + Math.random() * 80; ball.targetY = 120 + Math.random() * 160;
                }
            } else {
                if (los < 0.22) {
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = 200 + (Math.random()*16 - 8); scoreA++; comment.style.color = "#ffeb3b";
                        comment.innerText = "⚽ GOOOOL!! Precyzyjne, wypracowane uderzenie! Piłka ląduje w rogu siatki!";
                    } else {
                        ball.targetX = 5; ball.targetY = 200 + (Math.random()*16 - 8); scoreB++; comment.style.color = "#ff5252";
                        comment.innerText = "❌ BRAMKA! Przeciwnik oddaje niesygnalizowany strzał i zdobywa bramkę.";
                    }
                    stanMeczu = "srodek";
                } else if (los >= 0.22 && los < 0.48) {
                    stanMeczu = "aut_bramkowy"; comment.style.color = "#aaaaaa";
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = Math.random() > 0.5 ? 80 : 320;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Dobrze pomyślana akcja, ale strzał przechodzi nad poprzeczką.";
                    } else {
                        ball.targetX = 5; ball.targetY = Math.random() > 0.5 ? 80 : 320;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Niebiescy uderzają niecelnie. Piłka opuszcza linię końcową.";
                    }
                } else if (los >= 0.48 && los < 0.74) {
                    stanMeczu = "rozny"; comment.style.color = "#00e5ff";
                    if (ball.x > 300) {
                        ball.targetX = 590; ball.targetY = Math.random() > 0.5 ? 20 : 380;
                        comment.innerText = "📐 [RZUT ROŻNY] Ofiarny blok środkowego obrońcy! Korner dla FC Kuleczki.";
                    } else {
                        ball.targetX = 10; ball.targetY = Math.random() > 0.5 ? 20 : 380;
                        comment.innerText = "📐 [RZUT ROŻNY] Nasza defensywa czujnie zbija piłkę za linię końcową.";
                    }
                } else {
                    stanMeczu = "aut"; comment.style.color = "#ffb300";
                    ball.targetX = 220 + Math.random() * 160; ball.targetY = Math.random() > 0.5 ? -12 : 412;
                    comment.innerText = "🏳️ [AUT] Gra przerwana. Piłka wybita na aut po twardej walce w środkowej strefie.";
                }
            }
        }

        updateGame();
    </script>
</body>
</html>
