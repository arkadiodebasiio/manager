<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pegasus Retro Athletics - Fix Screen</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #nes-frame {
            border: 4px solid #fff;
            background-color: #000;
        }
        canvas {
            width: 512px;
            height: 480px;
            image-rendering: pixelated;
            display: block;
        }
        .info {
            margin-top: 10px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="nes-frame">
        <canvas id="nesCanvas" width="256" height="240"></canvas>
    </div>
    <div class="info">Naciśnij [R] aby zresetować bieg</div>

<script>
const canvas = document.getElementById("nesCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

// Biegacze
const runners = [
    { id: 1, name: "ALEX", x: 10, y: 100, color: "#00a8cc", shirt: "#ffcc00", speed: 1.1, jumpSkill: 0.9, progress: 0, state: "RUN", timer: 0, time: 0 },
    { id: 2, name: "BOB",  x: 10, y: 150, color: "#e60012", shirt: "#ffffff", speed: 1.0, jumpSkill: 0.95, progress: 0, state: "RUN", timer: 0, time: 0 }
];

const hurdles =;
const finishLine = 200;
let raceOver = false;
let globalTimer = 0;

function resetRace() {
    runners.forEach(r => { r.progress = 0; r.state = "RUN"; r.timer = 0; r.time = 0; });
    raceOver = false;
    globalTimer = 0;
}

window.addEventListener("keydown", e => {
    if (e.code === "KeyR") resetRace();
});

function update() {
    if (raceOver) return;
    globalTimer += 1/60;

    runners.forEach(r => {
        if (r.state === "FINISHED") return;

        if (r.state === "RUN") {
            r.progress += r.speed + (Math.random() * 0.1);
        } else if (r.state === "JUMP") {
            r.timer += 0.1;
            if (r.timer >= Math.PI) { r.state = "RUN"; r.timer = 0; }
        } else if (r.state === "STUMBLE") {
            r.timer++;
            if (r.timer > 25) { r.state = "RUN"; r.timer = 0; }
        }

        hurdles.forEach(hX => {
            let dist = hX - r.progress;
            if (dist > 4 && dist < 14 && r.state === "RUN") {
                if (Math.random() < r.jumpSkill) { r.state = "JUMP"; r.timer = 0; }
            }
            if (Math.abs(dist) < 2 && r.state === "RUN") {
                r.state = "STUMBLE"; r.timer = 0;
            }
        });

        if (r.progress >= finishLine) {
            r.state = "FINISHED";
            r.time = globalTimer;
        }
    });

    if (runners.every(r => r.state === "FINISHED")) raceOver = true;
}

function draw() {
    // 1. Tło nieba (Jasny błękit NES)
    ctx.fillStyle = "#5c94fc";
    ctx.fillRect(0, 0, 256, 240);

    // 2. Tło bieżni (Czerwień mączki)
    ctx.fillStyle = "#c84c0c";
    ctx.fillRect(0, 80, 256, 120);

    // Białe linie torów
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 80, 256, 2);
    ctx.fillRect(0, 130, 256, 2);
    ctx.fillRect(0, 180, 256, 2);

    // 3. Płotki
    hurdles.forEach(hX => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(hX, 92, 3, 10);
        ctx.fillRect(hX, 142, 3, 10);
        ctx.fillStyle = "#f8f8f8";
        ctx.fillRect(hX - 1, 92, 5, 3);
        ctx.fillRect(hX - 1, 142, 5, 3);
    });

    // 4. Zawodnicy
    runners.forEach(r => {
        let drawX = Math.floor(r.x + r.progress);
        let drawY = Math.floor(r.y);

        if (r.state === "JUMP") drawY -= Math.floor(Math.sin(r.timer) * 14);
        if (r.state === "STUMBLE") drawY += 4;

        // Kask
        ctx.fillStyle = r.color;
        ctx.fillRect(drawX + 2, drawY, 8, 4);
        // Twarz
        ctx.fillStyle = "#ffcc99";
        ctx.fillRect(drawX + 3, drawY + 4, 6, 4);
        // Koszulka
        ctx.fillStyle = r.shirt;
        ctx.fillRect(drawX + 1, drawY + 8, 10, 7);
        // Spodenki
        ctx.fillStyle = "#000000";
        ctx.fillRect(drawX + 2, drawY + 15, 8, 3);
        // Nogi
        ctx.fillStyle = "#ffcc99";
        ctx.fillRect(drawX + 2, drawY + 18, 3, 4);
        ctx.fillRect(drawX + 7, drawY + 18, 3, 4);
    });

    // 5. Panel tekstowy u góry
    ctx.fillStyle = "#000000";
    ctx.fillRect(10, 10, 236, 20);
    ctx.fillStyle = "#ffffff";
    ctx.font = "8px monospace";
    ctx.fillText("BIEG PRZEZ PŁOTKI - RETRO", 18, 23);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
