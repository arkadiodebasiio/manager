<!DOCTYPE html>
<html>
<head>
    <title>Championship Manager 2D - Canvas 60 FPS</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        /* Jedno płótno zamiast wielu kulek - klucz do płynności w SL */
        canvas { background: #236926; border: 4px solid #fff; box-shadow: 0px 0px 25px rgba(0,0,0,0.7); display: block; margin: 10px auto; }
        #commentary { background: #000; border: 2px solid #333; width: 580px; min-height: 45px; margin: 10px auto; padding: 10px; font-size: 14px; color: #00ff00; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>

    <div id="commentary">> Sędzia główny dmucha w gwizdek. Zaczynamy płynną symulację 60 FPS...</div>
    <canvas id="matchCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("matchCanvas");
        const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");

        let scoreA = 0; let scoreB = 0;
        let ball = { x: 300, y: 200, targetX: 300, targetY: 200, speed: 0.1 };
        let players = [];
        let stanMeczu = "srodek"; // srodek, akcja, aut, rozny, aut_bramkowy
        let timerStanu = 0;

        // Baza pozycji startowych (Taktyka 4-4-2)
        const startPositions = [
            { team: "A", nr: 1, x: 40, y: 200 }, { team: "A", nr: 2, x: 120, y: 80 }, { team: "A", nr: 3, x: 110, y: 160 }, { team: "A", nr: 4, x: 110, y: 240 }, { team: "A", nr: 5, x: 120, y: 320 }, { team: "A", nr: 6, x: 220, y: 90 }, { team: "A", nr: 7, x: 200, y: 160 }, { team: "A", nr: 8, x: 200, y: 240 }, { team: "A", nr: 10, x: 220, y: 310 }, { team: "A", nr: 11, x: 280, y: 150 }, { team: "A", nr: 9, x: 280, y: 250 },
            { team: "B", nr: 1, x: 560, y: 200 }, { team: "B", nr: 2, x: 480, y: 80 }, { team: "B", nr: 3, x: 490, y: 160 }, { team: "B", nr: 4, x: 490, y: 240 }, { team: "B", nr: 5, x: 480, y: 320 }, { team: "B", nr: 6, x: 380, y: 90 }, { team: "B", nr: 7, x: 400, y: 160 }, { team: "B", nr: 8, x: 400, y: 240 }, { team: "B", nr: 10, x: 380, y: 310 }, { team: "B", nr: 9, x: 320, y: 150 }, { team: "B", nr: 11, x: 320, y: 250 }
        ];

        // Tworzenie obiektów zawodników z losowym przesunięciem (każdy biegnie inaczej!)
        startPositions.forEach(p => {
            players.push({ team: p.team, nr: p.nr, startX: p.x, startY: p.y, x: p.x, y: p.y, targetX: p.x, targetY: p.y, speed: 0.05 + Math.random() * 0.03 });
        });

        function ustawCeleNaStart() {
            players.forEach(p => { p.targetX = p.startX; p.targetY = p.startY; });
            ball.targetX = 300; ball.targetY = 200;
        }

        // --- GŁÓWNA PĘTLA GRAFICZNA (60 KLATEK NA SEKUNDĘ) ---
        function updateGame() {
            // 1. Czyszczenie i rysowanie boiska
            ctx.fillStyle = "#236926"; ctx.fillRect(0, 0, 600, 400);
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, 600, 400);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();
            ctx.beginPath(); ctx.arc(300, 200, 45, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeRect(0, 110, 70, 180); ctx.strokeRect(530, 110, 70, 180);

            // Rysowanie wyniku meczu bezpośrednio na murawie
            ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "bold 16px Arial";
            ctx.fillText("FC KULECZKI " + scoreA + " : " + scoreB + " NIEBIESKIE ASY", 190, 30);

            // 2. Płynne przesuwanie zawodników po skosach za pomocą matematycznej interpolacji (LERP)
            players.forEach(p => {
                p.x += (p.targetX - p.x) * p.speed; p.y += (p.targetY - p.y) * p.speed;
                // Rysowanie kulek
                ctx.fillStyle = p.team === "A" ? "#e53935" : "#1e88e5";
                ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
                // Numery na koszulkach
                ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText(p.nr, p.x - 5, p.y + 4);
            });

            // 3. Płynny lot piłki
            ball.x += (ball.targetX - ball.x) * ball.speed; ball.y += (ball.targetY - ball.y) * ball.speed;
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.stroke();

            // 4. Logika sędziowska i zmiana akcji
            timerStanu++;
            if (timerStanu > 180) { // Zmiana akcji co około 3 sekundy
                timerStanu = 0;
                logikaSędziowska();
            }

            requestAnimationFrame(updateGame); // Wymuszenie 60 FPS
        }

        function logikaSędziowska() {
            comment.style.color = "#00ff00";
            let los = Math.random();

            if (stanMeczu === "srodek" || stanMeczu === "aut" || stanMeczu === "rozny" || stanMeczu === "aut_bramkowy") {
                stanMeczu = "akcja";
                // Losujemy stronę ataku
                if (los < 0.5) {
                    comment.innerText = "> [Atak] Atak pozycyjny FC Kuleczki. Zawodnicy dynamicznie rozbiegają się po skrzydłach!";
                    let bx = 400 + Math.random() * 150; let by = 50 + Math.random() * 300;
                    ball.targetX = bx; ball.targetY = by;
                    // Każdy biegnie w inne losowe miejsce w strefie ataku! Brak sztywnej linii!
                    players.forEach(p => {
                        if (p.team === "A") { p.targetX = p.startX + 150 + Math.random()*40; p.targetY = p.startY + (Math.random()*60 - 30); }
                        else { p.targetX = p.startX - 50 + Math.random()*30; p.targetY = p.startY + (Math.random()*40 - 20); }
                    });
                } else {
                    comment.style.color = "#ff5252";
                    comment.innerText = "> [Zagrożenie] Niebieskie Asy przejmują inicjatywę i groźnie ścinają w pole karne!";
                    let bx = 50 + Math.random() * 150; let by = 50 + Math.random() * 300;
                    ball.targetX = bx; ball.targetY = by;
                    players.forEach(p => {
                        if (p.team === "B") { p.targetX = p.startX - 150 - Math.random()*40; p.targetY = p.startY + (Math.random()*60 - 30); }
                        else { p.targetX = p.startX + 50 - Math.random()*30; p.targetY = p.startY + (Math.random()*40 - 20); }
                    });
                }
            } else {
                // Finał akcji: Gol, Aut, Rożny czy Aut bramkowy
                if (los < 0.25) {
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = 200; scoreA++; comment.style.color = "#ffeb3b";
                        comment.innerText = "⚽ GOOOOL!! Piękny, nieliniowy rajd zakończony potężnym strzałem w siatkę!";
                    } else {
                        ball.targetX = 5; ball.targetY = 200; scoreB++; comment.style.color = "#ff5252";
                        comment.innerText = "❌ BRAMKA! Przeciwnicy rozmontowali naszą defensywę i strzelają gola!";
                    }
                    stanMeczu = "srodek";
                } else if (los >= 0.25 && los < 0.5) {
                    stanMeczu = "aut_bramkowy"; comment.style.color = "#aaaaaa";
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = Math.random() > 0.5 ? 40 : 360;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Strzał z dystansu przechodzi daleko obok słupka.";
                    } else {
                        ball.targetX = 5; ball.targetY = Math.random() > 0.5 ? 40 : 360;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Niecelne uderzenie Niebieskich. Piłka poza polem bramki.";
                    }
                    setTimeout(ustawCeleNaStart, 1000);
                } else if (los >= 0.5 && los < 0.75) {
                    stanMeczu = "rozny"; comment.style.color = "#00e5ff";
                    if (ball.x > 300) {
                        ball.targetX = 590; ball.targetY = 390;
                        comment.innerText = "📐 [RZUT ROŻNY] Obrońca ofiarnym skosem blokuje podanie! Korner dla nas.";
                    } else {
                        ball.targetX = 10; ball.targetY = 10;
                        comment.innerText = "📐 [RZUT ROŻNY] Rywale wywalczyli rzut rożny po zablokowanym strzale.";
                    }
                    setTimeout(ustawCeleNaStart, 1000);
                } else {
                    stanMeczu = "aut"; comment.style.color = "#ffb300";
                    ball.targetX = 300 + (Math.random()*100 - 50); ball.targetY = Math.random() > 0.5 ? -10 : 410;
                    comment.innerText = "🏳️ [AUT] Piłka ucieka za boczną linię po chaotycznej walce ramie w ramię.";
                    setTimeout(ustawCeleNaStart, 1000);
                }
            }
        }

        // Start silnika graficznego
        updateGame();
    </script>
</body>
</html>
