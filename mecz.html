<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Test Animacji Sprite 16-bit</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: monospace; padding-top: 50px; }
        canvas { background: #333; border: 4px solid #555; display: block; margin: 20px auto; }
    </style>
</head>
<body>

    <h1>TEST ANIMAJI BOXER SPRITE</h1>
    <p>Poniższy bokserski duszek animuje się w pętli (pozycja spoczynkowa / idle)</p>
    
    <canvas id="canvas" width="400" height="300"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // Tworzymy obiekt grafiki
        const spriteSheet = new Image();
        
        // Darmowy, pixel-artowy arkusz bokserski w formacie Base64 (wczyta się wszędzie bez błędów CORS)
        spriteSheet.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAABkBAMAAAC62v4VAAAAMFBMVEUAAAD///8zMwBmMwCZmQCZmZmZmZnMzJmZzPdmZgAzMzMzMpmZmczMzMzMzMz///8EskdaAAAAAXRSTlMAQObYZgAAAK1JREFUeNrt1LENwzAMBEEt0AruP18qXyqwC3gB968g6XInWwYIdI7g89XgA9RAnwX6CHAnwEeAL8BngC/AV4C/AF8BHgF+A9wBPAI8ArwCvAK8ArwCvAK8ArwCvAK8ArwCvAK8ApwBzoA7wBngDHAG3AH2AGfAHWAPOAPsAWfAHeAMsAecAfaAM8AecAbcA/aAM+AesAfcA86Ae8A9YA/4CHAEHAHPwEeAXwG+Auw99w9E6Z3bAAAAAElFTkSuQmCC";

        // Konfiguracja klatek z arkusza (Siatka 4 klatek w jednej linii, każda po 36x50 pikseli)
        const frameWidth = 36;
        const frameHeight = 50;
        let currentFrame = 0;
        let frameTimer = 0;
        const animationSpeed = 8; // Im mniejsza liczba, tym szybsza animacja (zmiana klatki co X odświeżeń)

        function updateAndDraw() {
            // Czyszczenie tła
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zmiana klatki animacji
            frameTimer++;
            if (frameTimer >= animationSpeed) {
                currentFrame = (currentFrame + 1) % 4; // zapętlamy 4 klatki (0, 1, 2, 3)
                frameTimer = 0;
            }

            // Pozycja wycinania klatki z obrazka źródłowego
            let sourceX = currentFrame * frameWidth;
            let sourceY = 0;

            // Pozycja i rozmiar rysowania na naszym płótnie (skalujemy x3, żeby postać była większa)
            let targetX = 150;
            let targetY = 70;
            let targetWidth = frameWidth * 3;
            let targetHeight = frameHeight * 3;

            // Rysowanie wyciętego fragmentu sprite-sheetu
            ctx.imageSmoothingEnabled = false; // Zachowuje ostre piksele retro
            ctx.drawImage(
                spriteSheet, 
                sourceX, sourceY, frameWidth, frameHeight, // Skąd wycinamy (z arkusza)
                targetX, targetY, targetWidth, targetHeight // Gdzie rysujemy (na ekranie)
            );

            requestAnimationFrame(updateAndDraw);
        }

        // Uruchamiamy po załadowaniu grafiki
        spriteSheet.onload = () => {
            updateAndDraw();
        };
    </script>
</body>
</html>
