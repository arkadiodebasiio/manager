<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pegasus Retro Boxing AI</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #ui-box {
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
            background: #222;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        canvas {
            background-color: #38bdf8; /* Jasny błękit wokół ringu */
            border: 4px solid #fff;
            display: inline-block;
            image-rendering: pixelated;
        }
        .btn-reset {
            margin-top: 15px;
            background: #e60012;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-box">Retro Boks AI vs AI (Styl Pegasus)</div>
    <br>
    <canvas id="boxingCanvas" width="300" height="240"></canvas>
    <br>
    <button class="btn-reset" onclick="resetMatch()">NASTĘPNA RUNDA / RESET</button>

<script>
const canvas = document.getElementById("boxingCanvas");
const ctx = canvas.getContext("2d");

// --- STATYSTYKI BOKSERÓW ---
let boxerA = { name: "ALEX", x: 90,  y: 120, hp: 100, color: "#00a8cc", gloves: "#ffcc00", state: "IDLE", timer: 0, speed: 0.07, power: 8, dodgeSkill: 0.15 };
let boxerB = { name: "BOB",  x: 170, y: 120, hp: 100, color: "#e60012", gloves: "#ffffff", state: "IDLE", timer: 0, speed: 0.06, power: 10, dodgeSkill: 0.10 };

let matchOver = false;
let globalTimer = 0;
let logText = "WALKA URUCHOMIONA!";

function resetMatch() {
    boxerA.hp = 100; boxerA.state = "IDLE"; boxerA.timer = 0;
    boxerB.hp = 100; boxerB.state = "IDLE"; boxerB.timer = 0;
    
    // Losowanie formy zawodników na nową rundę
    boxerA.speed = 0.05 + Math.random() * 0.05;
    boxerA.power = 6 + Math.floor(Math.random() * 6);
    boxerB.speed = 0.05 + Math.random() * 0.05;
    boxerB.power = 6 + Math.floor(Math.random() * 6);
    
    matchOver = false;
    logText = "RUNDA ROZPOCZĘTA!";
}

function updateAI(p, enemy) {
    if (matchOver) return;

    p.timer++;

    // Powrót do pozycji neutralnej po akcji
    if ((p.state === "PUNCH" || p.state === "DODGE" || p.state === "HIT") && p.timer > 15) {
        p.state = "IDLE";
    }

    // Decyzje AI podejmowane co kilka klatek
    if (p.state === "IDLE" && Math.random() < p.speed) {
        let action = Math.random();
        
        if (action < 0.65) {
            // Decyzja o ciosie
            p.state = "PUNCH";
            p.timer = 0;
            
            // Sprawdzenie czy przeciwnik zrobił unik
            if (enemy.state === "DODGE") {
                logText = `${enemy.name} ROBI UNIK!`;
            } else {
                // Trafienie!
                enemy.state = "HIT";
                enemy.timer = 0;
                enemy.hp -= p.power;
                logText = `${p.name} TRAFIA ZA ${p.power} HP!`;
                if (enemy.hp <= 0) {
                    enemy.hp = 0;
                    matchOver = true;
                    logText = `K.O.! WYGRYWA ${p.name}!`;
                }
            }
        } else if (action < 0.85) {
            // Decyzja o uniku (przygotowanie na cios)
            p.state = "DODGE";
            p.timer = 0;
        }
    }
}

function drawBoxer(p, isLeft) {
    let drawX = p.x;
    let drawY = p.y;

    // Przesunięcie grafiki w zależności od stanu (animacja retro duszka)
    if (p.state === "PUNCH") {
        drawX += isLeft ? 12 : -12; // Wypad do przodu przy ciosie
    }
    if (p.state === "DODGE") {
        drawY += 8; // Kucki / Unik w dół
    }
    if (p.state === "HIT") {
        drawX += isLeft ? -6 : 6; // Odrzucenie głowy po ciosie
    }

    // Korpus (Spodenki i tors)
    ctx.fillStyle = p.color;
    ctx.fillRect(drawX, drawY + 12, 24, 24); // Spodenki
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(drawX + 2, drawY, 20, 14); // Tors/Twarz

    // Rękawice bokserskie (Wysunięte lub garda)
    ctx.fillStyle = p.gloves;
    if (p.state === "PUNCH") {
        ctx.fillRect(isLeft ? drawX + 20 : drawX - 10, drawY + 4, 12, 12); // Wysunięta pięść
    } else {
        ctx.fillRect(drawX - 4, drawY + 4, 8, 10);  // Lewa rękawica w gardzie
        ctx.fillRect(drawX + 20, drawY + 4, 8, 10); // Prawa rękawica w gardzie
    }

    // Pasek zdrowia nad głową boksera
    ctx.fillStyle = "#e60012";
    ctx.fillRect(p.x - 5, p.y - 15, 34, 5);
    ctx.fillStyle = "#00ff00";
    ctx.fillRect(p.x - 5, p.y - 15, (p.hp / 100) * 34, 5);
}

function updateAndRender() {
    globalTimer++;
    
    // Logika walki
    if (!matchOver) {
        updateAI(boxerA, boxerB);
        updateAI(boxerB, boxerA);
    }

    // --- RENDEROWANIE RETRO ---
    // Tło ringu (Klasyczny granat/ciemny niebieski z widowni NES)
    ctx.fillStyle = "#000088";
    ctx.fillRect(0, 0, 300, 240);

    // Mata ringu (Szara / Jasnoniebieska)
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(30, 60, 240, 160);

    // Liny ringu (Czerwono-białe paski)
    ctx.fillStyle = "#e60012";
    ctx.fillRect(30, 56, 240, 4);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(30, 52, 240, 2);

    // Narożniki ringu (Słupki)
    ctx.fillStyle = "#111111";
    ctx.fillRect(26, 50, 6, 170);
    ctx.fillRect(268, 50, 6, 170);

    // Rysowanie bokserów
    drawBoxer(boxerA, true);
    drawBoxer(boxerB, false);

    // Górny panel tekstowy (Komentator walki)
    ctx.fillStyle = "#000000";
    ctx.fillRect(10, 10, 280, 36);
    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(10, 10, 280, 36);

    ctx.fillStyle = "#ffffff";
    ctx.font = "10px monospace";
    ctx.fillText(`HP A: ${boxerA.hp} | HP B: ${boxerB.hp}`, 20, 24);
    ctx.fillStyle = "#ffcc00";
    ctx.fillText(logText, 20, 40);

    requestAnimationFrame(updateAndRender);
}

// Start pętli
updateAndRender();
</script>

</body>
</html>
