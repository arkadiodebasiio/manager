<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Symulacja Tenisa - Zawodnicy AI</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #2e8b57;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }
        #scoreboard {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="scoreboard">Gracz A: 0 | Gracz B: 0</div>
    <canvas id="tennisCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("tennisCanvas");
const ctx = canvas.getContext("2d");
const scoreboard = document.getElementById("scoreboard");

// --- STATYSTYKI POSTACI ---
const PlayerA = {
    x: 40,
    y: canvas.height / 2 - 40,
    width: 20,
    height: 70,
    score: 0,
    speed: 4.8,
    reaction: 0.18,
    power: 1.1,
    color: "#3498db",
    name: "Alex"
};

const PlayerB = {
    x: canvas.width - 60,
    y: canvas.height / 2 - 40,
    width: 20,
    height: 70,
    score: 0,
    speed: 4.2,
    reaction: 0.22,
    power: 1.2,
    color: "#e74c3c",
    name: "Bob"
};

// --- PIŁKA ---
const ball = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 5,
    vy: 2.5,
    radius: 8,
    speed: 5.5
};

// --- AI ZAWODNIKÓW ---
function moveAI(player, isLeft) {
    let targetY = ball.y - player.height / 2;
    let diff = targetY - player.y;
    
    if (Math.abs(diff) > 8) {
        if (diff > 0) {
            player.y += Math.min(player.speed, diff * player.reaction * 10);
        } else {
            player.y -= Math.min(player.speed, Math.abs(diff) * player.reaction * 10);
        }
    }

    if (player.y < 0) player.y = 0;
    if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
}

// --- FIZYKA ---
function update() {
    moveAI(PlayerA, true);
    moveAI(PlayerB, false);

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.vy = -ball.vy;
    }

    // Kolizja z Graczem A
    if (ball.x - ball.radius < PlayerA.x + PlayerA.width && ball.x > PlayerA.x) {
        if (ball.y > PlayerA.y && ball.y < PlayerA.y + PlayerA.height) {
            let collidePoint = (ball.y - (PlayerA.y + PlayerA.height / 2)) / (PlayerA.height / 2);
            let angleRad = (Math.PI / 4) * collidePoint;
            ball.vx = Math.cos(angleRad) * ball.speed * PlayerA.power;
            ball.vy = Math.sin(angleRad) * ball.speed * PlayerA.power;
        } else if (ball.x < PlayerA.x) {
            PlayerB.score++;
            resetBall();
        }
    }

    // Kolizja z Graczem B
    if (ball.x + ball.radius > PlayerB.x && ball.x < PlayerB.x + PlayerB.width) {
        if (ball.y > PlayerB.y && ball.y < PlayerB.y + PlayerB.height) {
            let collidePoint = (ball.y - (PlayerB.y + PlayerB.height / 2)) / (PlayerB.height / 2);
            let angleRad = (Math.PI / 4) * collidePoint;
            ball.vx = -Math.cos(angleRad) * ball.speed * PlayerB.power;
            ball.vy = Math.sin(angleRad) * ball.speed * PlayerB.power;
        } else if (ball.x > PlayerB.x + PlayerB.width) {
            PlayerA.score++;
            resetBall();
        }
    }

    scoreboard.innerHTML = `${PlayerA.name} (${PlayerA.score}) vs ${PlayerB.name} (${PlayerB.score})`;
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.vx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
    ball.vy = (Math.random() * 2 - 1) * ball.speed;
}

// --- RENDEROWANIE POSTACI ---
function drawPlayer(p, facingRight) {
    // Tułów (ciało)
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y + 15, p.width, p.height - 25);

    // Głowa
    ctx.beginPath();
    ctx.arc(p.x + p.width / 2, p.y + 10, 10, 0, Math.PI * 2);
    ctx.fillStyle = "#f39c12"; // Kolor skóry
    ctx.fill();

    // Rakieta / Ręka trzymająca odbijak
    ctx.fillStyle = "#fff";
    let rx = facingRight ? p.x + p.width : p.x - 6;
    ctx.fillRect(rx, p.y + 20, 6, 35);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Siatka kortu
    ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    // Rysowanie zawodników
    drawPlayer(PlayerA, true);
    drawPlayer(PlayerB, false);

    // Piłka
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
