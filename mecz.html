<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cyber Boxing Arena</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        canvas { background: #1a1a1a; border: 4px solid #d4af37; border-radius: 8px; display: block; margin: 20px auto; }
        .hud { display: flex; justify-content: space-between; width: 700px; margin: 0 auto; font-size: 16px; font-weight: bold; }
        .bar-bg { background: #333; width: 250px; height: 18px; border: 2px solid #555; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s; }
        #commentary { background: #000; color: #00ffaa; font-family: monospace; padding: 10px; height: 80px; width: 676px; margin: 10px auto; text-align: left; border-radius: 4px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>CYBER BOXING ARENA</h1>
    <div class="hud">
        <div>RED <div class="bar-bg"><div id="hp1" class="bar-fill" style="background: #ff2255; width: 100%;"></div></div></div>
        <div>BLUE <div class="bar-bg"><div id="hp2" class="bar-fill" style="background: #00ccff; width: 100%;"></div></div></div>
    </div>
    <canvas id="boxingRing" width="700" height="320"></canvas>
    <div id="commentary"></div>

    <script>
        const canvas = document.getElementById("boxingRing");
        const ctx = canvas.getContext("2d");
        const commBox = document.getElementById("commentary");

        function logEvent(text, color = "#00ffaa") {
            commBox.innerHTML += `<span style="color: ${color}">[SYSTEM] ${text}</span><br>`;
            commBox.scrollTop = commBox.scrollHeight;
        }

        let p1 = { x: 180, y: 260, hp: 100, color: "#ff2255", facing: 1, p: 0, s: 1, hit: 0 };
        let p2 = { x: 520, y: 260, hp: 100, color: "#00ccff", facing: -1, p: 0, s: 1, hit: 0 };
        let over = false;

        function drawBot(f) {
            ctx.save();
            if (f.hit > 0) f.hit--;
            ctx.shadowBlur = f.hit ? 25 : 10;
            ctx.shadowColor = f.hit ? "#fff" : f.color;

            // Nogi
            ctx.strokeStyle = f.hit ? "#fff" : f.color;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(f.x - 12, f.y); ctx.lineTo(f.x, f.y - 40);
            ctx.moveTo(f.x + 15, f.y); ctx.lineTo(f.x, f.y - 40);
            ctx.stroke();

            // Korpus
            ctx.fillStyle = "#1c1c1c";
            ctx.fillRect(f.x - 10 * f.facing, f.y - 90, 20, 50);

            // Głowa
            ctx.beginPath();
            ctx.arc(f.x - 4 * f.facing, f.y - 105, 12, 0, Math.PI * 2);
            ctx.fillStyle = "#222"; ctx.fill();
            ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.stroke();

            // Rękawica / Tarcza
            let rx = 20 + (p1 === f ? p1.p * 70 : p2.p * 70);
            ctx.beginPath();
            ctx.arc(f.x - 4 * f.facing + (rx * f.facing), f.y - 80, 16, 0, Math.PI * 2);
            ctx.fillStyle = f.hit ? "#fff" : f.color; ctx.fill();
            ctx.restore();
        }

        function loop() {
            if (over) return;
            ctx.clearRect(0, 0, 700, 320);

            let d = Math.abs(p2.x - p1.x);
            p1.facing = p2.x > p1.x ? 1 : -1;
            p2.facing = p1.x > p2.x ? 1 : -1;

            if (p1.p == 0 && p2.p == 0) {
                if (d > 110) { p1.x += 1; p2.x -= 1; }
                else {
                    if (Math.random() > 0.95) p1.p = 0.1;
                    if (Math.random() > 0.95) p2.p = 0.1;
                }
            }

            if (p1.p > 0) {
                p1.p += 0.15 * p1.s;
                if (p1.p >= 1) { p1.s = -1; if (d < 120) { p2.hp -= 10; p2.hit = 5; document.getElementById("hp2").style.width = p2.hp + "%"; logEvent("RED trafia w BLUE!", "#ff2255"); } }
                if (p1.p <= 0) { p1.p = 0; p1.s = 1; }
            }
            if (p2.p > 0) {
                p2.p += 0.15 * p2.s;
                if (p2.p >= 1) { p2.s = -1; if (d < 120) { p1.hp -= 10; p1.hit = 5; document.getElementById("hp1").style.width = p1.hp + "%"; logEvent("BLUE trafia w RED!", "#00ccff"); } }
                if (p2.p <= 0) { p2.p = 0; p2.s = 1; }
            }

            if (p1.hp <= 0 || p2.hp <= 0) { over = true; logEvent("KONIEC WALKI!", "#ffcc00"); }

            drawBot(p1);
            drawBot(p2);
            requestAnimationFrame(loop);
        }
        logEvent("Start starcia.");
        loop();
    </script>
</body>
</html>
