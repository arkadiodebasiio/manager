<!DOCTYPE html>
<html>
<head>
    <title>CM4 Professional 2D Engine</title>
    <style>
        body { background: #0c1a10; color: #fff; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 5px; overflow: hidden; }
        canvas { background: #134e24; border: 3px solid #fff; display: block; margin: 5px auto; width: 620px; height: 380px; }
        #commentary { background: #000; border: 1px solid #333; width: 600px; min-height: 35px; margin: 5px auto; padding: 8px; font-size: 13px; color: #00ff00; text-align: left; }
        #scoreboard { font-size: 20px; font-weight: bold; font-family: Arial, sans-serif; margin: 3px; }
    </style>
</head>
<body>
    <div id="scoreboard">🟥 TEAM A <span id="sa">0</span> - <span id="sb">0</span> TEAM B 🟦</div>
    <canvas id="cmCanvas" width="640" height="400"></canvas>
    <div id="commentary">> Wczytywanie pełnej matrycy taktycznej 11v11...</div>

    <script>
        const canvas = document.getElementById("cmCanvas"); const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");
        let scoreA = 0; let scoreB = 0;

        // PEŁNA BAZA 22 ZAWODNIKÓW (Formacje 4-4-2 dla obu stron)
        let players = [
            // TEAM A (Czerwoni) - Atakuje w prawo
            { id: "A1",  team: "A", nr: 1,  role: "GK",  bx: 35,  by: 200, pas: 10, sho: 1,  def: 16, name: "Kowalski" },
            { id: "A2",  team: "A", nr: 2,  role: "DEF", bx: 130, by: 60,  pas: 11, sho: 4,  def: 15, name: "Piszczek" },
            { id: "A3",  team: "A", nr: 3,  role: "DEF", bx: 130, by: 150, pas: 10, sho: 3,  def: 18, name: "Glik" },
            { id: "A4",  team: "A", nr: 4,  role: "DEF", bx: 130, by: 250, pas: 11, sho: 2,  def: 17, name: "Bednarek" },
            { id: "A5",  team: "A", nr: 5,  role: "DEF", bx: 130, by: 340, pas: 12, sho: 5,  def: 14, name: "Bereszyński" },
            { id: "A6",  team: "A", nr: 6,  role: "MID", bx: 260, by: 80,  pas: 15, sho: 9,  def: 13, name: "Grosicki" },
            { id: "A7",  team: "A", nr: 8,  role: "MID", bx: 250, by: 160, pas: 17, sho: 11, def: 12, name: "Zieliński" },
            { id: "A8",  team: "A", nr: 7,  role: "MID", bx: 250, by: 240, pas: 14, sho: 10, def: 15, name: "Krychowiak" },
            { id: "A9",  team: "A", nr: 11, role: "MID", bx: 260, by: 320, pas: 16, sho: 8,  def: 11, name: "Frankowski" },
            { id: "A10", team: "A", nr: 9,  role: "ATT", bx: 420, by: 140, pas: 12, sho: 19, def: 4,  name: "Lewandowski" },
            { id: "A11", team: "A", nr: 10, role: "ATT", bx: 420, by: 260, pas: 13, sho: 17, def: 5,  name: "Milik" },

            // TEAM B (Niebiescy) - Atakuje w lewo
            { id: "B1",  team: "B", nr: 1,  role: "GK",  bx: 605, by: 200, pas: 12, sho: 1,  def: 18, name: "Buffon" },
            { id: "B2",  team: "B", nr: 2,  role: "DEF", bx: 510, by: 60,  pas: 11, sho: 3,  def: 16, name: "Zambrotta" },
            { id: "B3",  team: "B", nr: 5,  role: "DEF", bx: 510, by: 150, pas: 10, sho: 2,  def: 19, name: "Cannavaro" },
            { id: "B4",  team: "B", nr: 6,  role: "DEF", bx: 510, by: 250, pas: 9,  sho: 4,  def: 17, name: "Nesta" },
            { id: "B5",  team: "B", nr: 3,  role: "DEF", bx: 510, by: 340, pas: 13, sho: 5,  def: 18, name: "Maldini" },
            { id: "B6",  team: "B", nr: 7,  role: "MID", bx: 380, by: 80,  pas: 15, sho: 12, def: 10, name: "Camoranesi" },
            { id: "B7",  team: "B", nr: 8,  role: "MID", bx: 390, by: 160, pas: 18, sho: 14, def: 11, name: "Pirlo" },
            { id: "B8",  team: "B", nr: 4,  role: "MID", bx: 390, by: 240, pas: 12, sho: 9,  def: 16, name: "Gattuso" },
            { id: "B9",  team: "B", nr: 11, role: "MID", bx: 380, by: 320, pas: 16, sho: 13, def: 8,  name: "Nedved" },
            { id: "B10", team: "B", nr: 10, role: "ATT", bx: 220, by: 140, pas: 14, sho: 18, def: 3,  name: "Totti" },
            { id: "B11", team: "B", nr: 9,  role: "ATT", bx: 220, by: 260, pas: 11, sho: 17, def: 4,  name: "Inzaghi" }
        ];

        // Inicjalizacja pozycji startowych
        players.forEach(p => { p.x = p.bx; p.y = p.by; p.tx = p.bx; p.ty = p.by; });
        let ball = { x: 320, y: 200, tx: 320, ty: 200 };
        let pPosiadajacy = players.find(p => p.id === "A10"); 
        let fazaMeczu = "DECYZJA"; let czasTrwaniaAnimacji = 0;

        function wypiszKomentarz(tekst, kolor = "#00ff00") {
            comment.style.color = kolor; comment.innerText = "⚽ " + tekst;
        }

        function resetPoBramce() {
            players.forEach(p => { p.tx = p.bx; p.ty = p.by; p.x = p.bx; p.y = p.by; });
            ball.x = 320; ball.y = 200; ball.tx = 320; ball.ty = 200;
            fazaMeczu = "DECYZJA";
        }
        // MATRYCA LOGICZNA SILNIKA MECZOWEGO
        function silnikMeczowyTick() {
            if (fazaMeczu === "DECYZJA") {
                czasTrwaniaAnimacji = 40; 
                let koledzy = players.filter(p => p.team === pPosiadajacy.team && p.id !== pPosiadajacy.id);
                let przeciwnicy = players.filter(p => p.team !== pPosiadajacy.team);
                let losowaKostka = Math.random();

                let kierunek = pPosiadajacy.team === "A" ? 1 : -1;

                // Ruch formacji na boisku
                players.forEach(p => {
                    if (p.role === "GK") return;
                    if (p.team === pPosiadajacy.team) {
                        p.tx = p.bx + (kierunek * 60);
                        p.ty = p.by + (Math.random() * 40 - 20);
                    } else {
                        p.tx = p.bx + (kierunek * 30);
                        p.ty = p.by + (ball.y - p.by) * 0.3;
                    }
                });

                // DECYZJA A: PODANIE DO PRZODU LUB DO BOKU
                if (losowaKostka < 0.55) {
                    let odbiorca = koledzy[Math.floor(Math.random() * koledzy.length)];
                    let losowyObronca = przeciwnicy[Math.floor(Math.random() * przeciwnicy.length)];
                    
                    ball.tx = odbiorca.x + (kierunek * 15); 
                    ball.ty = odbiorca.y;
                    odbiorca.tx = ball.tx; odbiorca.ty = ball.ty;

                    let szansaNaPrzechwyt = (losowyObronca.def / 20) * 0.35; 
                    let jakoscPodania = (pPosiadajacy.pas / 20);

                    fazaMeczu = "ANIMACJA";
                    if (jakoscPodania > szansaNaPrzechwyt) {
                        pPosiadajacy = odbiorca;
                        wypiszKomentarz(`${pPosiadajacy.name} napędza atak precyzyjnym podaniem.`, "#00ff00");
                    } else {
                        pPosiadajacy = losowyObronca; 
                        ball.tx = losowyObronca.tx; ball.ty = losowyObronca.ty;
                        wypiszKomentarz(`Przechwyt! Szyk obronny przerwany przez: ${losowyObronca.name}.`, "#ff5722");
                    }
                } 
                // DECYZJA B: INDYWIDUALNY RAJD
                else if (losowaKostka < 0.80) {
                    pPosiadajacy.tx = pPosiadajacy.x + (kierunek * 50);
                    pPosiadajacy.ty = pPosiadajacy.y + (Math.random() * 40 - 20);
                    ball.tx = pPosiadajacy.tx; ball.ty = pPosiadajacy.ty;
                    
                    fazaMeczu = "ANIMACJA";
                    wypiszKomentarz(`${pPosiadajacy.name} przedziera się przez formację rywali!`, "#00e5ff");
                } 
                // DECYZJA C: POTĘŻNY STRZAŁ NA BRAMKĘ
                else {
                    let strefaStrzalu = pPosiadajacy.team === "A" ? pPosiadajacy.x > 250 : pPosiadajacy.x < 390;
                    
                    if (strefaStrzalu) {
                        let bramkarz = players.find(p => p.team !== pPosiadajacy.team && p.role === "GK");
                        ball.tx = pPosiadajacy.team === "A" ? 635 : 5;
                        ball.ty = 180 + Math.random() * 40; // Celowanie w bramkę

                        let silaStrzalu = (pPosiadajacy.sho / 20) * Math.random();
                        let obronaBramkarza = (bramkarz.def / 20) * Math.random();

                        fazaMeczu = "STRZAL";
                        if (silaStrzalu > obronaBramkarza) {
                            wypiszKomentarz(`GOOOOL! Niewiarygodne uderzenie! Bramkę zdobywa ${pPosiadajacy.name}!`, "#ffff00");
                            if (pPosiadajacy.team === "A") scoreA++; else scoreB++;
                            document.getElementById("sa").innerText = scoreA;
                            document.getElementById("sb").innerText = scoreB;
                        } else {
                            wypiszKomentarz(`Fatalne pudło lub genialna parada! ${bramkarz.name} pewnie broni strzał.`, "#ff00e1");
                            pPosiadajacy = bramkarz;
                            ball.tx = bramkarz.bx; ball.ty = bramkarz.by;
                        }
                    } else {
                        pPosiadajacy.tx += kierunek * 20;
                        ball.tx = pPosiadajacy.tx;
                        fazaMeczu = "ANIMACJA";
                    }
                }
            }

            // AKTUALIZACJA POZYCJI (Płynny ruch kropek oraz piłki)
            players.forEach(p => {
                p.x += (p.tx - p.x) * 0.1;
                p.y += (p.ty - p.y) * 0.1;
            });

            if (fazaMeczu === "DECYZJA" || fazaMeczu === "ANIMACJA") {
                ball.x += (ball.tx - ball.x) * 0.12;
                ball.y += (ball.ty - ball.y) * 0.12;
            } else if (fazaMeczu === "STRZAL") {
                ball.x += (ball.tx - ball.x) * 0.2; 
                ball.y += (ball.ty - ball.y) * 0.2;
            }

            if (czasTrwaniaAnimacji > 0) {
                czasTrwaniaAnimacji--;
            } else {
                if (comment.innerText.includes("GOOOOL")) {
                    resetPoBramce();
                    pPosiadajacy = players.find(p => p.team === (pPosiadajacy.team === "A" ? "B" : "A") && p.role === "ATT");
                } else {
                    fazaMeczu = "DECYZJA";
                    ball.tx = pPosiadajacy.x; ball.ty = pPosiadajacy.y;
                }
            }
        }

        // RYSOWANIE GRAFIKI 2D (Boisko, linie i zawodnicy)
        function renderujMecz() {
            ctx.fillStyle = "#134e24"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20); 
            ctx.beginPath(); ctx.moveTo(canvas.width / 2, 10); ctx.lineTo(canvas.width / 2, canvas.height - 10); ctx.stroke(); 
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2); ctx.stroke(); 
            
            ctx.strokeRect(10, 100, 80, 200); ctx.strokeRect(canvas.width - 90, 100, 80, 200); 
            ctx.fillStyle = "#0c1a10"; ctx.fillRect(2, 170, 8, 60); ctx.fillRect(canvas.width - 10, 170, 8, 60); 

            // Rysowanie 22 zawodników
            players.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
                ctx.fillStyle = p.team === "A" ? "#ff1744" : "#2979ff"; 
                ctx.fill();
                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 9px Arial";
                ctx.fillText(p.nr, p.x - 4, p.y + 3);

                if (p === pPosiadajacy || p.role === "ATT") {
                    ctx.font = "8px Courier New"; ctx.fillStyle = "rgba(255,255,255,0.8)";
                    ctx.fillText(p.name, p.x - 20, p.y - 12);
                }
            });

            // Rysowanie piłki meczowej
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff"; ctx.fill();
            ctx.strokeStyle = "#000000"; ctx.stroke();
        }

        // Główna pętla gry (60 klatek na sekundę)
        function petlaGry() {
            silnikMeczowyTick();
            renderujMecz();
            requestAnimationFrame(petlaGry);
        }

        setTimeout(petlaGry, 1000);
    </script>
</body>
</html>
