<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8"><title>Bokser Retro</title>
    <style>body { margin: 0; overflow: hidden; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; } canvas { display: block; box-shadow: 0 0 30px #000; }</style>
</head>
<body>
<canvas id="ringCanvas"></canvas>
<script>
    const canvas = document.getElementById('ringCanvas'), ctx = canvas.getContext('2d'), ringSize = 500;
    canvas.width = canvas.height = ringSize;

    const ringCenter = 250, orbitRadius = 110;
    const b = { angle: Math.PI/2, speed: 0.035, radius: 24, anim: 0, pTimer: 0, punching: false, pProg: 0, isMoving: false, wasAbove: true };

    function drawRing() {
        ctx.fillStyle = '#d4ac0d'; ctx.fillRect(50, 50, 400, 400);
        ctx.strokeStyle = '#b7950b'; ctx.lineWidth = 2;
        for (let i = 70; i < 450; i += 40) { ctx.strokeRect(i, 50, 0, 400); }
        
        const corners = [{x:50,y:50,c:'#c0392b'}, {x:450,y:50,c:'#2980b9'}, {x:50,y:450,c:'#fff'}, {x:450,y:450,c:'#fff'}];
        for (let o = 10; o <= 30; o += 10) {
            ctx.strokeStyle = o === 10 ? '#fff' : (o === 20 ? '#c0392b' : '#2980b9');
            ctx.lineWidth = 3; ctx.strokeRect(50 - o/2, 50 - o/2, 400 + o, 400 + o);
        }
        corners.forEach(c => {
            ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI*2); ctx.fillStyle = c.c; ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
        });
    }

    function update() {
        b.anim += 0.2; b.pTimer++;
        const curSin = Math.sin(b.anim);
        
        if (curSin > 0 && !b.wasAbove) { b.isMoving = Math.random() < 0.30; }
        b.wasAbove = curSin > 0;

        if (b.isMoving && curSin > 0) { b.angle -= b.speed * curSin; }

        if (!b.punching && b.pTimer > 60 && Math.random() < 0.04) { b.punching = true; b.pProg = 0; b.pTimer = 0; }
        if (b.punching) { b.pProg += 0.25; if (b.pProg >= Math.PI) b.punching = false; }
    }

    function drawBoxer() {
        const baseX = ringCenter + Math.cos(b.angle) * orbitRadius, baseY = ringCenter + Math.sin(b.angle) * orbitRadius;
        const bounce = Math.sin(b.anim) * 4, tilt = Math.cos(b.anim) * 1.5;
        const pExt = b.punching ? Math.sin(b.pProg) * 35 : 0, lean = -pExt * 0.25;

        ctx.beginPath(); ctx.ellipse(baseX, baseY + b.radius, b.radius - Math.abs(bounce), 5, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();

        ctx.save();
        ctx.translate(baseX + tilt, baseY + bounce); ctx.rotate(b.angle - Math.PI/2);

        // Ciało
        ctx.beginPath(); ctx.arc(0, lean, b.radius, 0, Math.PI*2); ctx.fillStyle = '#e74c3c'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

        // Rękawice (Garda i Cios)
        const lGloveY = (lean - b.radius + 4) - pExt, rGloveY = (lean - b.radius + 4) + Math.sin(b.anim * 2) * 2;
        
        if (b.punching && pExt > 5) {
            ctx.beginPath(); ctx.moveTo(-12, lean - 10); ctx.lineTo(-12, lGloveY);
            ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 5; ctx.stroke();
            ctx.lineWidth = 2; ctx.strokeStyle = '#fff';
        }

        [{-12: lGloveY}, {12: rGloveY}].forEach(g => {
            const x = Object.keys(g), y = g[x];
            ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fillStyle = '#d35400'; ctx.fill(); ctx.stroke();
        });

        // Numer retro
        ctx.save(); ctx.translate(0, lean); ctx.rotate(-(b.angle - Math.PI/2));
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('1', 0, 0); ctx.restore();

        ctx.restore();
    }

    function loop() { ctx.clearRect(0,0,ringSize,ringSize); drawRing(); update(); drawBoxer(); requestAnimationFrame(loop); }
    loop();
</script>
</body>
</html>
