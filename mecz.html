<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dwóch bokserów w ringu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="ringCanvas"></canvas>

<script>
    const canvas = document.getElementById('ringCanvas');
    const ctx = canvas.getContext('2d');

    const ringSize = 500;
    canvas.width = ringSize;
    canvas.height = ringSize;

    // Środek ringu (tu stoi niebieski bokser)
    const ringCenter = { x: canvas.width / 2, y: canvas.height / 2 };
    const orbitRadius = 110; 

    // Czerwony bokser (poruszający się)
    const boxerRed = {
        angle: Math.PI / 2, 
        orbitSpeed: 0.035,
        radius: 24,
        color: '#e74c3c',
        number: '1',
        animTimer: 0,
        punchTimer: 0,     
        isPunching: false, 
        punchProgress: 0,
        isMovingThisJump: false,
        wasAboveZero: true
    };

    // Niebieski bokser (stojący w miejscu na środku)
    const boxerBlue = {
        x: ringCenter.x,
        y: ringCenter.y,
        radius: 24,
        color: '#2980b9',
        number: '2',
        animTimer: 0
    };

    function drawRing() {
        ctx.fillStyle = '#d4ac0d';
        ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);

        ctx.strokeStyle = '#b7950b';
        ctx.lineWidth = 2;
        for (let i = 70; i < canvas.width - 50; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 50);
            ctx.lineTo(i, canvas.height - 50);
            ctx.stroke();
        }

        const corners = [
            {x: 50, y: 50, color: '#c0392b'},
            {x: canvas.width - 50, y: 50, color: '#2980b9'},
            {x: 50, y: canvas.height - 50, color: '#fff'},
            {x: canvas.width - 50, y: canvas.height - 50, color: '#fff'}
        ];

        for (let offset = 10; offset <= 30; offset += 10) {
            ctx.strokeStyle = offset === 10 ? '#fff' : (offset === 20 ? '#c0392b' : '#2980b9');
            ctx.lineWidth = 3;
            ctx.strokeRect(50 - offset/2, 50 - offset/2, canvas.width - 100 + offset, canvas.height - 100 + offset);
        }

        corners.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = c.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

    function update() {
        boxerRed.animTimer += 0.2;
        boxerRed.punchTimer += 1;
        boxerBlue.animTimer += 0.2; // Niebieski też sprężyście skacze w miejscu

        // Logika nieliniowych skoków czerwonego
        const currentSin = Math.sin(boxerRed.animTimer);
        if (currentSin > 0 && !boxerRed.wasAboveZero) {
            boxerRed.isMovingThisJump = Math.random() < 0.30;
        }
        boxerRed.wasAboveZero = (currentSin > 0);

        if (boxerRed.isMovingThisJump && currentSin > 0) {
            boxerRed.angle -= boxerRed.orbitSpeed * currentSin; 
        }

        // Inicjacja ciosu czerwonego
        if (!boxerRed.isPunching && boxerRed.punchTimer > 60 && Math.random() < 0.04) {
            boxerRed.isPunching = true;
            boxerRed.punchProgress = 0;
            boxerRed.punchTimer = 0;
        }

        if (boxerRed.isPunching) {
            boxerRed.punchProgress += 0.25;
            if (boxerRed.punchProgress >= Math.PI) {
                boxerRed.punchProgress = 0;
                boxerRed.isPunching = false;
            }
        }
    }

    function drawBlueBoxer() {
        // Niebieski stoi na środku i lekko skacze
        const bounce = Math.sin(boxerBlue.animTimer) * 3;
        const currentY = boxerBlue.y + bounce;
        const currentX = boxerBlue.x;

        // Cień
        ctx.beginPath();
        ctx.ellipse(boxerBlue.x, boxerBlue.y + boxerBlue.radius, boxerBlue.radius - Math.abs(bounce), 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        // Ciało niebieskiego
        ctx.beginPath();
        ctx.arc(currentX, currentY, boxerBlue.radius, 0, Math.PI * 2);
        ctx.fillStyle = boxerBlue.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Rękawice (ustawione w stronę dolnej części ringu, gdzie zaczyna czerwony)
        const gloveRadius = 7;
        ctx.beginPath();
        ctx.arc(currentX - 12, currentY + boxerBlue.radius - 4, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(currentX + 12, currentY + boxerBlue.radius - 4, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Numerek "2"
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boxerBlue.number, currentX, currentY);
    }

    function drawRedBoxer() {
        const baseX = ringCenter.x + Math.cos(boxerRed.angle) * orbitRadius;
        const baseY = ringCenter.y + Math.sin(boxerRed.angle) * orbitRadius;

        const bounceOffset = Math.sin(boxerRed.animTimer) * 4;
        const tiltOffset = Math.cos(boxerRed.animTimer) * 1.5;

        const punchExtension = boxerRed.isPunching ? Math.sin(boxerRed.punchProgress) * 35 : 0;
        const bodyLean = punchExtension * 0.25;

        // Cień czerwonego
        ctx.beginPath();
        ctx.ellipse(baseX, baseY + boxerRed.radius, boxerRed.radius - Math.abs(bounceOffset), 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        ctx.save();
        ctx.translate(baseX + tiltOffset, baseY + bounceOffset);
        ctx.rotate(boxerRed.angle - Math.PI / 2); 

        const currentY = -bodyLean;
        const currentX = 0;

        // Ciało czerwonego
        ctx.beginPath();
        ctx.arc(currentX, currentY, boxerRed.radius, 0, Math.PI * 2);
        ctx.fillStyle = boxerRed.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Garda czerwonego
        const gloveRadius = 7;
        const leftGloveBaseX = currentX - 12;
        const rightGloveBaseX = currentX + 12;
        const gloveBaseY = currentY - boxerRed.radius + 4;

        ctx.beginPath();
        ctx.arc(rightGloveBaseX, gloveBaseY + Math.sin(boxerRed.animTimer * 2) * 2, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        const finalLeftGloveY = gloveBaseY - punchExtension;

        if (boxerRed.isPunching && punchExtension > 5) {
            ctx.beginPath();
            ctx.moveTo(leftGloveBaseX, currentY - 10);
            ctx.lineTo(leftGloveBaseX, finalLeftGloveY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
        }

        ctx.beginPath();
        ctx.arc(leftGloveBaseX, finalLeftGloveY, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Numer "1"
        ctx.save();
        ctx.translate(currentX, currentY);
        ctx.rotate(-(boxerRed.angle - Math.PI / 2)); 
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boxerRed.number, 0, 0);
        ctx.restore();

        ctx.restore(); 
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRing();
        update();
        drawBlueBoxer();
        drawRedBoxer();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
