<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Test Ekranu</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        canvas {
            background-color: #5c94fc; /* Jawny, mocny kolor tła w CSS */
            border: 4px solid #fff;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h2>Test widoczności Canvas</h2>
    <canvas id="testCanvas" width="256" height="240"></canvas>

<script>
const canvas = document.getElementById("testCanvas");
const ctx = canvas.getContext("2d");

// Awaryjne, natychmiastowe malowanie bez pętli requestAnimationFrame
ctx.fillStyle = "#c84c0c";
ctx.fillRect(0, 100, 256, 140); // Bieżnia

ctx.fillStyle = "#ffff00";
ctx.fillRect(50, 120, 16, 20);  // Żółty kwadrat (postać)

ctx.fillStyle = "#ffffff";
ctx.font = "12px monospace";
ctx.fillText("JEŚLI TO WIDZISZ, DZIAŁA", 30, 40);
</script>

</body>
</html>
