<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Boxing Manager - Grafika PNG</title>
    <style>
        body { background: #020617; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #panel { background: #0f172a; padding: 18px; border-radius: 14px; margin-bottom: 20px; width: 340px; border: 1px solid rgba(255,255,255,0.1); }
        .row { display: flex; justify-content: space-between; margin: 8px 0; font-weight: 600; font-size: 14px; align-items: center; }
        button { background: #2563eb; color: #fff; border: none; padding: 6px 12px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        #fight-btn { background: #059669; width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; }
        canvas { border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); background: #1e1b4b; }
    </style>
</head>
<body>

    <div id="panel">
        <div class="row"><span>Punkty Trenera:</span><span id="pts" style="color:#38bdf8">5</span></div>
        <div class="row"><span>SIŁA (<span id="v-pow">12</span>):</span><button onclick="trainFighter()">+</button></div>
        <button id="fight-btn" onclick="startMatch()">Start Walki</button>
    </div>

    <canvas id="ring" width="400" height="220"></canvas>

<script>
const canvas = document.getElementById("ring");
const ctx = canvas.getContext("2d");

// --- ŁADOWANIE PRAWDZIWYCH GRAFIK (Zamiast klocków) ---
// Tutaj wklejamy adresy do darmowych lub własnych grafik PNG postaci
const imgPlayer = new Image();
imgPlayer.src = "https://vexels.com"; // Przykładowa grafika

const imgEnemy = new Image();
imgEnemy.src = "https://vexels.com";

let fighters = {
    player: { name: "ALEX", x: 80, y: 70, hp: 100, maxHp: 100, power: 12, speed: 0.05, state: "IDLE", timer: 0, img: imgPlayer },
    enemy:  { name: "BOB",  x: 220, y: 70, hp: 100, maxHp: 100, power: 14, speed: 0.06, state: "IDLE", timer: 0, img: imgEnemy }
};

let matchActive = false, matchOver = false, msg = "WCIŚNIJ START WALKI";

function trainFighter() {
    fighters.player.power += 4;
    document.getElementById("v-pow").innerText = fighters.player.power;
}

function startMatch() {
    matchOver = false; matchActive = true; msg = "WALKA TRWA!";
}

function updateAI(actor, target) {
    if (!matchActive || matchOver) return;
    actor.timer++;
    if (actor.timer > 30) {
        actor.timer = 0;
        if (Math.random() < actor.speed * 2) {
            target.hp -= actor.power;
            msg = `${actor.name} zadaje cios!`;
            if (target.hp <= 0) { target.hp = 0; matchOver = true; matchActive = false; msg = `${actor.name} WYGRYWA K.O.!`; }
        }
    }
}

function render() {
    updateAI(fighters.player, fighters.enemy);
    updateAI(fighters.enemy, fighters.player);

    // Tło ringu
    ctx.fillStyle = "#1e1b4b"; ctx.fillRect(0, 0, 400, 220);
    ctx.fillStyle = "#334155"; ctx.fillRect(30, 50, 340, 120);

    // Rysowanie prawdziwych obrazków zamiast prostokątów
    if (fighters.player.img.complete) {
        ctx.drawImage(fighters.player.img, fighters.player.x, fighters.player.y, 80, 90);
    }
    if (fighters.enemy.img.complete) {
        ctx.save();
        ctx.scale(-1, 1); // Odwrócenie przeciwnika w drugą stronę
        ctx.drawImage(fighters.enemy.img, -fighters.enemy.x - 80, fighters.enemy.y, 80, 90);
        ctx.restore();
    }

    // Paski HP
    ctx.fillStyle = "#10b981"; 
    ctx.fillRect(50, 20, fighters.player.hp * 1.2, 8);
    ctx.fillRect(230, 20, fighters.enemy.hp * 1.2, 8);

    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
