<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-3D Tennis Simulation</title>
    <style>
        body {
            background-color: #050b14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #ui {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px 28px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            background: #0f172a;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 2px solid #1e293b;
        }
    </style>
</head>
<body>

    <div id="ui">ALEX <span id="scoreA">0</span> : <span id="scoreB">0</span> BOB</div>
    <canvas id="court" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("court");
const ctx = canvas.getContext("2d");

// Statystyki postaci
const pA = { x: 400, targetX: 400, score: 0, speed: 6, color: "#38bdf8" };
const pB = { x: 400, targetX: 400, score: 0, speed: 4.5, color: "#f43f5e" };

// Piłka w przestrzeni 3D (x, y - płaszczyzna kortu, z - wysokość nad ziemią)
let ball = {
    x: 400, y: 300, z: 0,
    vx: 3, vy: 4, vz: 2,
    active: true
};

let scoreA = 0;
let scoreB = 0;

function resetBall(servingToB) {
    ball.x = 400;
    ball.y = 300;
    ball.z = 0;
    ball.vy = servingToB ? 3.5 : -3.5;
    ball.vx = (Math.random() - 0.5) * 4;
    ball.vz = 2.5;
}

function update() {
    // Ruch piłki w 3D
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z += ball.vz;
    ball.vz -= 0.12; // Grawitacja

    // Odbicie od ziemi (z <= 0)
    if (ball.z < 0) {
        ball.z = 0;
        ball.vz = -ball.vz * 0.75; // Tłumienie odbicia
    }

    // AI Gracza A (dół ekranu, y w okolicach 520)
    let destAx = ball.x;
    pA.targetX += (destAx - pA.targetX) * 0.1;
    pA.x = Math.max(200, Math.min(600, pA.targetX));

    // AI Gracza B (góra ekranu, y w okolicach 100)
    let destBx = ball.x;
    pB.targetX += (destBx - pB.targetX) * 0.08;
    pB.x = Math.max(250, Math.min(550, pB.targetX));

    // Kolizja z rakietą Gracza A (dół)
    if (ball.y > 500 && ball.y < 530 && ball.z < 25) {
        if (Math.abs(ball.x - pA.x) < 55) {
            ball.vy = -Math.abs(ball.vy) - 1.5;
            ball.vz = 3.5 + Math.random() * 2;
            ball.vx += (ball.x - pA.x) * 0.08;
        }
    }

    // Kolizja z rakietą Gracza B (góra)
    if (ball.y > 90 && ball.y < 120 && ball.z < 25) {
        if (Math.abs(ball.x - pB.x) < 55) {
            ball.vy = Math.abs(ball.vy) + 1.5;
            ball.vz = 3.5 + Math.random() * 2;
            ball.vx += (ball.x - pB.x) * 0.08;
        }
    }

    // Punkty (przelot poza kort)
    if (ball.y > 580) {
        scoreB++;
        document.getElementById("scoreB").innerText = scoreB;
        resetBall(false);
    } else if (ball.y < 60) {
        scoreA++;
        document.getElementById("scoreA").innerText = scoreA;
        resetBall(true);
    }
}

function draw() {
    ctx.clearRect(0, 0, 800, 600);

    // Kąt perspektywy kortu (trapez)
    ctx.fillStyle = "#166534";
    ctx.beginPath();
    ctx.moveTo(150, 60); ctx.lineTo(650, 60);
    ctx.lineTo(750, 540); ctx.lineTo(50, 540);
    ctx.closePath();
    ctx.fill();

    // Linie kortu w perspektywie
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Siatka na środku (y = 300)
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath();
    ctx.moveTo(100, 300); ctx.lineTo(700, 300);
    ctx.stroke();

    // Skala głębi (im wyżej na ekranie, tym mniejszy obiekt)
    let scaleB = 0.5 + (ball.y / 600) * 0.5;
    let ballScreenY = ball.y - (ball.z * 3);

    // Cień piłki na trapezie kortu
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 7 * scaleB, 0, Math.PI * 2);
    ctx.fill();

    // Zawodnik B (Góra - mniejszy, bo dalej)
    drawPlayer(pB.x, 100, 0.65, pB.color);

    // Zawodnik A (Dół - większy, bo blisko)
    drawPlayer(pA.x, 520, 1.0, pA.color);

    // Piłka właściwa
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(ball.x, ballScreenY, 8 * scaleB, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlayer(x, y, scale, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Cień postaci
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(0, 35, 30, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ciało
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-20, -10, 40, 50, 8);
    ctx.fill();

    // Głowa
    ctx.fillStyle = "#fde047";
    ctx.beginPath();
    ctx.arc(0, -22, 14, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resetBall(true);
loop();
</script>
</body>
</html>
