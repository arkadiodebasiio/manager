<!DOCTYPE html>
<html>
<head>
    <title>Championship Manager 2D - Trzymanie Linii</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        canvas { background: #236926; border: 4px solid #fff; box-shadow: 0px 0px 25px rgba(0,0,0,0.7); display: block; margin: 10px auto; }
        #commentary { background: #000; border: 2px solid #333; width: 580px; min-height: 45px; margin: 10px auto; padding: 10px; font-size: 14px; color: #00ff00; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>
    <canvas id="matchCanvas" width="600" height="400"></canvas>
    <div id="commentary">> Inicjalizacja stabilnych linii defensywnych...</div>
    <script>
        const canvas = document.getElementById("matchCanvas"); const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");
        let scoreA = 0; let scoreB = 0;
        let ball = { x: 300, y: 200, targetX: 300, targetY: 200, speed: 0.03, owner: null };
        let players = []; let stanMeczu = "srodek"; let frameCounter = 0; let timerPodania = 0; let druzynaAtakujaca = "A";
        
        // POPRAWKA: Każdy obrońca ma przypisanego DOKŁADNIE JEDNEGO unikalnego rywala ze swojej strefy, żeby nie biegać sznurkiem
        const basePositions = [
            { id: "A1", team: "A", nr: 1, x: 40, y: 200, r: "GK", kryje: "B1" }, 
            { id: "A2", team: "A", nr: 2, x: 120, y: 70, r: "DEF", kryje: "B6" }, 
            { id: "A3", team: "A", nr: 3, x: 110, y: 155, r: "DEF", kryje: "B9" }, 
            { id: "A4", team: "A", nr: 4, x: 110, y: 245, r: "DEF", kryje: "B11" }, 
            { id: "A5", team: "A", nr: 5, x: 120, y: 330, r: "DEF", kryje: "B10" }, 
            { id: "A6", team: "A", nr: 6, x: 220, y: 80, r: "MID", kryje: "B2" }, 
            { id: "A7", team: "A", nr: 7, x: 200, y: 160, r: "MID", kryje: "B3" }, 
            { id: "A8", team: "A", nr: 8, x: 200, y: 240, r: "MID", kryje: "B4" }, 
            { id: "A10", team: "A", nr: 10, x: 220, y: 320, r: "MID", kryje: "B5" }, 
            { id: "A11", team: "A", nr: 11, x: 270, y: 140, r: "ATT", kryje: "B3" }, 
            { id: "A9", team: "A", nr: 9, x: 270, y: 260, r: "ATT", kryje: "B4" },
            { id: "B1", team: "B", nr: 1, x: 560, y: 200, r: "GK", kryje: "A1" }, 
            { id: "B2", team: "B", nr: 2, x: 480, y: 70, r: "DEF", kryje: "A6" }, 
            { id: "B3", team: "B", nr: 3, x: 490, y: 155, r: "DEF", kryje: "A11" }, 
            { id: "B4", team: "B", nr: 4, x: 490, y: 245, r: "DEF", kryje: "A9" }, 
            { id: "B5", team: "B", nr: 480, y: 330, r: "DEF", kryje: "A10" }, 
            { id: "B6", team: "B", nr: 6, x: 380, y: 80, r: "MID", kryje: "A2" }, 
            { id: "B7", team: "B", nr: 7, x: 400, y: 160, r: "MID", kryje: "A7" }, 
            { id: "B8", team: "B", nr: 8, x: 400, y: 240, r: "MID", kryje: "A8" }, 
            { id: "B10", team: "B", nr: 10, x: 380, y: 320, r: "MID", kryje: "A10" }, 
            { id: "B9", team: "B", nr: 9, x: 320, y: 140, r: "ATT", kryje: "A3" }, 
            { id: "B11", team: "B", nr: 11, x: 330, y: 260, r: "ATT", kryje: "A4" }
        ];
        function ustawSkladNaStart() {
            players.length = 0;
            basePositions.forEach(p => { players.push({ id: p.id, team: p.team, nr: p.nr, role: p.r, homeX: p.x, homeY: p.y, x: p.x, y: p.y, targetX: p.x, targetY: p.y, targetKrycia: p.kryje, offset: Math.random() * 50, speed: 0.04 }); });
            ball.x = 300; ball.y = 200; ball.targetX = 300; ball.targetY = 200; ball.owner = null; druzynaAtakujaca = Math.random() > 0.5 ? "A" : "B"; stanMeczu = "srodek";
            comment.style.color = "#ffeb3b"; comment.innerText = "⚽ [ŚRODEK] Przygotowanie do rozpoczęcia gry od środka...";
            setTimeout(odpalGwizdekMeczu, 1500);
        }
        function odpalGwizdekMeczu() {
            let n11 = players.find(p => p.id === (druzynaAtakujaca + "11")); ball.owner = n11; stanMeczu = "gra"; timerPodania = 0;
            comment.style.color = "#00ff00"; comment.innerText = "⚽ [GWIZDEK] Piłka w grze! Zespoły trzymają szyki taktyczne!";
        }
        function przeliczTaktykeAI() {
            if (stanMeczu !== "gra") return;
            if (ball.owner) { druzynaAtakujaca = ball.owner.team; }
            players.forEach(p => {
                if (p.role === "GK") { p.targetX = p.homeX; p.targetY = 160 + (ball.y * 0.2); return; }
                if (p.team === druzynaAtakujaca) {
                    let kierunekAtaku = p.team === "A" ? 1 : -1;
                    if (p === ball.owner) {
                        p.targetX = p.x + (kierunekAtaku * 18);
                        p.targetY = p.y + Math.sin(frameCounter / 15) * 12 + (Math.cos(frameCounter / 25) * 8);
                        if (p.team === "A" && p.targetX > 520) p.targetX = 510; if (p.team === "B" && p.targetX < 80) p.targetX = 90;
                        timerPodania++;
                        if (timerPodania > 120 + Math.random()*80) {
                            timerPodania = 0;
                            if ((p.team === "A" && p.x > 440) || (p.team === "B" && p.x < 160)) {
                                ball.targetX = p.team === "A" ? 595 : 5; ball.targetY = 175 + Math.random()*50; ball.owner = null;
                                comment.style.color = "#ffeb3b"; comment.innerText = "🚀 [STRZAŁ] Potężne uderzenie na bramkę!";
                            } else {
                                let koledzy = players.filter(mate => mate.team === p.team && mate.id !== p.id && mate.role !== "GK");
                                let odbiorca = koledzy[Math.floor(Math.random() * koledzy.length)];
                                ball.targetX = odbiorca.x; ball.targetY = odbiorca.y; ball.owner = null;
                                comment.style.color = "#00ff00"; comment.innerText = "👟 [PODANIE] Szybka wymiana piłki w ataku do zawodnika nr " + odbiorca.nr + ".";
                            }
                        }
                    } else { 
                        // Atakujący przesuwają się elastycznie z zachowaniem swoich korytarzy bocznych
                        p.targetX = p.homeX + (kierunekAtaku * 110); 
                        p.targetY = p.homeY + (Math.sin((frameCounter / 25) + p.offset) * 12); 
                    }
                } else {
                    // --- POPRAWKA: SYSTEM ZWARTEJ LINII OBRONY (ANTI-SZNURECZEK) ---
                    let celCofaniaX = p.homeX + (druzynaAtakujaca === "A" ? -50 : 50);
                    let dystansDoPilki = Math.hypot(ball.x - p.x, ball.y - p.y);
                    
                    let najblizszyObronca = players.filter(d => d.team === p.team).reduce((prev, curr) => Math.hypot(ball.x - prev.x, ball.y - prev.y) < Math.hypot(ball.x - curr.x, ball.y - curr.y) ? prev : curr);
                    
                    if (p === najblizszyObronca && dystansDoPilki < 150) {
                        // Tylko JEDNEN najbliższy zawodnik wyskakuje do pressingu
                        p.targetX = ball.x; p.targetY = ball.y;
                        if (dystansDoPilki < 12 && ball.owner) {
                            if (Math.random() > 0.40) { ball.owner = p; timerPodania = 0; comment.style.color = p.team === "A" ? "#00ff00" : "#ff5252"; comment.innerText = "🧲 [ODBIÓR] Świetne wyczucie! Czyste odebranie piłki wślizgiem!"; }
                            else { p.targetX -= (p.team === "A" ? 25 : -25); }
                        }
                    } else {
                        // POPRAWKA: Reszta linii obrony trzyma równe, pionowe pozycje Y i nie schodzi się do środka za napastnikiem!
                        // Każdy pilnuje wyłącznie swojej strefy Y i cofa się w równej linii X z innymi obrońcami!
                        let rywalDoKrycia = players.find(opp => opp.id === p.targetKrycia);
                        p.targetX = celCofaniaX; // Wszyscy obrońcy cofają się na TĘ SAMĄ głębokość X, tworząc idealną ścianę
                        if (rywalDoKrycia) {
                            // Pilnuje tylko drobnej korekty góra/dół na swojej wysokości Y, nie goni rywala w poprzek!
                            p.targetY = p.homeY + (rywalDoKrycia.y - rywalDoKrycia.homeY) * 0.4;
                        }
                    }
                }
            });
            if (!ball.owner) {
                players.forEach(p => {
                    if (Math.hypot(ball.x - p.x, ball.y - p.y) < 12 && p.role !== "GK") { ball.owner = p; timerPodania = 0; comment.style.color = p.team === "A" ? "#00ff00" : "#ff5252"; comment.innerText = "🧲 [PRZECHWYT] Czujne przecięcie podania przez zawodnika nr " + p.nr + "!"; }
                });
            }
        }
        function render() {
            ctx.fillStyle = "#236926"; ctx.fillRect(0, 0, 600, 400); ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2; ctx.strokeRect(0, 0, 600, 400);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke(); ctx.beginPath(); ctx.arc(300, 200, 45, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeRect(0, 110, 70, 180); ctx.strokeRect(530, 110, 70, 180);
            ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "bold 16px Arial"; ctx.fillText("FC KULECZKI " + scoreA + " : " + scoreB + " NIEBIESKIE ASY", 190, 30);
            frameCounter++; przeliczTaktykeAI();
            players.forEach(p => {
                let microX = Math.sin((frameCounter / 10) + p.offset) * 1.75; let microY = Math.cos((frameCounter / 12) + p.offset) * 1.75;
                p.x += ((p.targetX + microX) - p.x) * p.speed; p.y += ((p.targetY + microY) - p.y) * p.speed;
                ctx.fillStyle = p.team === "A" ? "#e53935" : "#1e88e5"; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText(p.nr, p.x - 5, p.y + 4);
            });
            if (ball.owner) { ball.x = ball.owner.x; ball.y = ball.owner.y + 6; ball.targetX = ball.x; ball.targetY = ball.y; }
            else { ball.x += (ball.targetX - ball.x) * ball.speed; ball.y += (ball.targetY - ball.y) * ball.speed; }
            if ((ball.x > 595 || ball.x < 5 || ball.y < 5 || ball.y > 395) && stanMeczu === "gra") {
                stanMeczu = "stop";
                if (ball.x > 595 && ball.y > 170 && ball.y < 230) { scoreA++; comment.style.color = "#ffeb3b"; comment.innerText = "⚽ GOOOOL!! Piękna akcja wykończona strzałem w siatkę!"; }
                else if (ball.x < 5 && ball.y > 170 && ball.y < 230) { scoreB++; comment.style.color = "#ff5252"; comment.innerText = "❌ BRAMKA! Przeciwnik oddaje precyzyjny strzał i zdobywa punkt."; }
                else if (ball.x > 595 || ball.x < 5) { comment.style.color = "#aaaaaa"; comment.innerText = "🥅 [AUT BRAMKOWY] Strzał mija światło bramki."; }
                else { comment.style.color = "#ffb300"; comment.innerText = "🏳️ [AUT] Piłka opuszcza boisko za linią boczną."; }
                setTimeout(ustawSkladNaStart, 3500);
            }
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#000"; ctx.stroke();
        }
        setInterval(render, 16); ustawSkladNaStart();
    </script>
</body>
</html>
