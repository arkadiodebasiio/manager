<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Bokserzy - spowolnione tempo walki</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="ringCanvas"></canvas>

<script>
    const canvas = document.getElementById('ringCanvas');
    const ctx = canvas.getContext('2d');

    const ringSize = 500;
    canvas.width = ringSize;
    canvas.height = ringSize;

    const ringCenter = { x: canvas.width / 2, y: canvas.height / 2 };
    
    const baseRadius = 100;      
    let currentOrbitRadius = baseRadius; 

    const boxerRed = {
        angle: Math.PI / 2, 
        orbitSpeed: 0.023,    // Spowolnione z 0.035 o 1/3
        radius: 24,
        color: '#e74c3c',
        number: '1',
        animTimer: 0,
        punchTimer: 0,     
        isPunching: false, 
        punchProgress: 0,
        punchType: 'straight', 
        isMovingThisJump: false,
        wasAboveZero: true,
        x: 0,
        y: 0
    };

    const boxerBlue = {
        x: ringCenter.x,
        y: ringCenter.y,
        radius: 24,
        color: '#2980b9',
        number: '2',
        animTimer: 0
    };

    function drawRing() {
        ctx.fillStyle = '#d4ac0d';
        ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);

        ctx.strokeStyle = '#b7950b';
        ctx.lineWidth = 2;
        for (let i = 70; i < canvas.width - 50; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 50);
            ctx.lineTo(i, canvas.height - 50);
            ctx.stroke();
        }

        const corners = [
            {x: 50, y: 50, color: '#c0392b'},
            {x: canvas.width - 50, y: 50, color: '#2980b9'},
            {x: 50, y: canvas.height - 50, color: '#fff'},
            {x: canvas.width - 50, y: canvas.height - 50, color: '#fff'}
        ];

        for (let offset = 10; offset <= 30; offset += 10) {
            ctx.strokeStyle = offset === 10 ? '#fff' : (offset === 20 ? '#c0392b' : '#2980b9');
            ctx.lineWidth = 3;
            ctx.strokeRect(50 - offset/2, 50 - offset/2, canvas.width - 100 + offset, canvas.height - 100 + offset);
        }

        corners.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = c.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

    function update() {
        // Praca nóg spowolniona z 0.2 na 0.133 (o 1/3)
        boxerRed.animTimer += 0.133;
        boxerRed.punchTimer += 0.66; // Wolniejsze odliczanie do kolejnego ciosu
        boxerBlue.animTimer += 0.133;

        let targetRadius = baseRadius;
        if (boxerRed.isPunching) {
            targetRadius = boxerRed.punchType === 'straight' ? 78 : 66;
        }

        // Płynność doskoku dopasowana do nowego tempa
        currentOrbitRadius += (targetRadius - currentOrbitRadius) * 0.16;

        boxerRed.x = ringCenter.x + Math.cos(boxerRed.angle) * currentOrbitRadius;
        boxerRed.y = ringCenter.y + Math.sin(boxerRed.angle) * currentOrbitRadius;

        const currentSin = Math.sin(boxerRed.animTimer);
        if (currentSin > 0 && !boxerRed.wasAboveZero) {
            boxerRed.isMovingThisJump = Math.random() < 0.30;
        }
        boxerRed.wasAboveZero = (currentSin > 0);

        if (boxerRed.isMovingThisJump && currentSin > 0) {
            boxerRed.angle -= boxerRed.orbitSpeed * currentSin; 
        }

        // Szansa na wyprowadzenie ciosu
        if (!boxerRed.isPunching && boxerRed.punchTimer > 60 && Math.random() < 0.03) {
            boxerRed.isPunching = true;
            boxerRed.punchProgress = 0;
            boxerRed.punchTimer = 0;
            boxerRed.punchType = Math.random() < 0.5 ? 'straight' : 'hook';
        }

        if (boxerRed.isPunching) {
            // Prędkość ciosu spowolniona z 0.22 na 0.146 (o 1/3)
            boxerRed.punchProgress += 0.146; 
            if (boxerRed.punchProgress >= Math.PI) {
                boxerRed.punchProgress = 0;
                boxerRed.isPunching = false;
            }
        }
    }

    function drawBlueBoxer() {
        const bounce = Math.sin(boxerBlue.animTimer) * 3;
        const angleToRed = Math.atan2(boxerRed.y - boxerBlue.y, boxerRed.x - boxerBlue.x) + Math.PI;

        ctx.beginPath();
        ctx.ellipse(boxerBlue.x, boxerBlue.y + boxerBlue.radius, boxerBlue.radius - Math.abs(bounce), 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        ctx.save();
        ctx.translate(boxerBlue.x, boxerBlue.y + bounce);
        ctx.rotate(angleToRed - Math.PI / 2); 

        ctx.beginPath();
        ctx.arc(0, 0, boxerBlue.radius, 0, Math.PI * 2);
        ctx.fillStyle = boxerBlue.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        const gloveRadius = 7;
        ctx.beginPath();
        ctx.arc(-12, -boxerBlue.radius + 4, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(12, -boxerBlue.radius + 4, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.rotate(-(angleToRed - Math.PI / 2));
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boxerBlue.number, 0, 0);
        ctx.restore();

        ctx.restore();
    }

    function drawRedBoxer() {
        const bounceOffset = Math.sin(boxerRed.animTimer) * 4;
        const tiltOffset = Math.cos(boxerRed.animTimer) * 1.5;

        const pVal = boxerRed.isPunching ? Math.sin(boxerRed.punchProgress) : 0;
        const bodyLean = pVal * 15;

        ctx.beginPath();
        ctx.ellipse(boxerRed.x, boxerRed.y + boxerRed.radius, boxerRed.radius - Math.abs(bounceOffset), 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        ctx.save();
        ctx.translate(boxerRed.x + tiltOffset, boxerRed.y + bounceOffset);
        ctx.rotate(boxerRed.angle - Math.PI / 2); 

        const currentY = -bodyLean * 0.2;
        const currentX = 0;

        ctx.beginPath();
        ctx.arc(currentX, currentY, boxerRed.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#e74c3c';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        const gloveRadius = 7;
        const rightGloveBaseX = currentX + 12;
        const gloveBaseY = currentY - boxerRed.radius + 4;

        ctx.beginPath();
        ctx.arc(rightGloveBaseX, gloveBaseY + Math.sin(boxerRed.animTimer * 2) * 2, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        let leftGloveX = currentX; 
        let leftGloveY = gloveBaseY;

        if (boxerRed.isPunching) {
            if (boxerRed.punchType === 'straight') {
                leftGloveY -= pVal * 42;
            } else {
                leftGloveX += Math.sin(boxerRed.punchProgress) * 6;
                leftGloveY -= pVal * 30;
            }
        }

        if (boxerRed.isPunching && Math.abs(leftGloveY - gloveBaseY) > 5) {
            ctx.beginPath();
            ctx.moveTo(currentX - 6, currentY - 10);
            ctx.lineTo(leftGloveX, leftGloveY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
        }

        ctx.beginPath();
        ctx.arc(leftGloveX, leftGloveY, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.translate(currentX, currentY);
        ctx.rotate(-(boxerRed.angle - Math.PI / 2)); 
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boxerRed.number, 0, 0);
        ctx.restore();

        ctx.restore(); 
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRing();
        update();
        drawBlueBoxer();
        drawRedBoxer();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
