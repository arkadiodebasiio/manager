<!DOCTYPE html>
<html>
<head>
    <title>CM4 Advanced Physics 2D Engine</title>
    <style>
        body { background: #08120b; color: #fff; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 5px; overflow: hidden; }
        canvas { background: #0f3d1c; border: 3px solid #fff; display: block; margin: 5px auto; width: 620px; height: 380px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #commentary { background: #000; border: 1px solid #222; width: 600px; min-height: 40px; margin: 5px auto; padding: 10px; font-size: 13px; color: #00ff66; text-align: left; box-shadow: inset 0 0 10px rgba(0,255,102,0.1); }
        #scoreboard { font-size: 22px; font-weight: bold; font-family: 'Arial Black', sans-serif; margin: 5px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div id="scoreboard">🟥 TEAM A <span id="sa">0</span> - <span id="sb">0</span> TEAM B 🟦</div>
    <canvas id="cmCanvas" width="640" height="400"></canvas>
    <div id="commentary">> Inicjalizacja zaawansowanego silnika fizyki meczowej...</div>

    <script>
        const canvas = document.getElementById("cmCanvas"); const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");
        let scoreA = 0; let scoreB = 0;

        let players = [
            // TEAM A (Czerwoni) - Atakuje w prawo
            { id: "A1",  team: "A", nr: 1,  role: "GK",  bx: 35,  by: 200, pas: 10, sho: 1,  def: 16, name: "Kowalski" },
            { id: "A2",  team: "A", nr: 2,  role: "DEF", bx: 130, by: 60,  pas: 11, sho: 4,  def: 15, name: "Piszczek" },
            { id: "A3",  team: "A", nr: 3,  role: "DEF", bx: 130, by: 150, pas: 10, sho: 3,  def: 18, name: "Glik" },
            { id: "A4",  team: "A", nr: 4,  role: "DEF", bx: 130, by: 250, pas: 11, sho: 2,  def: 17, name: "Bednarek" },
            { id: "A5",  team: "A", nr: 5,  role: "DEF", bx: 130, by: 340, pas: 12, sho: 5,  def: 14, name: "Bereszyński" },
            { id: "A6",  team: "A", nr: 6,  role: "MID", bx: 260, by: 80,  pas: 15, sho: 9,  def: 13, name: "Grosicki" },
            { id: "A7",  team: "A", nr: 8,  role: "MID", bx: 250, by: 160, pas: 17, sho: 11, def: 12, name: "Zieliński" },
            { id: "A8",  team: "A", nr: 7,  role: "MID", bx: 250, by: 240, pas: 14, sho: 10, def: 15, name: "Krychowiak" },
            { id: "A9",  team: "A", nr: 11, role: "MID", bx: 260, by: 320, pas: 16, sho: 8,  def: 11, name: "Frankowski" },
            { id: "A10", team: "A", nr: 9,  role: "ATT", bx: 420, by: 140, pas: 12, sho: 19, def: 4,  name: "Lewandowski" },
            { id: "A11", team: "A", nr: 10, role: "ATT", bx: 420, by: 260, pas: 13, sho: 17, def: 5,  name: "Milik" },
            // TEAM B (Niebiescy) - Atakuje w lewo
            { id: "B1",  team: "B", nr: 1,  role: "GK",  bx: 605, by: 200, pas: 12, sho: 1,  def: 18, name: "Buffon" },
            { id: "B2",  team: "B", nr: 2,  role: "DEF", bx: 510, by: 60,  pas: 11, sho: 3,  def: 16, name: "Zambrotta" },
            { id: "B3",  team: "B", nr: 5,  role: "DEF", bx: 510, by: 150, pas: 10, sho: 2,  def: 19, name: "Cannavaro" },
            { id: "B4",  team: "B", nr: 6,  role: "DEF", bx: 510, by: 250, pas: 9,  sho: 4,  def: 17, name: "Nesta" },
            { id: "B5",  team: "B", nr: 3,  role: "DEF", bx: 510, by: 340, pas: 13, sho: 5,  def: 18, name: "Maldini" },
            { id: "B6",  team: "B", nr: 7,  role: "MID", bx: 380, by: 80,  pas: 15, sho: 12, def: 10, name: "Camoranesi" },
            { id: "B7",  team: "B", nr: 8,  role: "MID", bx: 390, by: 160, pas: 18, sho: 14, def: 11, name: "Pirlo" },
            { id: "B8",  team: "B", nr: 4,  role: "MID", bx: 390, by: 240, pas: 12, sho: 9,  def: 16, name: "Gattuso" },
            { id: "B9",  team: "B", nr: 11, role: "MID", bx: 380, by: 320, pas: 16, sho: 13, def: 8,  name: "Nedved" },
            { id: "B10", team: "B", nr: 10, role: "ATT", bx: 220, by: 140, pas: 14, sho: 18, def: 3,  name: "Totti" },
            { id: "B11", team: "B", nr: 9,  role: "ATT", bx: 220, by: 260, pas: 11, sho: 17, def: 4,  name: "Inzaghi" }
        ];

        players.forEach(p => { 
            p.x = p.bx; p.y = p.by; p.tx = p.bx; p.ty = p.by; 
            p.vx = 0; p.vy = 0; p.speed = p.role === "ATT" ? 0.32 : 0.25; 
        });

        let ball = { x: 320, y: 200, vx: 0, vy: 0, friction: 0.965, owner: null };
        let pPosiadajacy = players.find(p => p.id === "A10"); ball.owner = pPosiadajacy;
        let fazaMeczu = "DECYZJA"; let czasDecyzji = 0;

        function wypiszKomentarz(tekst, kolor = "#00ff66") {
            comment.style.color = kolor; comment.innerText = "⚽ " + tekst;
        }

        function resetPoBramce() {
            players.forEach(p => { p.x = p.bx; p.y = p.by; p.tx = p.bx; p.ty = p.by; p.vx = 0; p.vy = 0; });
            ball.x = 320; ball.y = 200; ball.vx = 0; ball.vy = 0; ball.owner = null;
            fazaMeczu = "DECYZJA"; czasDecyzji = 30;
        }

        function silnikMeczowyTick() {
            if (!ball.owner) { ball.x += ball.vx; ball.y += ball.vy; ball.vx *= ball.friction; ball.vy *= ball.friction; } 
            else { ball.x = ball.owner.x; ball.y = ball.owner.y; ball.vx = 0; ball.vy = 0; }

            if (czasDecyzji <= 0) {
                czasDecyzji = 30 + Math.floor(Math.random() * 30);
                if (ball.owner) {
                    let p = ball.owner;
                    let koledzy = players.filter(pl => pl.team === p.team && pl.id !== p.id);
                    let przeciwnicy = players.filter(pl => pl.team !== p.team);
                    let kierunek = p.team === "A" ? 1 : -1;
                    let los = Math.random();

                    players.forEach(pl => {
                        if (pl.role === "GK") return;
                        if (pl.team === p.team) { pl.tx = pl.bx + (kierunek * 80); pl.ty = pl.by + (Math.random() * 40 - 20); } 
                        else { pl.tx = pl.bx + (kierunek * 40); pl.ty = pl.by + (ball.y - pl.by) * 0.4; }
                    });

                    let wStrefieStrzalu = p.team === "A" ? p.x > 450 : p.x < 190;
                    if (wStrefieStrzalu && los < 0.45) {
                        let bramkarz = players.find(pl => pl.team !== p.team && pl.role === "GK");
                        let celX = p.team === "A" ? 635 : 5; let celY = 175 + Math.random() * 50;
                        let dx = celX - p.x; let dy = celY - p.y; let dystans = Math.sqrt(dx * dx + dy * dy);
                        ball.owner = null; ball.vx = (dx / dystans) * 14; ball.vy = (dy / dystans) * 14;
                        let silaStrzalu = (p.sho / 20) * Math.random(); let obronaGK = (bramkarz.def / 20) * Math.random();
                        if (silaStrzalu > obronaGK) { wypiszKomentarz(`GOOOOL! Cóż za uderzenie! ${p.name} zdejmuje pajęczynę!`, "#ffff00"); fazaMeczu = p.team === "A" ? "GOL_A" : "GOL_B"; } 
                        else { wypiszKomentarz(`Genialna intuicja! ${bramkarz.name} paruje atomowy strzał!`, "#ff00e1"); setTimeout(() => { ball.owner = bramkarz; }, 400); }
                    }
                    else if (los < 0.75 && koledzy.length > 0) {
                        let odbiorca = koledzy[Math.floor(Math.random() * koledzy.length)];
                        let dx = odbiorca.x - p.x; let dy = odbiorca.y - p.y; let dystans = Math.sqrt(dx * dx + dy * dy);
                        ball.owner = null; ball.vx = (dx / dystans) * 7.5; ball.vy = (dy / dystans) * 7.5;
                        wypiszKomentarz(`${p.name} posyła płaską, prostopadłą piłkę do partnera.`, "#00ff66");
                    }
                    else { p.tx = p.x + (kierunek * 70); p.ty = p.y + (Math.random() * 60 - 30); wypiszKomentarz(`${p.name} dynamicznie ścina z piłką w pole karne!`, "#00e5ff"); }
                } else {
                    players.forEach(pl => {
                        let dx = ball.x - pl.x; let dy = ball.y - pl.y; let dystans = Math.sqrt(dx * dx + dy * dy);
                        if (dystans < 180 && pl.role !== "GK") { pl.tx = ball.x + (Math.random() * 10 - 5); pl.ty = ball.y + (Math.random() * 10 - 5); }
                    });
                }
            }
            czasDecyzji--;
            // FIZYKA PĘDU I BEZWŁADNOŚCI ZAWODNIKÓW
            players.forEach(p => {
                let dx = p.tx - p.x;
                let dy = p.ty - p.y;
                let dystans = Math.sqrt(dx * dx + dy * dy);

                if (dystans > 5) {
                    let ax = (dx / dystans) * p.speed;
                    let ay = (dy / dystans) * p.speed;
                    p.vx += ax;
                    p.vy += ay;
                }

                p.vx *= 0.82;
                p.vy *= 0.82;
                p.x += p.vx;
                p.y += p.vy;

                // DETEKCJA KOLIZJI I PRZECHWYTU PIŁKI
                if (!ball.owner && fazaMeczu === "DECYZJA") {
                    let bdx = ball.x - p.x;
                    let bdy = ball.y - p.y;
                    let bdystans = Math.sqrt(bdx * bdx + bdy * bdy);

                    if (bdystans < 11) {
                        ball.owner = p;
                        czasDecyzji = 5;
                    }
                }
            });

            // SPRAWDZENIE CZY PADŁA BRAMKA
            if (fazaMeczu === "GOL_A" && ball.x >= 630) {
                scoreA++; document.getElementById("sa").innerText = scoreA;
                fazaMeczu = "CELEBRACJA"; setTimeout(resetPoBramce, 2000);
            }
            if (fazaMeczu === "GOL_B" && ball.x <= 10) {
                scoreB++; document.getElementById("sb").innerText = scoreB;
                fazaMeczu = "CELEBRACJA"; setTimeout(resetPoBramce, 2000);
            }
            
            if (!ball.owner) {
                if (ball.y < 12 || ball.y > 388) ball.vy *= -1;
                if ((ball.x < 12 || ball.x > 628) && !fazaMeczu.startsWith("GOL")) ball.vx *= -1;
            }
        }

        // ZAAWANSOWANE RENDEROWANIE POLA GRY
        function renderujMecz() {
            ctx.fillStyle = "#0f3d1c"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "rgba(255,255,255,0.02)";
            for (let i = 0; i < canvas.width; i += 40) {
                if ((i / 40) % 2 === 0) ctx.fillRect(i, 10, 40, canvas.height - 20);
            }

            ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20); 
            ctx.beginPath(); ctx.moveTo(canvas.width / 2, 10); ctx.lineTo(canvas.width / 2, canvas.height - 10); ctx.stroke(); 
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2); ctx.stroke(); 
            
            ctx.strokeRect(10, 100, 75, 200); ctx.strokeRect(canvas.width - 85, 100, 75, 200); 
            ctx.fillStyle = "#05170b"; ctx.fillRect(2, 170, 8, 60); ctx.fillRect(canvas.width - 10, 170, 8, 60); 

            players.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y + 3, 7, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fill();

                ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
                ctx.fillStyle = p.team === "A" ? "#d50000" : "#2962ff"; 
                ctx.fill();
                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 9px Arial";
                ctx.fillText(p.nr, p.x - 4, p.y + 3);

                if (p === ball.owner || p.role === "ATT") {
                    ctx.font = "bold 8px Courier New"; ctx.fillStyle = "#ffffff";
                    ctx.fillText(p.name, p.x - 22, p.y - 13);
                }
            });

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff"; ctx.fill();
            ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.stroke();
        }

        function petlaGry() {
            silnikMeczowyTick();
            renderujMecz();
            requestAnimationFrame(petlaGry);
        }

        setTimeout(petlaGry, 1000);
    </script>
</body>
</html>
