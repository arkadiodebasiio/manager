<!DOCTYPE html>
<html>
<head>
    <title>Championship Manager 2D - Mądre Wsparcie</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        canvas { background: #236926; border: 4px solid #fff; box-shadow: 0px 0px 25px rgba(0,0,0,0.7); display: block; margin: 10px auto; }
        #commentary { background: #000; border: 2px solid #333; width: 580px; min-height: 45px; margin: 10px auto; padding: 10px; font-size: 14px; color: #00ff00; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>
    <canvas id="matchCanvas" width="600" height="400"></canvas>
    <div id="commentary">> Stabilizacja systemów rozegrania strefowego...</div>
    <script>
        const canvas = document.getElementById("matchCanvas"); const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");
        let scoreA = 0; let scoreB = 0;
        let ball = { x: 300, y: 200, targetX: 300, targetY: 200, speed: 0.02, owner: null };
        let players = []; let stanMeczu = "srodek"; let frameCounter = 0; let timerAkcji = 0; let druzynaAtakujaca = "A";
        const basePositions = [
            { id: "A1", team: "A", nr: 1, x: 40, y: 200, r: "GK" }, { id: "A2", team: "A", nr: 2, x: 120, y: 70, r: "DEF" }, { id: "A3", team: "A", nr: 3, x: 110, y: 155, r: "DEF" }, { id: "A4", team: "A", nr: 4, x: 110, y: 245, r: "DEF" }, { id: "A5", team: "A", nr: 5, x: 120, y: 330, r: "DEF" }, { id: "A6", team: "A", nr: 6, x: 220, y: 80, r: "MID" }, { id: "A7", team: "A", nr: 7, x: 200, y: 160, r: "MID" }, { id: "A8", team: "A", nr: 8, x: 200, y: 240, r: "MID" }, { id: "A10", team: "A", nr: 10, x: 220, y: 320, r: "MID" }, { id: "A11", team: "A", nr: 11, x: 270, y: 140, r: "ATT" }, { id: "A9", team: "A", nr: 9, x: 270, y: 260, r: "ATT" },
            { id: "B1", team: "B", nr: 1, x: 560, y: 200, r: "GK" }, { id: "B2", team: "B", nr: 2, x: 480, y: 70, r: "DEF" }, { id: "B3", team: "B", nr: 3, x: 490, y: 155, r: "DEF" }, { id: "B4", team: "B", nr: 4, x: 490, y: 245, r: "DEF" }, { id: "B5", team: "B", nr: 480, y: 330, r: "DEF" }, { id: "B6", team: "B", nr: 6, x: 380, y: 80, r: "MID" }, { id: "B7", team: "B", nr: 7, x: 400, y: 160, r: "MID" }, { id: "B8", team: "B", nr: 8, x: 400, y: 240, r: "MID" }, { id: "B10", team: "B", nr: 10, x: 380, y: 320, r: "MID" }, { id: "B9", team: "B", nr: 9, x: 320, y: 140, r: "ATT" }, { id: "B11", team: "B", nr: 11, x: 330, y: 260, r: "ATT" }
        ];
        function ustawSkladNaStart() {
            players.length = 0;
            basePositions.forEach(p => { players.push({ id: p.id, team: p.team, nr: p.nr, role: p.r, homeX: p.x, homeY: p.y, x: p.x, y: p.y, targetX: p.x, targetY: p.y, offset: Math.random() * 50, speed: 0.035, cooldownOdbioru: 0 }); });
            ball.x = 300; ball.y = 200; ball.targetX = 300; ball.targetY = 200; ball.owner = null;
            druzynaAtakujaca = Math.random() > 0.5 ? "A" : "B"; stanMeczu = "srodek"; timerAkcji = 0;
            let p9 = players.find(p => p.id === (druzynaAtakujaca + "9")); let p11 = players.find(p => p.id === (druzynaAtakujaca + "11"));
            if(druzynaAtakujaca === "A") { p9.targetX = 295; p9.targetY = 190; p11.targetX = 295; p11.targetY = 210; }
            else { p9.targetX = 305; p9.targetY = 190; p11.targetX = 305; p11.targetY = 210; }
            comment.style.color = "#ffeb3b"; comment.innerText = "⚽ [ŚRODEK] Dwóch zawodników przy środkowym punkcie. Rozpoczynamy mecz...";
            setTimeout(odpalRozegranieOdSrodka, 2000);
        }
        function odpalRozegranieOdSrodka() {
            let n11 = players.find(p => p.id === (druzynaAtakujaca + "11")); ball.owner = n11; ball.x = 300; ball.y = 200;
            comment.style.color = "#00ff00"; comment.innerText = "⚽ [GWIZDEK] Podanie napastnika na rozpoczęcie spotkania...";
            setTimeout(() => {
                let n9 = players.find(p => p.id === (druzynaAtakujaca + "9")); ball.owner = n9;
                setTimeout(() => {
                    ball.owner = null;
                    let wolniGracze = players.filter(mate => mate.team === druzynaAtakujaca && mate.role !== "ATT" && mate.role !== "GK");
                    let wylosowanyGracz = wolniGracze[Math.floor(Math.random() * wolniGracze.length)];
                    wylosowanyGracz.targetX = wylosowanyGracz.homeX + (druzynaAtakujaca === "A" ? 35 : -35);
                    ball.targetX = wylosowanyGracz.targetX; ball.targetY = wylosowanyGracz.targetY;
                    comment.style.color = "#ffeb3b"; comment.innerText = "↩️ [WYCOFANIE] Piłka wycofana do partnera nr " + wylosowanyGracz.nr + ", który wybiega do podania.";
                    setTimeout(() => { ball.owner = wylosowanyGracz; stanMeczu = "gra"; }, 1500);
                }, 1200);
            }, 1000);
        }
        function przeliczTaktykeAI() {
            if (stanMeczu !== "gra") return;
            if (ball.owner) { druzynaAtakujaca = ball.owner.team; }
            
            let progresAtakuX = (ball.x - 300) * 0.55;

            players.forEach(p => {
                if (p.role === "GK") { p.targetX = p.homeX; p.targetY = 160 + (ball.y * 0.2); return; }
                let dystansDoPilki = Math.hypot(ball.x - p.x, ball.y - p.y);
                if (p.cooldownOdbioru > 0) p.cooldownOdbioru--;

                if (p.team === druzynaAtakujaca) {
                    let kierunekAtaku = p.team === "A" ? 1 : -1;
                    if (p === ball.owner) {
                        p.targetX = p.x + (kierunekAtaku * 10); if (frameCounter % 50 === 0) { p.targetY = p.y + (Math.random()*30 - 15); }
                        if (p.team === "A" && p.targetX > 520) p.targetX = 510; if (p.team === "B" && p.targetX < 80) p.targetX = 90;
                        
                        timerAkcji++;
                        if (timerAkcji > 35 + Math.random()*20) {
                            timerAkcji = 0;
                            if ((p.team === "A" && p.x > 450) || (p.team === "B" && p.x < 160)) {
                                ball.targetX = p.team === "A" ? 595 : 5; ball.targetY = 175 + Math.random()*50; ball.owner = null;
                                comment.style.color = "#ffeb3b"; comment.innerText = "🚀 [STRZAŁ] Uderzenie z dystansu na bramkę!"; return;
                            }
                            let koledzy = players.filter(mate => mate.team === p.team && mate.id !== p.id && mate.role !== "GK");
                            let odbiorca = koledzy[Math.floor(Math.random() * koledzy.length)];
                            ball.targetX = odbiorca.targetX; ball.targetY = odbiorca.targetY; ball.owner = null;
                            comment.style.color = "#00ff00"; comment.innerText = "👟 [PODANIE] Zawodnik nr " + p.nr + " oddaje piłkę do partnera nr " + odbiorca.nr + ".";
                        }
                    } else { 
                        // POPRAWKA: TRÓJKIERUNKOWE WSPARCIE STREFOWE (Mądre pozycje bez zatoru przed piłką)
                        if (p.role === "ATT") {
                            // Napastnicy robią głębokie zrywy przed linię obrony (szukają prostopadłych)
                            p.targetX = p.homeX + progresAtakuX + (kierunekAtaku * 35);
                        } else if (p.role === "MID") {
                            // Pomocnicy trzymają wysokość i linię akcji, rozciągając grę na boki boiska
                            p.targetX = p.homeX + progresAtakuX;
                        } else {
                            // Obrońcy przesuwają się do przodu, ale ZAWSZE ZOSTAJĄ Z TYŁU za linią akcji, asekurując tyły
                            p.targetX = p.homeX + (progresAtakuX * 0.6);
                        }
                        if (frameCounter % 60 === 0) { p.targetY = p.homeY + (Math.random()*20 - 10); } 
                    }
                } else {
                    let celCofaniaX = p.homeX + ((ball.x - 300) * 0.30); let najblizszyObronca = players.filter(d => d.team === p.team).reduce((prev, curr) => Math.hypot(ball.x - prev.x, ball.y - prev.y) < Math.hypot(ball.x - curr.x, ball.y - curr.y) ? prev : curr);
                    if (p === najblizszyObronca && dystansDoPilki < 130 && p.cooldownOdbioru === 0) {
                        p.targetX = ball.x; p.targetY = ball.y;
                        if (dystansDoPilki < 12 && ball.owner) {
                            if (Math.random() > 0.55) { ball.owner = p; timerAkcji = 0; comment.style.color = p.team === "A" ? "#00ff00" : "#ff5252"; comment.innerText = "🧲 [ODBIÓR] Defensor nr " + p.nr + " czysto przerywa akcję rywala!"; }
                            else { p.cooldownOdbioru = 60; p.targetX -= (p.team === "A" ? 30 : -30); ball.owner.targetX += (p.team === "A" ? 35 : -35); }
                        }
                    } else { p.targetX = celCofaniaX; p.targetY = p.homeY; }
                }
            });
            if (!ball.owner) {
                let najblizszyDlaPilki = null; let minDist = 9999;
                players.forEach(p => {
                    let d = Math.hypot(ball.x - p.x, ball.y - p.y);
                    if (d < minDist && p.role !== "GK" && p.cooldownOdbioru === 0) { minDist = d; najblizszyDlaPilki = p; }
                });
                if (najblizszyDlaPilki && minDist < 150) {
                    najblizszyDlaPilki.targetX = ball.x; najblizszyDlaPilki.targetY = ball.y;
                    if (minDist < 12) { ball.owner = najblizszyDlaPilki; timerAkcji = 0; }
                }
            }
        }
        function render() {
            ctx.fillStyle = "#236926"; ctx.fillRect(0, 0, 600, 400); ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2; ctx.strokeRect(0, 0, 600, 400);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke(); ctx.beginPath(); ctx.arc(300, 200, 45, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeRect(0, 110, 70, 180); ctx.strokeRect(530, 110, 70, 180);
            ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "bold 16px Arial"; ctx.fillText("FC KULECZKI " + scoreA + " : " + scoreB + " NIEBIESKIE ASY", 190, 30);
            frameCounter++; przeliczTaktykeAI();
            players.forEach(p => {
                let microX = 0; let microY = 0; if (frameCounter % 15 === 0) { microX = (Math.random()*1.5 - 0.75); microY = (Math.random()*1.5 - 0.75); }
                p.x += ((p.targetX + microX) - p.x) * p.speed; p.y += ((p.targetY + microY) - p.y) * p.speed;
                ctx.fillStyle = p.team === "A" ? "#e53935" : "#1e88e5"; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText(p.nr, p.x - 5, p.y + 4);
            });
            if (ball.owner) { ball.x = ball.owner.x; ball.y = ball.owner.y + 6; ball.targetX = ball.x; ball.targetY = ball.y; }
            else { ball.x += (ball.targetX - ball.x) * ball.speed; ball.y += (ball.targetY - ball.y) * ball.speed; }
            if (stanMeczu === "gra" && (ball.x > 595 || ball.x < 5 || ball.y < 5 || ball.y > 395)) {
                stanMeczu = "stop";
                if (ball.x > 595 && ball.y > 170 && ball.y < 230) { scoreA++; comment.style.color = "#ffeb3b"; comment.innerText = "⚽ GOOOOL!! Bramka po świetnej akcji zespołowej!"; }
                else if (ball.x < 5 && ball.y > 170 && ball.y < 230) { scoreB++; comment.style.color = "#ff5252"; comment.innerText = "❌ BRAMKA! Przeciwnicy zdobywają punkt po uderzeniu w róg."; }
                else if (ball.x > 595 || ball.x < 5) { comment.style.color = "#aaaaaa"; comment.innerText = "🥅 [AUT BRAMKOWY] Piłka opuszcza plac gry za linią końcową."; }
                else { comment.style.color = "#ffb300"; comment.innerText = "🏳️ [AUT] Gra przerwana, piłka opuszcza linię boczną."; }
                setTimeout(ustawSkladNaStart, 3500);
            }
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#000"; ctx.stroke();
        }
        setInterval(render, 16); ustawSkladNaStart();
    </script>
</body>
</html>
