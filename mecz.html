<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Bokser w ringu - cios prosty</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="ringCanvas"></canvas>

<script>
    const canvas = document.getElementById('ringCanvas');
    const ctx = canvas.getContext('2d');

    const ringSize = 500;
    canvas.width = ringSize;
    canvas.height = ringSize;

    // Obiekt boksera
    const boxer = {
        x: canvas.width / 2,
        y: canvas.height / 2 + 20,
        radius: 24,
        color: '#e74c3c',
        number: '1',
        animTimer: 0,
        punchTimer: 0,     // licznik sterujący cyklem ciosu
        isPunching: false, // flaga czy aktualnie zadaje cios
        punchProgress: 0   // jak daleko wysunęła się ręka (0 do 1)
    };

    function drawRing() {
        ctx.fillStyle = '#d4ac0d';
        ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);

        ctx.strokeStyle = '#b7950b';
        ctx.lineWidth = 2;
        for (let i = 70; i < canvas.width - 50; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 50);
            ctx.lineTo(i, canvas.height - 50);
            ctx.stroke();
        }

        const corners = [
            {x: 50, y: 50, color: '#c0392b'},
            {x: canvas.width - 50, y: 50, color: '#2980b9'},
            {x: 50, y: canvas.height - 50, color: '#fff'},
            {x: canvas.width - 50, y: canvas.height - 50, color: '#fff'}
        ];

        for (let offset = 10; offset <= 30; offset += 10) {
            ctx.strokeStyle = offset === 10 ? '#fff' : (offset === 20 ? '#c0392b' : '#2980b9');
            ctx.lineWidth = 3;
            ctx.strokeRect(50 - offset/2, 50 - offset/2, canvas.width - 100 + offset, canvas.height - 100 + offset);
        }

        corners.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = c.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
        });
    }

    function update() {
        boxer.animTimer += 0.15;
        boxer.punchTimer += 1;

        // Co około 100 klatek inicjujemy cios prosty (lewy prosty)
        if (!boxer.isPunching && boxer.punchTimer > 90 && Math.random() < 0.05) {
            boxer.isPunching = true;
            boxer.punchProgress = 0;
            boxer.punchTimer = 0;
        }

        // Obsługa wysuwania i chowania rękawicy w ciosie
        if (boxer.isPunching) {
            boxer.punchProgress += 0.2; // prędkość wystrzału i powrotu
            if (boxer.punchProgress >= Math.PI) {
                boxer.punchProgress = 0;
                boxer.isPunching = false;
            }
        }
    }

    function drawBoxer() {
        const bounceOffset = Math.sin(boxer.animTimer) * 6;
        const tiltOffset = Math.cos(boxer.animTimer) * 2;

        const currentY = boxer.y + bounceOffset;
        const currentX = boxer.x + tiltOffset;

        // Cień
        ctx.beginPath();
        ctx.ellipse(boxer.x, boxer.y + boxer.radius + 6, boxer.radius - Math.abs(bounceOffset), 6, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fill();

        // Ciało
        ctx.beginPath();
        ctx.arc(currentX, currentY, boxer.radius, 0, Math.PI * 2);
        ctx.fillStyle = boxer.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Rękawice i animacja ciosu
        const gloveRadius = 7;
        const gloveY = currentY + Math.sin(boxer.animTimer * 2) * 3 - 2;

        // Prawa rękawica (zostaje w gardzie)
        ctx.beginPath();
        ctx.arc(currentX + boxer.radius + 3, gloveY, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Lewa rękawica (wystrzeliwana do przodu przy ciosie - funkcja sin daje ruch w przód i z powrotem)
        const punchExtension = boxer.isPunching ? Math.sin(boxer.punchProgress) * 32 : 0;
        
        ctx.beginPath();
        ctx.arc(currentX - boxer.radius - 3 - punchExtension, gloveY, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Linia ramienia podczas ciosu dla lepszego efektu
        if (boxer.isPunching && punchExtension > 5) {
            ctx.beginPath();
            ctx.moveTo(currentX - boxer.radius, gloveY);
            ctx.lineTo(currentX - boxer.radius - 3 - punchExtension, gloveY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
        }

        // Numerek
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boxer.number, currentX, currentY);
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRing();
        update();
        drawBoxer();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
