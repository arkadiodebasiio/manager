<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prosty Silnik Bokserski w Przeglądarce</title>
    <style>
        body { background: #222; color: #fff; text-align: center; font-family: sans-serif; }
        canvas { background: #333; display: block; margin: 20px auto; border: 2px solid #555; }
    </style>
</head>
<body>
    <h1>Silnik Bokserski 2D</h1>
    <p>Gracz 1 (Niebieski): A/D ruch, S blok, F cios | Gracz 2 (Czerwony): Strzałki lewo/prawo, Strzałka dół blok, Klawisz K cios</p>
    <canvas id="ring" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("ring");
        const ctx = canvas.getContext("2d");

        class Boxer {
            constructor(x, color, side) {
                this.x = x; this.y = 220; this.width = 50; this.height = 100;
                this.color = color; this.side = side;
                this.hp = 100; this.state = "IDLE";
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        const p1 = new Boxer(200, "#3355ff", "left");
        const p2 = new Boxer(550, "#ff3333", "right");

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            p1.draw();
            p2.draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
