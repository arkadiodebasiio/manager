<!DOCTYPE html>
<html>
<head>
    <title>Championship Manager 2D - Pozycje Taktyczne</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        canvas { background: #236926; border: 4px solid #fff; box-shadow: 0px 0px 25px rgba(0,0,0,0.7); display: block; margin: 10px auto; }
        #commentary { background: #000; border: 2px solid #333; width: 580px; min-height: 45px; margin: 10px auto; padding: 10px; font-size: 14px; color: #00ff00; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>

    <div id="commentary">> Formacje rozstawione taktycznie. Sędzia rozpoczyna grę...</div>
    <canvas id="matchCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("matchCanvas");
        const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");

        let scoreA = 0; let scoreB = 0;
        let ball = { x: 300, y: 200, targetX: 300, targetY: 200, speed: 0.08 };
        let players = [];
        let stanMeczu = "srodek"; 
        let timerStanu = 0;

        // Baza idealnych pozycji taktycznych 4-4-2
        const basePositions = [
            { team: "A", nr: 1, x: 40, y: 200, role: "GK" }, { team: "A", nr: 2, x: 120, y: 80, role: "DEF" }, { team: "A", nr: 3, x: 110, y: 160, role: "DEF" }, { team: "A", nr: 4, x: 110, y: 240, role: "DEF" }, { team: "A", nr: 5, x: 120, y: 320, role: "DEF" }, { team: "A", nr: 6, x: 220, y: 90, role: "MID" }, { team: "A", nr: 7, x: 200, y: 160, role: "MID" }, { team: "A", nr: 8, x: 200, y: 240, role: "MID" }, { team: "A", nr: 10, x: 220, y: 310, role: "MID" }, { team: "A", nr: 11, x: 280, y: 150, role: "ATT" }, { team: "A", nr: 9, x: 280, y: 250, role: "ATT" },
            { team: "B", nr: 1, x: 560, y: 200, role: "GK" }, { team: "B", nr: 2, x: 480, y: 80, role: "DEF" }, { team: "B", nr: 3, x: 490, y: 160, role: "DEF" }, { team: "B", nr: 4, x: 490, y: 240, role: "DEF" }, { team: "B", nr: 5, x: 480, y: 320, role: "DEF" }, { team: "B", nr: 6, x: 380, y: 90, role: "MID" }, { team: "B", nr: 7, x: 400, y: 160, role: "MID" }, { team: "B", nr: 8, x: 400, y: 240, role: "MID" }, { team: "B", nr: 10, x: 380, y: 310, role: "MID" }, { team: "B", nr: 9, x: 320, y: 150, role: "ATT" }, { team: "B", nr: 11, x: 320, y: 250, role: "ATT" }
        ];

        basePositions.forEach(p => {
            players.push({
                team: p.team, nr: p.nr, role: p.role,
                homeX: p.x, homeY: p.y,
                x: p.x, y: p.y,
                targetX: p.x, targetY: p.y,
                speed: 0.05 + Math.random() * 0.02,
                randomOffset: Math.random() * 100
            });
        });

        function updateGame() {
            // Rysowanie boiska
            ctx.fillStyle = "#236926"; ctx.fillRect(0, 0, 600, 400);
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, 600, 400);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();
            ctx.beginPath(); ctx.arc(300, 200, 45, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeRect(0, 110, 70, 180); ctx.strokeRect(530, 110, 70, 180);

            // Wynik
            ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "bold 16px Arial";
            ctx.fillText("FC KULECZKI " + scoreA + " : " + scoreB + " NIEBIESKIE ASY", 190, 30);

            let czas = Date.now();

            // POPRAWKA: Zaawansowane trzymanie stref taktycznych
            players.forEach(p => {
                if (stanMeczu === "srodek" || stanMeczu === "aut" || stanMeczu === "rozny" || stanMeczu === "aut_bramkowy") {
                    // Dreptanie w miejscu na swoich domowych pozycjach
                    p.targetX = p.homeX + Math.sin((czas / 300) + p.randomOffset) * 6;
                    p.targetY = p.homeY + Math.cos((czas / 400) + p.randomOffset) * 6;
                } else {
                    // W TRAKCIE AKCJI: Cały zespół przesuwa się lekko o max 40 pikseli w stronę piłki (elastyczny blok)
                    // Nigdy nie opuszczają swojej formacji, nie ma biegania w jedno miejsce!
                    let przesuniecieX = (ball.x - 300) * 0.15;
                    let przesuniecieY = (ball.y - 200) * 0.15;
                    
                    // Ograniczamy ruch bramkarzy, żeby nie biegali po boisku
                    if (p.role === "GK") { przesuniecieX = 0; przesuniecieY = (ball.y - 200) * 0.1; }

                    p.targetX = p.homeX + przesuniecieX + Math.sin((czas / 500) + p.randomOffset) * 4;
                    p.targetY = p.homeY + przesuniecieY + Math.cos((czas / 500) + p.randomOffset) * 4;

                    // EKSTRA SMACZEK: Tylko zawodnik bezpośrednio przy piłce podbiega do niej blisko
                    if (p.team === "A" && ball.x > 300 && p.role === "ATT") { p.targetX = ball.x - 15; p.targetY = ball.y; }
                    if (p.team === "B" && ball.x < 300 && p.role === "ATT") { p.targetX = ball.x + 15; p.targetY = ball.y; }
                }

                // Płynny ruch
                p.x += (p.targetX - p.x) * p.speed;
                p.y += (p.targetY - p.y) * p.speed;

                // Rysowanie kulek
                ctx.fillStyle = p.team === "A" ? "#e53935" : "#1e88e5";
                ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText(p.nr, p.x - 5, p.y + 4);
            });

            // Ruch piłki
            ball.x += (ball.targetX - ball.x) * ball.speed;
            ball.y += (ball.targetY - ball.y) * ball.speed;
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.stroke();

            timerStanu++;
            if (timerStanu > 160) {
                timerStanu = 0;
                silnikDecyzjiSedziego();
            }

            requestAnimationFrame(updateGame);
        }

        function silnikDecyzjiSedziego() {
            comment.style.color = "#00ff00";
            let los = Math.random();

            if (stanMeczu === "srodek" || stanMeczu === "aut" || stanMeczu === "rozny" || stanMeczu === "aut_bramkowy") {
                stanMeczu = "akcja";
                if (los < 0.5) {
                    comment.innerText = "> [Atak] Pomocnicy FC Kuleczki podaniami po skosie rozciągają obronę rywala...";
                    ball.targetX = 450 + Math.random() * 100; ball.targetY = 100 + Math.random() * 200;
                } else {
                    comment.style.color = "#ff5252";
                    comment.innerText = "> [Zagrożenie] Niebieskie Asy wymieniają szybkie podania przed naszym polem karnym...";
                    ball.targetX = 50 + Math.random() * 100; ball.targetY = 100 + Math.random() * 200;
                }
            } else {
                if (los < 0.22) {
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = 200 + (Math.random()*20 - 10); scoreA++; comment.style.color = "#ffeb3b";
                        comment.innerText = "⚽ GOOOOL!! Piękne uderzenie z woleja! Piłka ląduje w siatce!";
                    } else {
                        ball.targetX = 5; ball.targetY = 200 + (Math.random()*20 - 10); scoreB++; comment.style.color = "#ff5252";
                        comment.innerText = "❌ BRAMKA! Przeciwnik oddaje czysty strzał po ziemi i zdobywa gola.";
                    }
                    stanMeczu = "srodek";
                } else if (los >= 0.22 && los < 0.48) {
                    stanMeczu = "aut_bramkowy"; comment.style.color = "#aaaaaa";
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = Math.random() > 0.5 ? 60 : 340;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Nieudana próba strzału. Piłka przelatuje nad poprzeczką.";
                    } else {
                        ball.targetX = 5; ball.targetY = Math.random() > 0.5 ? 60 : 340;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Strzał Niebieskich mija prawy słupek bramki.";
                    }
                } else if (los >= 0.48 && los < 0.74) {
                    stanMeczu = "rozny"; comment.style.color = "#00e5ff";
                    if (ball.x > 300) {
                        ball.targetX = 590; ball.targetY = Math.random() > 0.5 ? 15 : 385;
                        comment.innerText = "📐 [RZUT ROŻNY] Obrońca wślizgiem blokuje strzał! Korner dla FC Kuleczki.";
                    } else {
                        ball.targetX = 10; ball.targetY = Math.random() > 0.5 ? 15 : 385;
                        comment.innerText = "📐 [RZUT ROŻNY] Nasz defensor ofiarnie wybija piłkę za linię końcową.";
                    }
                } else {
                    stanMeczu = "aut"; comment.style.color = "#ffb300";
                    ball.targetX = 200 + Math.random() * 200; ball.targetY = Math.random() > 0.5 ? -12 : 412;
                    comment.innerText = "🏳️ [AUT] Piłka opuszcza boisko za linią boczną po twardej walce w środku pola.";
                }
            }
        }

        updateGame();
    </script>
</body>
</html>
