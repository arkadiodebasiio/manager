<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kuleczka Bokser</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a472a; /* Kolor boiska/maty */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="ringCanvas"></canvas>

<script>
    const canvas = document.getElementById('ringCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Obiekt boksera (kuleczki)
    const boxer = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 20,          // rozmiar kuleczki
        speed: 3,            // prędkość biegu
        vx: 2,
        vy: 1.5,
        color: '#e74c3c',    // czerwony kolorek jak w managerze
        number: '9'          // numer na koszulce/plecach
    };

    function update() {
        // Ruch kuleczki
        boxer.x += boxer.vx;
        boxer.y += boxer.vy;

        // Odbijanie od krawędzi ekranu
        if (boxer.x - boxer.radius < 0 || boxer.x + boxer.radius > canvas.width) {
            boxer.vx *= -1;
        }
        if (boxer.y - boxer.radius < 0 || boxer.y + boxer.radius > canvas.height) {
            boxer.vy *= -1;
        }
    }

    function draw() {
        // Czyszczenie tła (efekt zielonej murawy/maty)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Rysowanie cienia kuleczki
        ctx.beginPath();
        ctx.arc(boxer.x + 3, boxer.y + 3, boxer.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fill();

        // Rysowanie głównego ciała kuleczki
        ctx.beginPath();
        ctx.arc(boxer.x, boxer.y, boxer.radius, 0, Math.PI * 2);
        ctx.fillStyle = boxer.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Rysowanie małych rękawic bokserskich (po bokach kuleczki)
        const gloveRadius = 6;
        // Lewa rękawica
        ctx.beginPath();
        ctx.arc(boxer.x - boxer.radius - 2, boxer.y - 4, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Prawa rękawica
        ctx.beginPath();
        ctx.arc(boxer.x + boxer.radius + 2, boxer.y - 4, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Rysowanie numerka w środku kuleczki (styl retro CM/FM)
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boxer.number, boxer.x, boxer.y);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
