<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symulacja Bokserska 2D</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #hud {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .p1 { color: #00ddff; }
        .p2 { color: #ff3366; }
        .bar-bg {
            width: 300px;
            height: 16px;
            background: #222;
            border: 2px solid #444;
            display: inline-block;
        }
        .bar-fill { height: 100%; transition: width 0.1s; }
        #p1-bar { background: #00ddff; width: 100%; }
        #p2-bar { background: #ff3366; width: 100%; }
        canvas {
            background: #1c1d27;
            border: 6px solid #ffd700;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #help {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="hud">
    <div><span class="p1">MIGUEL (P1):</span> <div class="bar-bg"><div id="p1-bar" class="bar-fill"></div></div></div>
    <div><span class="p2">ROCKY (P2):</span> <div class="bar-bg"><div id="p2-bar" class="bar-fill"></div></div></div>
</div>

<canvas id="canvas" width="800" height="400"></canvas>

<div id="help">
    <strong>P1 (Niebieski):</strong> Ruch: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> | Cios: <kbd>G</kbd> / <kbd>H</kbd><br>
    <strong>P2 (Czerwony):</strong> Ruch: <kbd>Strzałki</kbd> | Cios: <kbd>1</kbd> / <kbd>2</kbd>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const p1 = { x: 250, y: 200, angle: 0, color: '#00ddff', glove: '#0055ff', hp: 100, punchTimer: 0, speed: 3.5 };
    const p2 = { x: 550, y: 200, angle: Math.PI, color: '#ff3366', glove: '#aa0022', hp: 100, punchTimer: 0, speed: 3.5 };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
        // Ruch P1
        if (keys['KeyW']) p1.y -= p1.speed;
        if (keys['KeyS']) p1.y += p1.speed;
        if (keys['KeyA']) p1.x -= p1.speed;
        if (keys['KeyD']) p1.x += p1.speed;

        // Ruch P2
        if (keys['ArrowUp']) p2.y -= p2.speed;
        if (keys['ArrowDown']) p2.y += p2.speed;
        if (keys['ArrowLeft']) p2.x -= p2.speed;
        if (keys['ArrowRight']) p2.x += p2.speed;

        // Celowanie (zwrócenie twarzą do przeciwnika)
        p1.angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        p2.angle = Math.atan2(p1.y - p2.y, p1.x - p2.x);

        // Granice ringu
        [p1, p2].forEach(p => {
            p.x = Math.max(30, Math.min(canvas.width - 30, p.x));
            p.y = Math.max(30, Math.min(canvas.height - 30, p.y));
            if (p.punchTimer > 0) p.punchTimer--;
        });

        // Ciosy P1
        if ((keys['KeyG'] || keys['KeyH']) && p1.punchTimer === 0) {
            p1.punchTimer = 15;
            if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < 55) {
                p2.hp = Math.max(0, p2.hp - 8);
            }
        }
        // Ciosy P2
        if ((keys['Digit1'] || keys['Digit2'] || keys['Numpad1'] || keys['Numpad2']) && p2.punchTimer === 0) {
            p2.punchTimer = 15;
            if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < 55) {
                p1.hp = Math.max(0, p1.hp - 8);
            }
        }

        // Aktualizacja UI
        document.getElementById('p1-bar').style.width = p1.hp + '%';
        document.getElementById('p2-bar').style.width = p2.hp + '%';

        // Nokaut
        if (p1.hp <= 0 || p2.hp <= 0) {
            alert(p1.hp <= 0 ? "K.O.! ROCKY WYGRYWA!" : "K.O.! MIGUEL WYGRYWA!");
            p1.hp = 100; p2.hp = 100; p1.x = 250; p2.x = 550;
        }
    }

    function drawBoxer(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // Cień
        ctx.beginPath();
        ctx.arc(0, 4, 18, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fill();

        // Tułów
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.stroke();

        // Głowa
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdbac';
        ctx.fill();
        ctx.stroke();

        // Rękawice (wysuwają się przy ciosie)
        let offset = p.punchTimer > 0 ? 28 : 16;
        ctx.beginPath();
        ctx.arc(offset, -12, 6, 0, Math.PI * 2);
        ctx.arc(offset, 12, 6, 0, Math.PI * 2);
        ctx.fillStyle = p.glove;
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Rysowanie ringu
        ctx.strokeStyle = '#e94560';
        ctx.lineWidth = 4;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        drawBoxer(p1);
        drawBoxer(p2);
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
