<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Boxing Engine</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
            background: #333;
            border: 4px solid #fff;
            overflow: hidden;
        }
        /* Ring linia */
        #ring-line {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 4px;
            background: #555;
        }
        /* Interfejs UI */
        .ui-panel {
            position: absolute;
            top: 10px;
            width: 350px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
        }
        #p1-ui { left: 10px; }
        #p2-ui { right: 10px; text-align: right; }
        .bar {
            height: 15px;
            margin: 5px 0;
            background: #444;
            transition: width 0.1s;
        }
        .hp { background: #ff3333; width: 100%; }
        .stamina { background: #33ff33; width: 100%; }
        
        /* Zawodnicy */
        .boxer {
            position: absolute;
            bottom: 40px;
            width: 60px;
            height: 120px;
            transition: transform 0.05s;
        }
        #player1 { background: #3388ff; left: 200px; }
        #player2 { background: #ff3333; left: 540px; }
        
        /* Rękawice (Wizualizacja ciosów) */
        .glove {
            position: absolute;
            top: 30px;
            width: 25px;
            height: 25px;
            background: #fff;
            border-radius: 50%;
            display: none;
        }
        #p1-glove { right: -20px; background: #1155cc; }
        #p2-glove { left: -20px; background: #cc1111; }

        /* Stan bloku */
        .shield {
            position: absolute;
            top: 10px;
            width: 100%;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border: 2px dashed #fff;
            display: none;
        }

        #controls-info {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Ring -->
        <div id="ring-line"></div>

        <!-- UI Gracza 1 -->
        <div class="ui-panel" id="p1-ui">
            <div>GRACZ 1 (Niebieski)</div>
            <div class="bar"><div id="p1-hp" class="hp"></div></div>
            <div class="bar"><div id="p1-stamina" class="stamina"></div></div>
            <div id="p1-state">Stan: Wolny</div>
        </div>

        <!-- UI Gracza 2 -->
        <div class="ui-panel" id="p2-ui">
            <div>GRACZ 2 (Czerwony)</div>
            <div class="bar"><div id="p2-hp" class="hp"></div></div>
            <div class="bar"><div id="p2-stamina" class="stamina"></div></div>
            <div id="p2-state">Stan: Wolny</div>
        </div>

        <!-- Zawodnicy -->
        <div id="player1" class="boxer">
            <div id="p1-glove" class="glove"></div>
            <div id="p1-shield" class="shield"></div>
        </div>
        <div id="player2" class="boxer">
            <div id="p2-glove" class="glove"></div>
            <div id="p2-shield" class="shield"></div>
        </div>
    </div>

    <div id="controls-info">
        <strong>Gracz 1:</strong> A/D - Ruch | W - Blok | G - Lewy Prosty | H - Prawy Sierpowy<br>
        <strong>Gracz 2:</strong> Strzałki Lewo/Prawo - Ruch | Strzałka Góra - Blok | Kp 1 - Lewy Prosty | Kp 2 - Prawy Sierpowy
    </div>

<script>
    // Konfiguracja i Stan Gry
    const CONFIG = {
        speed: 5,
        jabDist: 50,
        hookDist: 35,
        staminaRegen: 0.5,
        gravity: 0.5
    };

    const p1 = {
        id: 1, el: document.getElementById('player1'), glove: document.getElementById('p1-glove'), shield: document.getElementById('p1-shield'),
        hpEl: document.getElementById('p1-hp'), stamEl: document.getElementById('p1-stamina'), stateEl: document.getElementById('p1-state'),
        x: 200, hp: 100, stamina: 100, state: 'idle', stateTimer: 0
    };

    const p2 = {
        id: 2, el: document.getElementById('player2'), glove: document.getElementById('p2-glove'), shield: document.getElementById('p2-shield'),
        hpEl: document.getElementById('p2-hp'), stamEl: document.getElementById('p2-stamina'), stateEl: document.getElementById('p2-state'),
        x: 540, hp: 100, stamina: 100, state: 'idle', stateTimer: 0
    };

    const keys = {};

    // Nasłuchiwanie klawiatury
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Funkcja zadawania ciosu
    function punch(attacker, defender, type) {
        if (attacker.state !== 'idle' || attacker.stamina < 15) return;

        attacker.state = type;
        attacker.stateTimer = type === 'jab' ? 10 : 18; // czas trwania animacji w klatkach
        attacker.stamina -= type === 'jab' ? 15 : 25;
        attacker.glove.style.display = 'block';

        // Obliczanie zasięgu i trafienia
        const distance = Math.abs((attacker.x + 30) - (defender.x + 30));
        const reach = type === 'jab' ? CONFIG.jabDist : CONFIG.hookDist;
        const damage = type === 'jab' ? 8 : 18;

        if (distance <= reach + 60) { // 60 to szerokość boxera
            setTimeout(() => {
                if (defender.state === 'blocking') {
                    defender.stamina = Math.max(0, defender.stamina - (damage / 2));
                    attacker.stateTimer += 5; // kara za uderzenie w blok (odrzut)
                } else {
                    defender.hp = Math.max(0, defender.hp - damage);
                    defender.state = 'hit';
                    defender.stateTimer = 12; // ogłuszenie po trafieniu
                    defender.glove.style.display = 'none';
                }
            }, 50);
        }
    }

    // Główna pętla gry (60 FPS)
    function update() {
        // --- REGENERACJA I CZAS STANU ---
        [p1, p2].forEach(p => {
            if (p.stateTimer > 0) {
                p.stateTimer--;
            } else {
                if (p.state !== 'blocking') p.state = 'idle';
                p.glove.style.display = 'none';
            }
            if (p.state === 'idle' && p.stamina < 100) p.stamina = Math.min(100, p.stamina + CONFIG.staminaRegen);
        });

        // --- OBSŁUGA STEROWANIA ---
        // Gracz 1
        if (p1.state === 'idle' || p1.state === 'blocking') {
            if (keys['KeyW']) { p1.state = 'blocking'; p1.shield.style.display = 'block'; }
            else { p1.state = 'idle'; p1.shield.style.display = 'none'; }

            if (p1.state === 'idle') {
                if (keys['KeyA']) p1.x = Math.max(0, p1.x - CONFIG.speed);
                if (keys['KeyD']) p1.x = Math.min(p2.x - 55, p1.x + CONFIG.speed); // blokada przechodzenia przez siebie
                if (keys['KeyG']) punch(p1, p2, 'jab');
                if (keys['KeyH']) punch(p1, p2, 'hook');
            }
        }

        // Gracz 2
        if (p2.state === 'idle' || p2.state === 'blocking') {
            if (keys['ArrowUp']) { p2.state = 'blocking'; p2.shield.style.display = 'block'; }
            else { p2.state = 'idle'; p2.shield.style.display = 'none'; }

            if (p2.state === 'idle') {
                if (keys['ArrowLeft']) p2.x = Math.max(p1.x + 55, p2.x - CONFIG.speed);
                if (keys['ArrowRight']) p2.x = Math.min(740, p2.x + CONFIG.speed);
                if (keys['Numpad1'] || keys['Digit1']) punch(p2, p1, 'jab'); // Obsługa numpada lub cyfry 1
                if (keys['Numpad2'] || keys['Digit2']) punch(p2, p1, 'hook');
            }
        }

        // --- AKTUALIZACJA POZYCJI I UI ---
        p1.el.style.left = p1.x + 'px';
        p2.el.style.left = p2.x + 'px';

        p1.hpEl.style.width = p1.hp + '%';
        p1.stamEl.style.width = p1.stamina + '%';
        p1.stateEl.innerText = `Stan: ${p1.state.toUpperCase()}`;

        p2.hpEl.style.width = p2.hp + '%';
        p2.stamEl.style.width = p2.stamina + '%';
        p2.stateEl.innerText = `Stan: ${p2.state.toUpperCase()}`;

        // Koniec gry
        if (p1.hp <= 0 || p2.hp <= 0) {
            alert(p1.hp <= 0 ? "GRACZ 2 WYGRYWA K.O.!" : "GRACZ 1 WYGRYWA K.O.!");
            p1.hp = 100; p2.hp = 100; p1.x = 200; p2.x = 540;
            p1.stamina = 100; p2.stamina = 100;
        }

        requestAnimationFrame(update);
    }

    // Uruchomienie silnika
    update();
</script>
</body>
</html>
