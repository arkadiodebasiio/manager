<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Boxing Manager Mini</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #panel { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; width: 300px; border: 1px solid #475569; }
        .row { display: flex; justify-content: space-between; margin: 6px 0; font-weight: bold; }
        button { background: #2563eb; color: #fff; border: none; padding: 4px 10px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        #fight-btn { background: #059669; width: 100%; padding: 10px; margin-top: 8px; font-size: 14px; border-radius: 8px; }
        canvas { border-radius: 12px; border: 2px solid #fff; background: #1e1b4b; }
    </style>
</head>
<body>

    <div id="panel">
        <div class="row"><span>Punkty Trenera:</span><span id="pts" style="color:#38bdf8">5</span></div>
        <div class="row"><span>SIŁA (<span id="v-pow">12</span>):</span><button onclick="train('pow')">+</button></div>
        <div class="row"><span>SZYBKOŚĆ (<span id="v-spd">6</span>):</span><button onclick="train('spd')">+</button></div>
        <button id="fight-btn" onclick="startFight()">START WALKID</button>
    </div>

    <canvas id="stage" width="400" height="200"></canvas>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

let points = 5, active = false, over = false, txt = "TRENUJ I ROZPOCZNIJ WALKĘ";
let bA = { name: "ALEX", x: 130, y: 80, hp: 100, color: "#38bdf8", gloves: "#f59e0b", state: "IDLE", timer: 0, speed: 0.05, power: 12 };
let bB = { name: "BOB",  x: 240, y: 80, hp: 100, color: "#f43f5e", gloves: "#ffffff", state: "IDLE", timer: 0, speed: 0.06, power: 14 };

function train(type) {
    if (points <= 0) return;
    points--; document.getElementById("pts").innerText = points;
    if (type === 'pow') { bA.power += 4; document.getElementById("v-pow").innerText = bA.power; }
    else { bA.speed += 0.02; document.getElementById("v-spd").innerText = Math.round(bA.speed * 100); }
}

function startFight() { bA.hp = 100; bB.hp = 100; over = false; active = true; txt = "RUNDA 1 - GONG!"; }

function runAI(p, enemy, isLeft) {
    if (!active || over) return; p.timer++;
    if ((p.state === "PUNCH" || p.state === "HIT") && p.timer > 10) p.state = "IDLE";
    if (p.state === "IDLE" && Math.random() < p.speed) {
        p.state = "PUNCH"; p.timer = 0; enemy.state = "HIT"; enemy.timer = 0; enemy.hp -= p.power;
        txt = `${p.name} TRAFIA ZA -${p.power} HP!`;
        if (enemy.hp <= 0) { enemy.hp = 0; over = true; txt = `K.O.! WYGRYWA ${p.name}!`; }
    }
}

function drawBoxer(p, isLeft) {
    let dx = p.x; if (p.state === "PUNCH") dx += isLeft ? 15 : -15; if (p.state === "HIT") dx += isLeft ? -6 : 6;
    ctx.fillStyle = p.color; ctx.fillRect(dx, dy = p.y + 14, 24, 30); // Tors i spodenki
    ctx.fillStyle = "#ffcc99"; ctx.fillRect(dx + 3, p.y, 18, 14); // Twarz
    ctx.fillStyle = p.gloves; // Rękawice
    if (p.state === "PUNCH") ctx.fillRect(isLeft ? dx + 20 : dx - 10, p.y + 6, 12, 12);
    else { ctx.fillRect(dx - 4, p.y + 10, 8, 10); ctx.fillRect(dx + 20, p.y + 10, 8, 10); }
    ctx.fillStyle = "#ef4444"; ctx.fillRect(p.x - 2, p.y - 10, 28, 4); // Paski życia
    ctx.fillStyle = "#10b981"; ctx.fillRect(p.x - 2, p.y - 10, (p.hp / 100) * 28, 4);
}

function render() {
    ctx.fillStyle = "#1e1b4b"; ctx.fillRect(0, 0, 400, 200); // Widownia
    ctx.fillStyle = "#475569"; ctx.fillRect(40, 50, 320, 120); // Ring
    ctx.fillStyle = "#ef4444"; ctx.fillRect(40, 46, 320, 4); // Lina ringu
    runAI(bA, bB, true); runAI(bB, bA, false); drawBoxer(bA, true); drawBoxer(bB, false);
    ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(50, 145, 300, 22); // Panel tekstu
    ctx.fillStyle = "#fbbf24"; ctx.font = "11px monospace"; ctx.fillText(txt, 60, 159);
    requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
