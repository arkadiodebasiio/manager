<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Boxing Simulation</title>
    <style>
        body {
            margin: 0;
            background: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 700px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .p1-color { color: #3388ff; }
        .p2-color { color: #ff3333; }
        canvas {
            background: #222;
            border: 6px solid #c9a000;
            box-shadow: 0 0 25px rgba(201, 160, 0, 0.4);
        }
        #info {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="ui">
    <div><span class="p1-color">NIEBIESKI (P1) HP:</span> <span id="p1-hp">100</span></div>
    <div><span class="p2-color">CZERWONY (P2) HP:</span> <span id="p2-hp">100</span></div>
</div>

<canvas id="ring" width="700" height="400"></canvas>

<div id="info">
    <strong>GRACZ 1 (Niebieski):</strong> Ruch: W, A, S, D | Cios: <strong>Spacja</strong><br>
    <strong>GRACZ 2 (Czerwony):</strong> Ruch: Strzałki (← ↑ → ↓) | Cios: <strong>Enter</strong>
</div>

<script>
    const canvas = document.getElementById('ring');
    const ctx = canvas.getContext('2d');

    const p1 = { x: 200, y: 200, radius: 18, color: '#3388ff', hp: 100, punchCooldown: 0, face: 'right' };
    const p2 = { x: 500, y: 200, radius: 18, color: '#ff3333', hp: 100, punchCooldown: 0, face: 'left' };

    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function update() {
        // Ruch P1 (WSAD)
        if (keys['KeyW']) p1.y -= 3;
        if (keys['KeyS']) p1.y += 3;
        if (keys['KeyA']) { p1.x -= 3; p1.face = 'left'; }
        if (keys['KeyD']) { p1.x += 3; p1.face = 'right'; }

        // Ruch P2 (Strzałki)
        if (keys['ArrowUp']) p2.y -= 3;
        if (keys['ArrowDown']) p2.y += 3;
        if (keys['ArrowLeft']) { p2.x -= 3; p2.face = 'left'; }
        if (keys['ArrowRight']) { p2.x += 3; p2.face = 'right'; }

        // Ograniczenie do ringu
        p1.x = Math.max(30, Math.min(canvas.width - 30, p1.x));
        p1.y = Math.max(30, Math.min(canvas.height - 30, p1.y));
        p2.x = Math.max(30, Math.min(canvas.width - 30, p2.x));
        p2.y = Math.max(30, Math.min(canvas.height - 30, p2.y));

        // Cooldowny ciosów
        if (p1.punchCooldown > 0) p1.punchCooldown--;
        if (p2.punchCooldown > 0) p2.punchCooldown--;

        // Cios P1 (Spacja)
        if (keys['Space'] && p1.punchCooldown === 0) {
            p1.punchCooldown = 25;
            let dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
            if (dist < 45) {
                p2.hp = Math.max(0, p2.hp - 10);
            }
        }

        // Cios P2 (Enter)
        if (keys['Enter'] && p2.punchCooldown === 0) {
            p2.punchCooldown = 25;
            let dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
            if (dist < 45) {
                p1.hp = Math.max(0, p1.hp - 10);
            }
        }

        // Aktualizacja pasków tekstowych UI
        document.getElementById('p1-hp').innerText = p1.hp;
        document.getElementById('p2-hp').innerText = p2.hp;

        // Warunek K.O.
        if (p1.hp <= 0 || p2.hp <= 0) {
            alert(p1.hp <= 0 ? "K.O.! CZERWONYY WYGRYWA!" : "K.O.! NIEBIESKI WYGRYWA!");
            p1.hp = 100; p2.hp = 100; p1.x = 200; p2.x = 500;
        }
    }

    function draw() {
        // Tło ringu (widok z góry)
        ctx.fillStyle = '#1b1b1b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Linie ringu z góry
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        // Rysowanie P1
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
        ctx.fillStyle = p1.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Rękawica P1 / wskaźnik ataku
        ctx.fillStyle = '#ff1e56';
        ctx.beginPath();
        ctx.arc(p1.x + (p1.face === 'right' ? 18 : -18), p1.y, 7, 0, Math.PI * 2);
        ctx.fill();

        // Rysowanie P2
        ctx.beginPath();
        ctx.arc(p2.x, p2.y, p2.radius, 0, Math.PI * 2);
        ctx.fillStyle = p2.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Rękawica P2 / wskaźnik ataku
        ctx.fillStyle = '#ff1e56';
        ctx.beginPath();
        ctx.arc(p2.x + (p2.face === 'right' ? 18 : -18), p2.y, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
