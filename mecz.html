<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Bokser w ringu - nieliniowe skoki</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="ringCanvas"></canvas>

<script>
    const canvas = document.getElementById('ringCanvas');
    const ctx = canvas.getContext('2d');

    const ringSize = 500;
    canvas.width = ringSize;
    canvas.height = ringSize;

    // Środek ringu (wirtualny przeciwnik)
    const ringCenter = { x: canvas.width / 2, y: canvas.height / 2 };
    const orbitRadius = 110; 

    // Obiekt boksera
    const boxer = {
        angle: Math.PI / 2, 
        orbitSpeed: 0.035,    // Prędkość kroku po łuku
        radius: 24,
        color: '#e74c3c',
        number: '1',
        animTimer: 0,
        punchTimer: 0,     
        isPunching: false, 
        punchProgress: 0,
        
        // Logika nieliniowych skoków
        isMovingThisJump: false, // Czy w tym konkretnym podskoku przesuwa się po łuku?
        wasAboveZero: true       // Pomocnicza flaga do wykrywania momentu odbicia od ziemi
    };

    function drawRing() {
        ctx.fillStyle = '#d4ac0d';
        ctx.fillRect(50, 50, canvas.width - 100, canvas.height - 100);

        ctx.strokeStyle = '#b7950b';
        ctx.lineWidth = 2;
        for (let i = 70; i < canvas.width - 50; i += 40) {
            ctx.beginPath();
            ctx.moveTo(i, 50);
            ctx.lineTo(i, canvas.height - 50);
            ctx.stroke();
        }

        const corners = [
            {x: 50, y: 50, color: '#c0392b'},
            {x: canvas.width - 50, y: 50, color: '#2980b9'},
            {x: 50, y: canvas.height - 50, color: '#fff'},
            {x: canvas.width - 50, y: canvas.height - 50, color: '#fff'}
        ];

        for (let offset = 10; offset <= 30; offset += 10) {
            ctx.strokeStyle = offset === 10 ? '#fff' : (offset === 20 ? '#c0392b' : '#2980b9');
            ctx.lineWidth = 3;
            ctx.strokeRect(50 - offset/2, 50 - offset/2, canvas.width - 100 + offset, canvas.height - 100 + offset);
        }

        corners.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = c.color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        // Punkt przeciwnika w centrum
        ctx.beginPath();
        ctx.arc(ringCenter.x, ringCenter.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fill();
    }

    function update() {
        boxer.animTimer += 0.2; // Szybkość pracy nóg
        boxer.punchTimer += 1;

        // Wykrywanie momentu odbicia od ziemi
        const currentSin = Math.sin(boxer.animTimer);
        
        if (currentSin > 0 && !boxer.wasAboveZero) {
            const draw = Math.random();
            if (draw < 0.30) {
                boxer.isMovingThisJump = true;  // 30% szans na krok po łuku
            } else {
                boxer.isMovingThisJump = false; // 70% szans na skok w miejscu
            }
        }
        boxer.wasAboveZero = (currentSin > 0);

        if (boxer.isMovingThisJump && currentSin > 0) {
            boxer.angle -= boxer.orbitSpeed * currentSin; 
        }

        // Inicjacja ciosu prostego
        if (!boxer.isPunching && boxer.punchTimer > 60 && Math.random() < 0.04) {
            boxer.isPunching = true;
            boxer.punchProgress = 0;
            boxer.punchTimer = 0;
        }

        if (boxer.isPunching) {
            boxer.punchProgress += 0.25;
            if (boxer.punchProgress >= Math.PI) {
                boxer.punchProgress = 0;
                boxer.isPunching = false;
            }
        }
    }

    function drawBoxer() {
        const baseX = ringCenter.x + Math.cos(boxer.angle) * orbitRadius;
        const baseY = ringCenter.y + Math.sin(boxer.angle) * orbitRadius;

        const bounceOffset = Math.sin(boxer.animTimer) * 4;
        const tiltOffset = Math.cos(boxer.animTimer) * 1.5;

        const punchExtension = boxer.isPunching ? Math.sin(boxer.punchProgress) * 35 : 0;
        const bodyLean = punchExtension * 0.25;

        // Cień
        ctx.beginPath();
        ctx.ellipse(baseX, baseY + boxer.radius, boxer.radius - Math.abs(bounceOffset), 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();

        ctx.save();
        ctx.translate(baseX + tiltOffset, baseY + bounceOffset);
        ctx.rotate(boxer.angle - Math.PI / 2); 

        const currentY = -bodyLean;
        const currentX = 0;

        // Ciało boksera
        ctx.beginPath();
        ctx.arc(currentX, currentY, boxer.radius, 0, Math.PI * 2);
        ctx.fillStyle = boxer.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#fff';
        ctx.stroke();

        // Garda
        const gloveRadius = 7;
        const leftGloveBaseX = currentX - 12;
        const rightGloveBaseX = currentX + 12;
        const gloveBaseY = currentY - boxer.radius + 4;

        // Prawa rękawica
        ctx.beginPath();
        ctx.arc(rightGloveBaseX, gloveBaseY + Math.sin(boxer.animTimer * 2) * 2, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Lewa rękawica (cios)
        const finalLeftGloveY = gloveBaseY - punchExtension;

        if (boxer.isPunching && punchExtension > 5) {
            ctx.beginPath();
            ctx.moveTo(leftGloveBaseX, currentY - 10);
            ctx.lineTo(leftGloveBaseX, finalLeftGloveY);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
        }

        ctx.beginPath();
        ctx.arc(leftGloveBaseX, finalLeftGloveY, gloveRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.stroke();

        // Numer retro na koszulce
        ctx.save();
        ctx.translate(currentX, currentY);
        ctx.rotate(-(boxer.angle - Math.PI / 2)); 
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(boxer.number, 0, 0);
        ctx.restore();

        ctx.restore(); 
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawRing();
        update();
        drawBoxer();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
