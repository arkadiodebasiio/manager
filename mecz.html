<!DOCTYPE html>
<html>
<head>
    <title>Championship Manager 2D - Żywy Ruch AI</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        canvas { background: #236926; border: 4px solid #fff; box-shadow: 0px 0px 25px rgba(0,0,0,0.7); display: block; margin: 10px auto; }
        #commentary { background: #000; border: 2px solid #333; width: 580px; min-height: 45px; margin: 10px auto; padding: 10px; font-size: 14px; color: #00ff00; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>

    <div id="commentary">> Rozgrzewka zakończona. 22 zawodników rozpoczyna walkę na żywo...</div>
    <canvas id="matchCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("matchCanvas");
        const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");

        let scoreA = 0; let scoreB = 0;
        let ball = { x: 300, y: 200, targetX: 300, targetY: 200, speed: 0.08 };
        let players = [];
        let stanMeczu = "srodek"; 
        let timerStanu = 0;

        // Baza pozycji taktycznych
        const basePositions = [
            { team: "A", nr: 1, x: 40, y: 200 }, { team: "A", nr: 2, x: 120, y: 80 }, { team: "A", nr: 3, x: 110, y: 160 }, { team: "A", nr: 4, x: 110, y: 240 }, { team: "A", nr: 5, x: 120, y: 320 }, { team: "A", nr: 6, x: 220, y: 90 }, { team: "A", nr: 7, x: 200, y: 160 }, { team: "A", nr: 8, x: 200, y: 240 }, { team: "A", nr: 10, x: 220, y: 310 }, { team: "A", nr: 11, x: 280, y: 150 }, { team: "A", nr: 9, x: 280, y: 250 },
            { team: "B", nr: 1, x: 560, y: 200 }, { team: "B", nr: 2, x: 480, y: 80 }, { team: "B", nr: 3, x: 490, y: 160 }, { team: "B", nr: 4, x: 490, y: 240 }, { team: "B", nr: 5, x: 480, y: 320 }, { team: "B", nr: 6, x: 380, y: 90 }, { team: "B", nr: 7, x: 400, y: 160 }, { team: "B", nr: 8, x: 400, y: 240 }, { team: "B", nr: 10, x: 380, y: 310 }, { team: "B", nr: 9, x: 320, y: 150 }, { team: "B", nr: 11, x: 320, y: 250 }
        ];

        // POPRAWKA: Każdy gracz dostaje unikalne cechy, osobistą prędkość i własny zegar (offset)
        basePositions.forEach(p => {
            players.push({
                team: p.team, nr: p.nr,
                homeX: p.x, homeY: p.y,
                x: p.x, y: p.y,
                targetX: p.x, targetY: p.y,
                speed: 0.03 + Math.random() * 0.04, // Indywidualna prędkość bota
                randomOffset: Math.random() * 100    // Rozbija synchronizację dreptania w miejscu
            });
        });

        // --- PĘTLA GRAFICZNA 60 FPS ---
        function updateGame() {
            // Rysowanie boiska
            ctx.fillStyle = "#236926"; ctx.fillRect(0, 0, 600, 400);
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, 600, 400);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();
            ctx.beginPath(); ctx.arc(300, 200, 45, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeRect(0, 110, 70, 180); ctx.strokeRect(530, 110, 70, 180);

            // Tablica wyników
            ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "bold 16px Arial";
            ctx.fillText("FC KULECZKI " + scoreA + " : " + scoreB + " NIEBIESKIE ASY", 190, 30);

            // POPRAWKA: Ciągła, niesynchroniczna sztuczna inteligencja dla każdego bota z osobna
            let czas = Date.now();
            players.forEach(p => {
                // Jeśli nie ma ostrej akcji, zawodnicy cały czas krążą i żyją wokół swoich pozycji taktycznych
                if (stanMeczu === "srodek" || stanMeczu === "aut" || stanMeczu === "rozny" || stanMeczu === "aut_bramkowy") {
                    p.targetX = p.homeX + Math.sin((czas / 300) + p.randomOffset) * 12;
                    p.targetY = p.homeY + Math.cos((czas / 400) + p.randomOffset) * 12;
                } else {
                    // W trakcie akcji zawodnicy przyciągają się w stronę piłki pod różnymi kątami skosu
                    let dystansDoPilki = Math.hypot(ball.x - p.x, ball.y - p.y);
                    if (dystansDoPilki < 150) {
                        // Biegną agresywnie na piłkę
                        p.targetX += (ball.x - p.x) * 0.03;
                        p.targetY += (ball.y - p.y) * 0.03;
                    }
                }

                // Płynne, nieliniowe przesuwanie bota do jego celu
                p.x += (p.targetX - p.x) * p.speed;
                p.y += (p.targetY - p.y) * p.speed;

                // Rysowanie kulek
                ctx.fillStyle = p.team === "A" ? "#e53935" : "#1e88e5";
                ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText(p.nr, p.x - 5, p.y + 4);
            });

            // Płynny lot piłki
            ball.x += (ball.targetX - ball.x) * ball.speed;
            ball.y += (ball.targetY - ball.y) * ball.speed;
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.stroke();

            // Sędzia i zarządzanie czasem akcji
            timerStanu++;
            if (timerStanu > 160) {
                timerStanu = 0;
                silnikDecyzjiSedziego();
            }

            requestAnimationFrame(updateGame);
        }

        function silnikDecyzjiSedziego() {
            comment.style.color = "#00ff00";
            let los = Math.random();

            if (stanMeczu === "srodek" || stanMeczu === "aut" || stanMeczu === "rozny" || stanMeczu === "aut_bramkowy") {
                stanMeczu = "akcja";
                if (los < 0.5) {
                    comment.innerText = "> [Atak] Pomocnicy FC Kuleczki rozciągają grę. Dynamiczne wejście w strefę podbramkową!";
                    ball.targetX = 420 + Math.random() * 140; ball.targetY = 80 + Math.random() * 240;
                    // Każda kulka dostaje zupełnie unikalne współrzędne celu - koniec z jazdą sztywnym blokiem!
                    players.forEach(p => {
                        if (p.team === "A") { p.targetX = p.homeX + 140 + (Math.random()*45 - 20); p.targetY = p.homeY + (Math.random()*70 - 35); }
                        else { p.targetX = p.homeX - 40 + (Math.random()*35 - 15); p.targetY = p.homeY + (Math.random()*50 - 25); }
                    });
                } else {
                    comment.style.color = "#ff5252";
                    comment.innerText = "> [Zagrożenie] Niebieskie Asy przejmują środek pola i ostrym skosem uderzają skrzydłem!";
                    ball.targetX = 40 + Math.random() * 140; ball.targetY = 80 + Math.random() * 240;
                    players.forEach(p => {
                        if (p.team === "B") { p.targetX = p.homeX - 140 + (Math.random()*45 - 20); p.targetY = p.homeY + (Math.random()*70 - 35); }
                        else { p.targetX = p.homeX + 40 + (Math.random()*35 - 15); p.targetY = p.homeY + (Math.random()*50 - 25); }
                    });
                }
            } else {
                // Rozwiązanie akcji
                if (los < 0.22) {
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = 200 + (Math.random()*30 - 15); scoreA++; comment.style.color = "#ffeb3b";
                        comment.innerText = "⚽ GOOOOL!! Piękny strzał z ostrego kąta! Bramkarz bez szans!";
                    } else {
                        ball.targetX = 5; ball.targetY = 200 + (Math.random()*30 - 15); scoreB++; comment.style.color = "#ff5252";
                        comment.innerText = "❌ BRAMKA! Fatalny błąd w kryciu i Niebieskie Asy zdobywają punkt!";
                    }
                    stanMeczu = "srodek";
                    setTimeout(() => { players.forEach(p => { p.x = p.homeX; p.y = p.homeY; }); }, 1000);
                } else if (los >= 0.22 && los < 0.48) {
                    stanMeczu = "aut_bramkowy"; comment.style.color = "#aaaaaa";
                    if (ball.x > 300) {
                        ball.targetX = 595; ball.targetY = Math.random() > 0.5 ? 50 : 350;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Skrzydłowy przeniósł piłkę wysoko nad poprzeczką.";
                    } else {
                        ball.targetX = 5; ball.targetY = Math.random() > 0.5 ? 50 : 350;
                        comment.innerText = "🥅 [AUT BRAMKOWY] Niecelny strzał gości mija lewy słupek.";
                    }
                } else if (los >= 0.48 && los < 0.74) {
                    stanMeczu = "rozny"; comment.style.color = "#00e5ff";
                    if (ball.x > 300) {
                        ball.targetX = 590; ball.targetY = Math.random() > 0.5 ? 10 : 390;
                        comment.innerText = "📐 [RZUT ROŻNY] Stoper rzuca się pod nogi napastnika! Wybicie na rzut rożny.";
                    } else {
                        ball.targetX = 10; ball.targetY = Math.random() > 0.5 ? 10 : 390;
                        comment.innerText = "📐 [RZUT ROŻNY] Ofiarna interwencja naszej obrony ratuje nas przed stratą.";
                    }
                } else {
                    stanMeczu = "aut"; comment.style.color = "#ffb300";
                    ball.targetX = 150 + Math.random() * 300; ball.targetY = Math.random() > 0.5 ? -12 : 412;
                    comment.innerText = "🏳️ [AUT] Piłka wykopana na aut po ostrym starciu bark w bark w środku pola.";
                }
            }
        }

        updateGame();
    </script>
</body>
</html>
