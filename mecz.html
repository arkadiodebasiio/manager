<!DOCTYPE html>
<html>
<head>
    <title>CM4 Professional 2D Engine</title>
    <style>
        body { background: #0c1a10; color: #fff; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 5px; overflow: hidden; }
        canvas { background: #134e24; border: 3px solid #fff; display: block; margin: 5px auto; width: 620px; height: 380px; }
        #commentary { background: #000; border: 1px solid #333; width: 600px; min-height: 35px; margin: 5px auto; padding: 8px; font-size: 13px; color: #00ff00; text-align: left; }
        #scoreboard { font-size: 20px; font-weight: bold; font-family: Arial, sans-serif; margin: 3px; }
    </style>
</head>
<body>
    <div id="scoreboard">🟥 TEAM A <span id="sa">0</span> - <span id="sb">0</span> TEAM B 🟦</div>
    <canvas id="cmCanvas" width="640" height="400"></canvas>
    <div id="commentary">> Wczytywanie pełnej matrycy taktycznej 11v11...</div>

    <script>
        const canvas = document.getElementById("cmCanvas"); const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");
        let scoreA = 0; let scoreB = 0;

        // PEŁNA BAZA 22 ZAWODNIKÓW (Formacje 4-4-2 dla obu stron)
        let players = [
            // TEAM A (Czerwoni) - Atakuje w prawo
            { id: "A1",  team: "A", nr: 1,  role: "GK",  bx: 35,  by: 200, pas: 10, sho: 1,  def: 16, name: "Kowalski" },
            { id: "A2",  team: "A", nr: 2,  role: "DEF", bx: 130, by: 60,  pas: 11, sho: 4,  def: 15, name: "Piszczek" },
            { id: "A3",  team: "A", nr: 3,  role: "DEF", bx: 130, by: 150, pas: 10, sho: 3,  def: 18, name: "Glik" },
            { id: "A4",  team: "A", nr: 4,  role: "DEF", bx: 130, by: 250, pas: 11, sho: 2,  def: 17, name: "Bednarek" },
            { id: "A5",  team: "A", nr: 5,  role: "DEF", bx: 130, by: 340, pas: 12, sho: 5,  def: 14, name: "Bereszyński" },
            { id: "A6",  team: "A", nr: 6,  role: "MID", bx: 260, by: 80,  pas: 15, sho: 9,  def: 13, name: "Grosicki" },
            { id: "A7",  team: "A", nr: 8,  role: "MID", bx: 250, by: 160, pas: 17, sho: 11, def: 12, name: "Zieliński" },
            { id: "A8",  team: "A", nr: 7,  role: "MID", bx: 250, by: 240, pas: 14, sho: 10, def: 15, name: "Krychowiak" },
            { id: "A9",  team: "A", nr: 11, role: "MID", bx: 260, by: 320, pas: 16, sho: 8,  def: 11, name: "Frankowski" },
            { id: "A10", team: "A", nr: 9,  role: "ATT", bx: 420, by: 140, pas: 12, sho: 19, def: 4,  name: "Lewandowski" },
            { id: "A11", team: "A", nr: 10, role: "ATT", bx: 420, by: 260, pas: 13, sho: 17, def: 5,  name: "Milik" },

            // TEAM B (Niebiescy) - Atakuje w lewo
            { id: "B1",  team: "B", nr: 1,  role: "GK",  bx: 605, by: 200, pas: 12, sho: 1,  def: 18, name: "Buffon" },
            { id: "B2",  team: "B", nr: 2,  role: "DEF", bx: 510, by: 60,  pas: 11, sho: 3,  def: 16, name: "Zambrotta" },
            { id: "B3",  team: "B", nr: 5,  role: "DEF", bx: 510, by: 150, pas: 10, sho: 2,  def: 19, name: "Cannavaro" },
            { id: "B4",  team: "B", nr: 6,  role: "DEF", bx: 510, by: 250, pas: 9,  sho: 4,  def: 17, name: "Nesta" },
            { id: "B5",  team: "B", nr: 3,  role: "DEF", bx: 510, by: 340, pas: 13, sho: 5,  def: 18, name: "Maldini" },
            { id: "B6",  team: "B", nr: 7,  role: "MID", bx: 380, by: 80,  pas: 15, sho: 12, def: 10, name: "Camoranesi" },
            { id: "B7",  team: "B", nr: 8,  role: "MID", bx: 390, by: 160, pas: 18, sho: 14, def: 11, name: "Pirlo" },
            { id: "B8",  team: "B", nr: 4,  role: "MID", bx: 390, by: 240, pas: 12, sho: 9,  def: 16, name: "Gattuso" },
            { id: "B9",  team: "B", nr: 11, role: "MID", bx: 380, by: 320, pas: 16, sho: 13, def: 8,  name: "Nedved" },
            { id: "B10", team: "B", nr: 10, role: "ATT", bx: 220, by: 140, pas: 14, sho: 18, def: 3,  name: "Totti" },
            { id: "B11", team: "B", nr: 9,  role: "ATT", bx: 220, by: 260, pas: 11, sho: 17, def: 4,  name: "Inzaghi" }
        ];

        // Rozstawienie początkowe graczy
        players.forEach(p => { p.x = p.bx; p.y = p.by; });
        let ball = { x: 320, y: 200, tx: 320, ty: 200, owner: null };
        
        // Rozpoczęcie meczu od napastnika Teamu A
        let pPosiadajacy = players.find(p => p.id === "A10"); 
        ball.owner = pPosiadajacy;

        let fazaMeczu = "DECYZJA"; let czasTrwaniaAnimacji = 0;

        function wypiszKomentarz(tekst, kolor = "#00ff00") {
            comment.style.color = kolor; comment.innerText = "⚽ " + tekst;
        }
        // 2. MATRYCA LOGICZNA SILNIKA MECZOWEGO (Pełne 11v11 z przemieszczeniem taktycznym)
        function silnikMeczowyTick() {
            if (fazaMeczu === "DECYZJA") {
                czasTrwaniaAnimacji = 50; 
                let koledzy = players.filter(p => p.team === pPosiadajacy.team && p.id !== pPosiadajacy.id);
                let przeciwnicy = players.filter(p => p.team !== pPosiadajacy.team);
                let losowaKostka = Math.random();

                // Dynamiczne wyznaczenie kierunku i strefy ataku zespołu przy piłce
                let kierunek = pPosiadajacy.team === "A" ? 1 : -1;
                let liniaAtakuX = pPosiadajacy.x;

                // ROZKAZ DLA CAŁYCH FORMACJI: Przesunięcie strefowe wszystkich 22 kopek!
                players.forEach(p => {
                    if (p.role === "GK") return;
                    if (p.team === pPosiadajacy.team) {
                        // Atakujący wychodzą do przodu szukać pozycji
                        p.tx = p.bx + (kierunek * 70);
                        p.ty = p.by + (Math.random() * 30 - 15);
                    } else {
                        // Obrońcy reagują głębokim cofnięciem i kryciem strefowym pod linię piłki
                        p.tx = p.bx + (kierunek * 40);
                        p.ty = p.by + (ball.y - p.by) * 0.2;
                    }
                });

                // DECYZJA A: PODANIE DO PRZODU LUB DO BOKU
                if (losowaKostka < 0.60) {
                    // Wybór kolegi wysuniętego do przodu lub w linii pomocy
                    let odbiorca = koledzy[Math.floor(Math.random() * koledzy.length)];
                    let losowyObronca = przeciwnicy[Math.floor(Math.random() * przeciwnicy.length)];
                    
                    ball.owner = null;
                    ball.tx = odbiorca.bx + (kierunek * 50); 
                    ball.ty = odbiorca.by;
                    odbiorca.tx = ball.tx; odbiorca.ty = ball.ty;

                    // Menedżerski pojedynek statystyk
                    let szansaNaPrzechwyt = (losowyObronca.def / 20) * 0.38; 
                    let jakoscPodania = (pPosiadajacy.pas / 20);

                    if (jakoscPodania > szansaNaPrzechwyt) {
                        pPosiadajacy = odbiorca; fazaMeczu = "ANIMACJA_LOTU";
                        wypiszKomentarz(`${pPosiadajacy.name} napędza atak precyzyjnym podaniem.`, "#00ff00");
                    } else {
                        pPosiadajacy = losowyObronca; ball.tx = losowyObronca.x; ball.ty = losowyObronca.y;
                        fazaMeczu = "ANIMACJA_LOTU";
                        wypiszKomentarz(`Przechwyt! Szyk obronny przerwany przez: ${losowyObronca.name}.`, "#ff5722");
                    }
                } 
                // DECYZJA B: INDYWIDUALNY RAJD SKRZYDŁEM / ŚRODKIEM
                else if (losowaKostka < 0.85) {
                    pPosiadajacy.tx = pPosiadajacy.x + (kierunek * 60);
                    pPosiadajacy.ty = pPosiadajacy.y + (Math.random() * 50 - 25);
                    ball.tx = pPosiadajacy.tx; ball.ty = pPosiadajacy.ty;
                    
                    fazaMeczu = "ANIMACJA_RAJDU";
                    wypiszKomentarz(`${pPosiadajacy.name} przedziera się przez linię pomocy rywali!`, "#00e5ff");
                } 
                // DECYZJA C: POTĘŻNY STRZAŁ Z POZYCJI ATUTOWEJ
                else {
                    let strefaStrzalu = pPosiadajacy.team === "A" ? pPosiadajacy.x > 260 : pPosiadajacy.x < 380;
                    
                    if (strefaStrzalu) {
                        ball.owner = null;
                        let celX = pPosiadajacy.team === "A" ? 632 : 8;
                        ball.tx = celX; ball.ty = 175 + Math.random() * 50;
                        
                        fazaMeczu = "ANIMACJA_STRZALU";
                        wypiszKomentarz(`Mocne uderzenie! ${pPosiadajacy.name} składa się do strzału!`, "#ffeb3b");
                    } else {
                        fazaMeczu = "DECYZJA";
                    }
                }
            }

            // 3. WIZUALIZATOR GEOMETRII 2D (Płynny ruch całego bloku 22 graczy)
            players.forEach(p => {
                if (p.tx !== undefined && p.ty !== undefined) {
                    p.x += (p.tx - p.x) * 0.08; p.y += (p.ty - p.y) * 0.08;
                } else {
                    // Powrót formacji do domyślnego układu na boisku
                    p.x += (p.bx - p.x) * 0.04; p.y += (p.by - p.y) * 0.04;
                }
            });

            if (ball.owner) {
                ball.x = ball.owner.x; ball.y = ball.owner.y;
            } else {
                ball.x += (ball.tx - ball.x) * 0.12; ball.y += (ball.ty - ball.y) * 0.12;
            }

            czasTrwaniaAnimacji--;
            if (czasTrwaniaAnimacji <= 0) {
                if (fazaMeczu === "ANIMACJA_LOTU" || fazaMeczu === "ANIMACJA_RAJDU") {
                    ball.owner = pPosiadajacy;
                    players.forEach(p => { p.tx = undefined; p.ty = undefined; });
                    fazaMeczu = "DECYZJA";
                }
                else if (fazaMeczu === "ANIMACJA_STRZALU") {
                    let golZasieg = ball.y >= 170 && ball.y <= 230;
                    let bramkarzRywala = players.find(p => p.team !== pPosiadajacy.team && p.role === "GK");

                    let obronaGK = Math.random() * (bramkarzRywala.def / 20);
                    let celnoscATT = Math.random() * (pPosiadajacy.sho / 20);

                    if (golZasieg && (celnoscATT > obronaGK)) {
                        if (ball.x > 320) { scoreA++; document.getElementById("sa").innerText = scoreA; }
                        else { scoreB++; document.getElementById("sb").innerText = scoreB; }
                        wypiszKomentarz(`GOL!!! Przepiękna bramka! Strzelcem: ${pPosiadajacy.name}!`, "#4caf50");
                    } else {
                        wypiszKomentarz(`Wyśmienita obrona! ${bramkarzRywala.name} paruje strzał!`, "#2196f3");
                    }
                    
                    // Wznowienie akcji od losowej pozycji po strzale
                    pPosiadajacy = players[Math.floor(Math.random() * players.length)];
                    ball.owner = pPosiadajacy;
                    players.forEach(p => { p.x = p.bx; p.y = p.by; p.tx = undefined; p.ty = undefined; });
                    fazaMeczu = "DECYZJA";
                }
            }

            // 4. RENDERING GRAFIKI (Lekka siatka renderowania pod wbudowane ekrany SL)
            ctx.fillStyle = "#134e24"; ctx.fillRect(0, 0, 640, 400);
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5;
            
            ctx.strokeRect(10, 10, 620, 380);
            ctx.beginPath(); ctx.moveTo(320, 10); ctx.lineTo(320, 390); ctx.stroke();
            ctx.beginPath(); ctx.arc(320, 200, 50, 0, Math.PI*2); ctx.stroke();
            ctx.strokeRect(10, 120, 50, 160); ctx.strokeRect(580, 120, 50, 160);
            ctx.fillStyle = "#fff"; ctx.fillRect(2, 170, 8, 60); ctx.fillRect(630, 170, 8, 60);

            // Rysowanie 22 aktywnych kropek
            players.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
                ctx.fillStyle = p.team === "A" ? "#cc1111" : "#1111cc"; ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
                
                ctx.fillStyle = "#fff"; ctx.font = "bold 9px Arial";
                ctx.fillText(p.nr, p.x - (p.nr >= 10 ? 5 : 3), p.y + 3);
            });

            ctx.beginPath(); ctx.arc(ball.x, ball.y, 4, 0, Math.PI*2);
            ctx.fillStyle = "#fff"; ctx.fill(); ctx.strokeStyle = "#000"; ctx.stroke();

            requestAnimationFrame(silnikMeczowyTick);
        }

        silnikMeczowyTick();
    </script>
</body>
</html>
