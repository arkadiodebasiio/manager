<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prawdziwy Sprite Boksera</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: monospace; padding-top: 50px; }
        canvas { background: #111; border: 4px solid #555; display: block; margin: 20px auto; image-rendering: pixelated; }
    </style>
</head>
<body>

    <h1>KLASYCZNY SPRITE BOKSERA</h1>
    <p>Ładowanie gotowego duszka postaci z zewnętrznego pliku</p>
    
    <canvas id="canvas" width="400" height="300"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const img = new Image();
        img.crossOrigin = "anonymous";
        // Używamy przykładowego, stabilnego adresu URL z duszkiem postaci w stylu retro pixel-art
        img.src = "https://opengameart.org";

        img.onload = function() {
            ctx.imageSmoothingEnabled = false;
            // Rysujemy powiększonego sprite'a na środku płótna
            ctx.drawImage(img, 120, 60, img.width * 2, img.height * 2);
        };
        
        img.onerror = function() {
            ctx.fillStyle = "red";
            ctx.font = "16px monospace";
            ctx.fillText("Błąd ładowania pliku graficznego", 50, 150);
        };
    </script>
</body>
</html>
