<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Retro Boxing Manager - Visual Upgrade</title>
    <style>
        body {
            background-color: #090d16;
            color: #f1f5f9;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #ui-layer {
            background: #1e293b;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 360px;
            border: 2px solid #475569;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .stat-bar {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            align-items: center;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }
        button:hover { background: #1d4ed8; }
        #fight-btn {
            background: #059669;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #fight-btn:hover { background: #047857; }
        canvas {
            border: 4px solid #f8fafc;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div style="font-weight: bold; text-align: center; margin-bottom: 12px; color: #f59e0b; letter-spacing: 1px;">MANAGEMENT & TRAINING</div>
        <div class="stat-bar">
            <span>Punkty rozwoju:</span>
            <span id="pts" style="color: #38bdf8; font-weight: bold;">5</span>
        </div>
        <div class="stat-bar">
            <span>SIŁA (POWER: <span id="v-pow">10</span>):</span>
            <button onclick="train('pow')">+</button>
        </div>
        <div class="stat-bar">
            <span>SZYBKOŚĆ (SPEED: <span id="v-spd">6</span>):</span>
            <button onclick="train('spd')">+</button>
        </div>
        <button id="fight-btn" onclick="triggerFight()">ROZPOCZNIJ WALKĘ</button>
    </div>

    <canvas id="stage" width="400" height="260"></canvas>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

let points = 5;
let shakeTimer = 0;
let flashTimer = 0;

let bA = { name: "ALEX", x: 130, y: 130, hp: 100, color: "#38bdf8", gloves: "#f59e0b", state: "IDLE", timer: 0, speed: 0.05, power: 10 };
let bB = { name: "BOB",  x: 230, y: 130, hp: 100, color: "#f43f5e", gloves: "#ffffff", state: "IDLE", timer: 0, speed: 0.06, power: 12 };

let active = false;
let over = false;
let statusText = "ZBUDUJ FORMĘ I WYŚLIJ BOKSERA";

function train(type) {
    if (points <= 0) return;
    points--;
    document.getElementById("pts").innerText = points;
    if (type === 'pow') {
        bA.power += 4;
        document.getElementById("v-pow").innerText = bA.power;
    } else {
        bA.speed += 0.02;
        document.getElementById("v-spd").innerText = Math.round(bA.speed * 100);
    }
}

function triggerFight() {
    if (active) return;
    bA.hp = 100; bB.hp = 100;
    over = false; active = true;
    statusText = "RUNDA 1 - GONG!";
}

function processAI(p, enemy, isLeft) {
    if (!active || over) return;
    p.timer++;

    if ((p.state === "PUNCH" || p.state === "HIT") && p.timer > 10) p.state = "IDLE";

    if (p.state === "IDLE" && Math.random() < p.speed) {
        p.state = "PUNCH";
        p.timer = 0;
        
        enemy.state = "HIT";
        enemy.timer = 0;
        enemy.hp -= p.power;
        
        // Wyzwolenie efektów wizualnych uderzenia (Visual Juice)
        shakeTimer = 8;
        flashTimer = 5;
        statusText = `${p.name} TRAFIA POTĘŻNYM CIOSEM!`;

        if (enemy.hp <= 0) {
            enemy.hp = 0; over = true;
            statusText = `K.O.! ${p.name} ZOSTAJE MISTRZEM!`;
        }
    }
}

function drawFighter(p, isLeft) {
    ctx.save();
    let dx = p.x;
    let dy = p.y;

    if (p.state === "PUNCH") dx += isLeft ? 18 : -18;
    if (p.state === "HIT") {
        dx += isLeft ? -8 : 8;
        dy -= 2;
    }

    // Cień zawodnika
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(dx + 12, dy + 54, 18, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Czarny obrys sylwetki (Prawdziwy Pixel-Art Look)
    ctx.fillStyle = "#000000";
    ctx.fillRect(dx - 1, dy - 1, 26, 56);

    // Muskularny tors (Cieniowanie)
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(dx, dy + 14, 24, 26);
    ctx.fillStyle = "#e0a080"; // cień mięśni
    ctx.fillRect(isLeft ? dx : dx + 18, dy + 14, 6, 26);

    // Spodenki z paskiem
    ctx.fillStyle = p.color;
    ctx.fillRect(dx, dy + 36, 24, 14);
    ctx.fillStyle = "#ffffff"; // biały pas mistrzowski
    ctx.fillRect(dx, dy + 36, 24, 3);

    // Buty
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(dx + 2, dy + 50, 6, 4);
    ctx.fillRect(dx + 16, dy + 50, 6, 4);

    // Głowa i rysy twarzy
    ctx.fillStyle = "#ffcc99";
    ctx.fillRect(dx + 4, dy, 16, 15);
    ctx.fillStyle = "#000000"; // oczy
    ctx.fillRect(isLeft ? dx + 14 : dx + 6, dy + 4, 2, 2);

    // Rękawice (Wysunięte lub dynamiczna garda)
    ctx.fillStyle = p.gloves;
    if (p.state === "PUNCH") {
        ctx.fillRect(isLeft ? dx + 22 : dx - 12, dy + 12, 14, 12);
        ctx.strokeStyle = "#000000";
        ctx.strokeRect(isLeft ? dx + 22 : dx - 12, dy + 12, 14, 12);
    } else {
        ctx.fillRect(dx - 4, dy + 16, 10, 12);
        ctx.fillRect(dx + 18, dy + 16, 10, 12);
    }
    ctx.restore();
}

function renderScene() {
    ctx.save();
    
    // Efekt trzęsienia ekranu (Screen Shake) przy uderzeniu
    if (shakeTimer > 0) {
        let dx = (Math.random() - 0.5) * 6;
        let dy = (Math.random() - 0.5) * 6;
        ctx.translate(dx, dy);
        shakeTimer--;
    }

    // 1. Widownia w tle (Ciemny gradient z neonami)
    let crowd = ctx.createLinearGradient(0, 0, 0, 100);
    crowd.addColorStop(0, "#020617");
    crowd.addColorStop(1, "#0f172a");
    ctx.fillStyle = crowd;
    ctx.fillRect(0, 0, 400, 260);

    // Błyski aparatów na widowni (Losowe retro piksele)
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    for (let i = 0; i < 6; i++) {
        if (Math.random() < 0.1) ctx.fillRect(Math.random() * 400, Math.random() * 70, 3, 2);
    }

    // 2. Podłoga i Ring (Perspektywa)
    ctx.fillStyle = "#334155"; // obrzeża
    ctx.fillRect(0, 100, 400, 160);
    
    ctx.fillStyle = "#64748b"; // Mata ringu
    ctx.beginPath();
    ctx.moveTo(60, 100); ctx.lineTo(340, 100);
    ctx.lineTo(400, 240); ctx.lineTo(0, 240);
    ctx.fill();

    // 3. Trójwymiarowe liny ringu
    ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(400, 96); ctx.stroke();
    ctx.strokeStyle = "#f8fafc";
    ctx.beginPath(); ctx.moveTo(0, 90); ctx.lineTo(400, 90); ctx.stroke();

    // Sędzia ringowy w tle (Klasyczny pasiak)
    ctx.fillStyle = "#000"; ctx.fillRect(190, 90, 20, 35);
    ctx.fillStyle = "#fff"; ctx.fillRect(195, 90, 4, 35); ctx.fillRect(201, 90, 4, 35);
    ctx.fillStyle = "#ffcc99"; ctx.fillRect(193, 78, 14, 12);

    // 4. Renderowanie Bokserów
    drawFighter(bA, true);
    drawFighter(bB, false);

    // 5. Linie akcji / Rozbłysk (Action Lines)
    if (flashTimer > 0) {
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(0, 0, 400, 260);
        ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(160, 140); ctx.lineTo(240, 120);
        ctx.moveTo(170, 110); ctx.lineTo(230, 150);
        ctx.stroke();
        flashTimer--;
    }

    // 6. Belki Życia (UI na ringu)
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(20, 225, 110, 18); ctx.fillRect(270, 225, 110, 18);
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(25, 230, 100, 8); ctx.fillRect(275, 230, 100, 8);
    ctx.fillStyle = "#10b981"; // Życie graczy
    ctx.fillRect(25, 230, bA.hp, 8); ctx.fillRect(275, 230, bB.hp, 8);

    // Ekran komentarza tekstowego na środku maty
    ctx.fillStyle = "rgba(15,23,42,0.85)";
    ctx.fillRect(40, 185, 320, 26);
    ctx.strokeStyle = "#475569"; ctx.strokeRect(40, 185, 320, 26);
    ctx.fillStyle = "#f59e0b"; ctx.font = "11px monospace"; ctx.textAlign = "center";
    ctx.fillText(statusText, 200, 202);
    ctx.textAlign = "left"; // reset alignment

    ctx.restore();
}

function loop() {
    processAI(bA, bB, true);
    processAI(bB, bA, false);
    renderScene();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
