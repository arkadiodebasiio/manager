<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Gala Boksu - Symulacja Walki</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1, h2 {
            text-align: center;
            color: #ff4d4d;
            margin-bottom: 5px;
        }
        h2 { color: #aaa; font-size: 1.2em; margin-bottom: 25px; }
        .scorecard {
            display: flex;
            justify-content: space-around;
            background: #262626;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .boxer-card {
            text-align: center;
            width: 45%;
        }
        .hp-bar-container {
            background: #444;
            border-radius: 4px;
            height: 16px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }
        .hp-bar {
            background: #33cc33;
            height: 100%;
            width: 100%;
            transition: width 0.3s ease;
        }
        #log {
            background: #141414;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .log-round { color: #ffb3b3; font-weight: bold; margin-top: 10px; }
        .log-hit { color: #ff9999; }
        .log-crit { color: #ff3333; font-weight: bold; background: #3a1a1a; padding: 2px 5px; display: block; margin: 4px 0; }
        .log-dodge { color: #808080; font-style: italic; }
        .log-info { color: #33cc33; font-weight: bold; }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #e03b3b; }
        button:disabled { background-color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>OSTATNI GONG: MISTRZOSTWO WAGI CIEZKIEJ</h1>
    <h2>Tomasz "Grom" Majewski vs Damian "Orzel" Orlowski</h2>

    <div class="scorecard">
        <div class="boxer-card">
            <strong id="name1">Tomasz Majewski (Grom)</strong>
            <div class="hp-bar-container"><div id="hp1" class="hp-bar"></div></div>
            <span id="hpval1">HP: 100%</span>
        </div>
        <div class="boxer-card">
            <strong id="name2">Damian Orlowski (Orzel)</strong>
            <div class="hp-bar-container"><div id="hp2" class="hp-bar"></div></div>
            <span id="hpval2">HP: 100%</span>
        </div>
    </div>

    <div id="log">Kliknij przycisk poniżej, aby rozpocząć walkę...</div>

    <button id="startBtn" onclick="startMatch()">ROZPOCZNIJ WALKĘ</button>
</div>

<script>
    const tadek = { name: "Tomasz Majewski", nick: "Grom", hp: 100, stamina: 100, power: 88, speed: 70, chin: 90, defense: 85, score: 0 };
    const damian = { name: "Damian Orlowski", nick: "Orzel", hp: 100, stamina: 100, power: 75, speed: 92, chin: 78, defense: 80, score: 0 };

    const punches = ["lewy prosty", "prawy sierp", "hak na korpus", "podbródkowy", "overhand"];
    const zones = ["głowę", "korpus"];

    function updateUI() {
        document.getElementById("hp1").style.width = Math.max(0, tadek.hp) + "%";
        document.getElementById("hpval1").innerText = `HP: ${Math.max(0, tadek.hp)}%`;
        document.getElementById("hp2").style.width = Math.max(0, damian.hp) + "%";
        document.getElementById("hpval2").innerText = `HP: ${Math.max(0, damian.hp)}%`;
    }

    function logMessage(html, className = "") {
        const log = document.getElementById("log");
        log.innerHTML += `<div class="${className}">${html}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startMatch() {
        document.getElementById("startBtn").disabled = true;
        document.getElementById("log").innerHTML = "";
        
        tadek.hp = 100; damian.hp = 100;
        tadek.score = 0; damian.score = 0;
        updateUI();

        const totalRounds = 3;

        for (let r = 1; r <= totalRounds; r++) {
            if (tadek.hp <= 0 || damian.hp <= 0) break;
            logMessage(`--- RUNDA ${r} ---`, "log-round");
            await sleep(800);

            for (let ex = 1; ex <= 5; ex++) {
                if (tadek.hp <= 0 || damian.hp <= 0) break;
                
                let attacker = Math.random() < 0.5 ? tadek : damian;
                let defender = attacker === tadek ? damian : tadek;

                let p = punches[Math.floor(Math.random() * punches.length)];
                let z = zones[Math.floor(Math.random() * zones.length)];

                let attackRoll = attacker.speed + Math.floor(Math.random() * 30);
                let defenseRoll = defender.defense + Math.floor(Math.random() * 30);

                if (attackRoll > defenseRoll) {
                    let dmg = Math.floor(attacker.power / 5) + Math.floor(Math.random() * 10) - Math.floor(defender.chin / 15);
                    dmg = Math.max(3, dmg);
                    defender.hp -= dmg;

                    if (dmg > 16 && Math.random() < 0.3) {
                        logMessage(`[${attacker.nick}] trafia potężnym ${p} w ${z}! (${dmg} pkt obrażeń) - NOKDAUN!`, "log-crit");
                    } else {
                        logMessage(`[${attacker.nick}] trafia czysto ciosem: ${p} w ${z} (${dmg} dmg)`, "log-hit");
                    }
                } else {
                    logMessage(`[${defender.nick}] robi świetny unik! ${attacker.nick} przestrzeliwuje.`, "log-dodge");
                }

                updateUI();
                await sleep(700);
            }
        }

        logMessage("=== KONIEC WALKI ===", "log-round");
        if (tadek.hp <= 0) {
            logMessage(`Wygrywa przez nokaut: ${damian.name} (${damian.nick})!`, "log-info");
        } else if (damian.hp <= 0) {
            logMessage(`Wygrywa przez nokaut: ${tadek.name} (${tadek.nick})!`, "log-info");
        } else {
            logMessage(`Walka dobiegła końca! Sędziowie ogłaszają remis lub wyrównaną decyzję.`, "log-info");
        }

        document.getElementById("startBtn").disabled = false;
        document.getElementById("startBtn").innerText = "WALCZ PONOWNIE";
    }
</script>

</body>
</html>
