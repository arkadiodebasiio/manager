<!DOCTYPE html>
<html>
<head>
    <title>Championship Manager 2D - Rzut Monetą</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        canvas { background: #236926; border: 4px solid #fff; box-shadow: 0px 0px 25px rgba(0,0,0,0.7); display: block; margin: 10px auto; }
        #commentary { background: #000; border: 2px solid #333; width: 580px; min-height: 45px; margin: 10px auto; padding: 10px; font-size: 14px; color: #00ff00; border-radius: 4px; text-align: left; }
    </style>
</head>
<body>

    <canvas id="matchCanvas" width="600" height="400"></canvas>
    <div id="commentary">> Oczekiwanie na kapitanów obu drużyn...</div>

    <script>
        const canvas = document.getElementById("matchCanvas"); const ctx = canvas.getContext("2d");
        const comment = document.getElementById("commentary");

        let ball = { x: 300, y: 200, targetX: 300, targetY: 200, speed: 0.04 };
        let players = [];
        let druzynaRozpoczynajaca = ""; 

        // Podstawowe pozycje taktyczne 11 na 11
        const basePositions = [
            { id: "A1", team: "A", nr: 1, x: 40, y: 200 }, { id: "A2", team: "A", nr: 2, x: 140, y: 80 }, { id: "A3", team: "A", nr: 3, x: 130, y: 160 }, { id: "A4", team: "A", nr: 4, x: 130, y: 240 }, { id: "A5", team: "A", nr: 5, x: 140, y: 320 }, { id: "A6", team: "A", nr: 6, x: 240, y: 90 }, { id: "A7", team: "A", nr: 7, x: 220, y: 160 }, { id: "A8", team: "A", nr: 8, x: 220, y: 240 }, { id: "A10", team: "A", nr: 10, x: 240, y: 310 }, { id: "A11", team: "A", nr: 11, x: 290, y: 185 }, { id: "A9", team: "A", nr: 9, x: 290, y: 215 },
            { id: "B1", team: "B", nr: 1, x: 560, y: 200 }, { id: "B2", team: "B", nr: 2, x: 460, y: 80 }, { id: "B3", team: "B", nr: 3, x: 470, y: 160 }, { id: "B4", team: "B", nr: 4, x: 470, y: 240 }, { id: "B5", team: "B", nr: 5, x: 460, y: 320 }, { id: "B6", team: "B", nr: 6, x: 360, y: 90 }, { id: "B7", team: "B", nr: 7, x: 380, y: 160 }, { id: "B8", team: "B", nr: 8, x: 380, y: 240 }, { id: "B10", team: "B", nr: 10, x: 360, y: 310 }, { id: "B9", team: "B", nr: 9, x: 310, y: 185 }, { id: "B11", team: "B", nr: 11, x: 310, y: 215 }
        ];

        basePositions.forEach(p => {
            players.push({ id: p.id, team: p.team, nr: p.nr, homeX: p.x, homeY: p.y, x: p.x, y: p.y, targetX: p.x, targetY: p.y });
        });

        // --- KROK 1: RZUT MONETĄ PRZED MECZEM ---
        function rzutMoneta() {
            comment.style.color = "#ffb300";
            comment.innerText = "🪙 [ŻONGLERKA] Sędzia rzuca monetą... Kto rozpocznie to spotkanie?";

            setTimeout(() => {
                // Losowanie 50/50
                druzynaRozpoczynajaca = Math.random() > 0.5 ? "A" : "B";
                
                if (druzynaRozpoczynajaca === "A") {
                    comment.style.color = "#00ff00";
                    comment.innerText = "🔴 Rzut monetą wygrywa FC KULECZKI! Zawodnicy nr 9 i nr 11 podchodzą do środka boiska.";
                    // Ustawiamy dokładnie 2 zawodników Czerwonych na środku, blisko piłki
                    let p9 = players.find(p => p.id === "A9"); let p11 = players.find(p => p.id === "A11");
                    p9.x = 295; p9.y = 190; p9.targetX = 295; p9.targetY = 190;
                    p11.x = 295; p11.y = 210; p11.targetX = 295; p11.targetY = 210;
                } else {
                    comment.style.color = "#1e88e5";
                    comment.innerText = "🔵 Rzut monetą wygrywają NIEBIESKIE ASY! Zawodnicy nr 9 i nr 11 stoją przy środkowym punkcie.";
                    // Ustawiamy dokładnie 2 zawodników Niebieskich na środku
                    let p9 = players.find(p => p.id === "B9"); let p11 = players.find(p => p.id === "B11");
                    p9.x = 305; p9.y = 190; p9.targetX = 305; p9.targetY = 190;
                    p11.x = 305; p11.y = 210; p11.targetX = 305; p11.targetY = 210;
                }
                
                // Za 3 sekundy sędzia zagwiżdże i zacznie się pierwsze podanie
                setTimeout(pierwszePodanieNaSrodku, 3000);
            }, 2000);
        }

        // --- KROK 2: PODANIE DO NAJBLIŻSZEGO NA ŚRODKU ---
        function первоеPodanieNaSrodku() { // (zabezpieczenie nazwy funkcji)
            comment.style.color = "#00ff00";
            
            if (druzynaRozpoczynajaca === "A") {
                comment.innerText = "⚽ [GWIZDEK] Napastnik nr 9 FC Kuleczki lekko trąca piłkę do najbliższego kolegi z numerem 11...";
                ball.targetX = 295; ball.targetY = 210; // Piłka leci do zawodnika nr 11
            } else {
                comment.innerText = "⚽ [GWIZDEK] Napastnik nr 9 Niebieskich Asów podaje na centymetry do drugiego napastnika nr 11...";
                ball.targetX = 305; ball.targetY = 210; // Piłka leci do zawodnika nr 11 Niebieskich
            }

            // Za 2 sekundy nastąpi podanie do tyłu
            setTimeout(podanieDoTylu, 2000);
        }

        // --- KROK 3: PODANIE PIŁKI DO TYŁU DO KOLEGÓW ---
        function podanieDoTylu() {
            comment.style.color = "#ffeb3b";
            
            if (druzynaRozpoczynajaca === "A") {
                comment.innerText = "↩️ [TAKTYKA] Napastnik nr 11 natychmiast wycofuje piłkę do tyłu, do nadbiegających pomocników!";
                // Szukamy pomocnika nr 7 w formacji Czerwonych (który stoi z tyłu na pozycji X: 200, Y: 160)
                let pomocnikA7 = players.find(p => p.id === "A7");
                ball.targetX = pomocnikA7.x; ball.targetY = pomocnikA7.y; // Piłka leci do tyłu
            } else {
                comment.innerText = "↩️ [TAKTYKA] Niebieski napastnik nr 11 zagrywa piłkę do tyłu, prosto do formacji pomocy!";
                // Szukamy pomocnika nr 7 w formacji Niebieskich (pozycja z tyłu X: 400, Y: 160)
                let pomocnikB7 = players.find(p => p.id === "B7");
                ball.targetX = pomocnikB7.x; ball.targetY = pomocnikB7.y; // Piłka leci do tyłu
            }
            
            // ZATRZYMUJEMY SILNIK TUTAJ - czekamy na Twój kolejny krok i instrukcje!
        }

        // Pętla rysująca 60 FPS (zawodnicy i piłka na razie tylko lecą do wyznaczonych celów)
        function render() {
            ctx.fillStyle = "#236926"; ctx.fillRect(0, 0, 600, 400);
            ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 2; ctx.strokeRect(0, 0, 600, 400);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();
            ctx.beginPath(); ctx.arc(300, 200, 45, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeRect(0, 110, 70, 180); ctx.strokeRect(530, 110, 70, 180);

            players.forEach(p => {
                p.x += (p.targetX - p.x) * 0.05; p.y += (p.targetY - p.y) * 0.05;
                ctx.fillStyle = p.team === "A" ? "#e53935" : "#1e88e5"; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText(p.nr, p.x - 5, p.y + 4);
            });

            ball.x += (ball.targetX - ball.x) * ball.speed; ball.y += (ball.targetY - ball.y) * ball.speed;
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#000"; ctx.stroke();

            requestAnimationFrame(render);
        }

        // Poprawka dla wywołania funkcji
        function pierwszePodanieNaSrodku() { pierwszePodanieNaSrodku; } 
        // Automatyczny start rzutu monetą na powitanie
        rzutMoneta();
        render();
    </script>
</body>
</html>
