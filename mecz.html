<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tenis AI - Nowoczesny Styl</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #scoreboard {
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 10px 24px;
            border-radius: 9999px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        canvas {
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            border: 2px solid #334155;
        }
    </style>
</head>
<body>

    <div id="scoreboard"><span id="p1Name">Alex</span>: <span id="p1Score">0</span> &nbsp;|&nbsp; <span id="p2Name">Bob</span>: <span id="p2Score">0</span></div>
    <canvas id="tennisCanvas" width="900" height="550"></canvas>

<script>
const canvas = document.getElementById("tennisCanvas");
const ctx = canvas.getContext("2d");

// --- STATYSTYKI ZAWODNIKÓW ---
const PlayerA = {
    x: 50, y: canvas.height / 2 - 45, width: 22, height: 80, score: 0,
    speed: 4.8, reaction: 0.18, power: 1.1, color: "#38bdf8", name: "Alex"
};
const PlayerB = {
    x: canvas.width - 72, y: canvas.height / 2 - 45, width: 22, height: 80, score: 0,
    speed: 4.2, reaction: 0.22, power: 1.2, color: "#f43f5e", name: "Bob"
};

// --- PIŁKA I ŚLAD (TRAIL) ---
const ball = {
    x: canvas.width / 2, y: canvas.height / 2, vx: 5.5, vy: 3, radius: 9, speed: 6,
    history: []
};

function moveAI(player) {
    let targetY = ball.y - player.height / 2;
    let diff = targetY - player.y;
    if (Math.abs(diff) > 6) {
        player.y += Math.min(player.speed, Math.abs(diff) * player.reaction * 10) * (diff > 0 ? 1 : -1);
    }
    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
}

function update() {
    moveAI(PlayerA);
    moveAI(PlayerB);

    // Zapis pozycji do efektu smugi
    ball.history.push({x: ball.x, y: ball.y});
    if (ball.history.length > 8) ball.history.shift();

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Odbicia od ścian
    if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.vy = -ball.vy;
        ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
    }

    // Kolizja z PlayerA
    if (ball.x - ball.radius < PlayerA.x + PlayerA.width && ball.x > PlayerA.x - 5) {
        if (ball.y > PlayerA.y && ball.y < PlayerA.y + PlayerA.height) {
            let hitFactor = (ball.y - (PlayerA.y + PlayerA.height / 2)) / (PlayerA.height / 2);
            let angle = hitFactor * (Math.PI / 3);
            ball.vx = Math.cos(angle) * ball.speed * PlayerA.power;
            ball.vy = Math.sin(angle) * ball.speed * PlayerA.power;
            ball.x = PlayerA.x + PlayerA.width + ball.radius;
        } else if (ball.x < PlayerA.x) {
            PlayerB.score++;
            updateScoreboard();
            resetBall();
        }
    }

    // Kolizja z PlayerB
    if (ball.x + ball.radius > PlayerB.x && ball.x < PlayerB.x + PlayerB.width + 5) {
        if (ball.y > PlayerB.y && ball.y < PlayerB.y + PlayerB.height) {
            let hitFactor = (ball.y - (PlayerB.y + PlayerB.height / 2)) / (PlayerB.height / 2);
            let angle = hitFactor * (Math.PI / 3);
            ball.vx = -Math.cos(angle) * ball.speed * PlayerB.power;
            ball.vy = Math.sin(angle) * ball.speed * PlayerB.power;
            ball.x = PlayerB.x - ball.radius;
        } else if (ball.x > PlayerB.x + PlayerB.width) {
            PlayerA.score++;
            updateScoreboard();
            resetBall();
        }
    }
}

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.history = [];
    let dir = Math.random() > 0.5 ? 1 : -1;
    ball.vx = dir * ball.speed;
    ball.vy = (Math.random() * 2 - 1) * 3;
}

function updateScoreboard() {
    document.getElementById("p1Score").innerText = PlayerA.score;
    document.getElementById("p2Score").innerText = PlayerB.score;
}

// --- RENDEROWANIE GRAFIKI ---
function drawCourt() {
    // Tło kortu (ciepła zieleń z gradientem)
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, "#14532d");
    grad.addColorStop(1, "#166534");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Linie boiska
    ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
    ctx.lineWidth = 3;
    ctx.strokeRect(25, 25, canvas.width - 50, canvas.height - 50);

    // Środek (linia)
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 25);
    ctx.lineTo(canvas.width / 2, canvas.height - 25);
    ctx.stroke();

    // Siatka (teksturowana, półprzezroczysta)
    ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
    ctx.lineWidth = 4;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 25);
    ctx.lineTo(canvas.width / 2, canvas.height - 25);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawPlayer(p, isRight) {
    ctx.save();
    // Cień postaci
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(p.x + p.width/2, p.y + p.height - 2, p.width/1.5, 6, 0, 0, Math.PI*2);
    ctx.fill();

    // Zaokrąglone ciało (tułów)
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y + 16, p.width, p.height - 24, 6);
    ctx.fill();

    // Głowa
    ctx.fillStyle = "#fef08a";
    ctx.beginPath();
    ctx.arc(p.x + p.width / 2, p.y + 10, 9, 0, Math.PI * 2);
    ctx.fill();

    // Elegancka rakieta
    ctx.fillStyle = "#cbd5e1";
    let rx = isRight ? p.x - 7 : p.x + p.width + 1;
    ctx.fillRect(rx, p.y + 22, 6, 42);
    ctx.restore();
}

function drawBall() {
    // Smuga piłki
    for (let i = 0; i < ball.history.length; i++) {
        let pos = ball.history[i];
        let alpha = i / ball.history.length * 0.4;
        ctx.fillStyle = `rgba(250, 204, 21, ${alpha})`;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, ball.radius * (i / ball.history.length), 0, Math.PI * 2);
        ctx.fill();
    }

    // Główna piłka
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
}

function gameLoop() {
    update();
    drawCourt();
    drawPlayer(PlayerA, false);
    drawPlayer(PlayerB, true);
    drawBall();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
