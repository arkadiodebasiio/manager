<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prosty Test Animacji Boksera</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: monospace; padding-top: 50px; }
        canvas { background: #222; border: 4px solid #555; display: block; margin: 20px auto; }
    </style>
</head>
<body>

    <h1>TEST ANIMACJI BOKSERA</h1>
    <p>Postać wykonuje teraz płynny ruch w stylu retro (bujanie i garda)</p>
    
    <canvas id="canvas" width="400" height="300"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let time = 0;

        function drawBoxer(x, y) {
            ctx.save();
            // Efekt delikatnego bujania (idle/bouncy retro)
            let bounce = Math.sin(time) * 4;
            
            // Buty
            ctx.fillStyle = "#111";
            ctx.fillRect(x + 15, y + 110 + bounce, 20, 15);
            ctx.fillRect(x + 45, y + 110 + bounce, 20, 15);

            // Nogi
            ctx.fillStyle = "#ffdbac";
            ctx.fillRect(x + 18, y + 80 + bounce, 14, 35);
            ctx.fillRect(x + 48, y + 80 + bounce, 14, 35);

            // Spodenki
            ctx.fillStyle = "#3366ff";
            ctx.fillRect(x + 10, y + 60 + bounce, 60, 25);
            ctx.fillStyle = "#fff";
            ctx.fillRect(x + 10, y + 60 + bounce, 60, 6);

            // Tors
            ctx.fillStyle = "#ffdbac";
            ctx.fillRect(x + 15, y + 25 + bounce, 50, 40);

            // Głowa
            ctx.fillRect(x + 23, y - 5 + bounce, 34, 32);
            ctx.fillStyle = "#4a3728"; // Włosy
            ctx.fillRect(x + 23, y - 5 + bounce, 34, 8);

            // Oko
            ctx.fillStyle = "#000";
            ctx.fillRect(x + 45, y + 6 + bounce, 4, 4);

            // Rękawice w gardzie
            ctx.fillStyle = "#ff3333";
            ctx.fillRect(x + 8, y + 20 + bounce, 20, 22);
            ctx.fillRect(x + 52, y + 20 + bounce, 20, 22);

            ctx.restore();
        }

        function gameLoop() {
            // Czyszczenie płótna
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zwiększanie licznika czasu do animacji
            time += 0.12;

            // Rysowanie animowanego boksera na środku ekranu
            drawBoxer(160, 80);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
