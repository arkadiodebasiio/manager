<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Manager Boksu - Symulacja</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        canvas { background: #222; border: 4px solid #444; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #log { margin-top: 15px; height: 80px; overflow-y: auto; background: #1a1a1a; padding: 10px; border: 1px solid #333; font-size: 14px; width: 600px; margin-left: auto; margin-right: auto; text-align: left; color: #0f0; border-radius: 5px; }
        .stats { display: flex; justify-content: space-around; width: 600px; margin: 10px auto; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>RING MANAGER 2026</h1>
    <div class="stats">
        <div style="color: #ff5555;">Czerwony: <span id="hp1">100</span> HP</div>
        <div style="color: #5555ff;">Niebieski: <span id="hp2">100</span> HP</div>
    </div>
    <canvas id="ring" width="600" height="400"></canvas>
    <div id="log"></div>

    <script>
        const canvas = document.getElementById("ring");
        const ctx = canvas.getContext("2d");
        const logDiv = document.getElementById("log");

        function addLog(text) {
            logDiv.innerHTML += "[" + new Date().toLocaleTimeString() + "] " + text + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        let b1 = { x: 150, y: 200, vx: 2, vy: 0, hp: 100, color: "#ff5555", name: "Czerwony", punchCooldown: 0 };
        let b2 = { x: 450, y: 200, vx: -2, vy: 0, hp: 5555, color: "#5555ff", name: "Niebieski", punchCooldown: 0 };
        // fix the blue hp init typo safely
        b2.hp = 100;

        let gameOver = false;

        function drawBoxer(b, angle, punching) {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(angle);

            // Korpus (Główna kula)
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            // Ręce jako szczypce raka (kreski) + rękawice
            let armDist = punching ? 40 : 25;
            
            // Lewa ręka/szczypce
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.quadraticCurveTo(15, -30, armDist, -20);
            ctx.strokeStyle = "#ccc";
            ctx.lineWidth = 4;
            ctx.stroke();
            // Rękawica
            ctx.beginPath();
            ctx.arc(armDist, -20, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();

            // Prawa ręka/szczypce
            ctx.beginPath();
            ctx.moveTo(0, 10);
            ctx.quadraticCurveTo(15, 30, armDist, 20);
            ctx.strokeStyle = "#ccc";
            ctx.lineWidth = 4;
            ctx.stroke();
            // Rękawica
            ctx.beginPath();
            ctx.arc(armDist, 20, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();

            ctx.restore();
        }

        function update() {
            if (gameOver) return;

            // Ruch w stronę przeciwnika
            let dx = b2.x - b1.x;
            let dy = b2.y - b1.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            let angle1 = Math.atan2(dy, dx);
            let angle2 = Math.atan2(-dy, -dx);

            if (dist > 65) {
                b1.x += Math.cos(angle1) * 1.8;
                b1.y += Math.sin(angle1) * 1.8;
                b2.x += Math.cos(angle2) * 1.8;
                b2.y += Math.sin(angle2) * 1.8;
            } else {
                // Zwarcia / ciosy
                b1.punchCooldown++;
                b2.punchCooldown++;

                let p1Punch = (b1.punchCooldown % 40 < 20);
                let p2Punch = (b2.punchCooldown % 45 < 20);

                if (b1.punchCooldown % 50 === 0 && Math.random() > 0.4) {
                    b2.hp -= Math.floor(Math.random() * 8) + 3;
                    addLog(b1.name + " trafia sierpowym szczypcem!");
                    document.getElementById("hp2").innerText = Math.max(0, b2.hp);
                }
                if (b2.punchCooldown % 55 === 0 && Math.random() > 0.4) {
                    b1.hp -= Math.floor(Math.random() * 8) + 3;
                    addLog(b2.name + " kontratakuje lewym prostym!");
                    document.getElementById("hp1").innerText = Math.max(0, b1.hp);
                }

                // Delikatny taneczny odskok
                b1.x += (Math.random() - 0.5) * 2;
                b1.y += (Math.random() - 0.5) * 2;
                b2.x += (Math.random() - 0.5) * 2;
                b2.y += (Math.random() - 0.5) * 2;

                if (b1.hp <= 0 || b2.hp <= 0) {
                    gameOver = true;
                    let winner = b1.hp > 0 ? b1.name : b2.name;
                    addLog("KONIEC WALKIE! NOKAUT! Wygrywa: " + winner);
                }
            }

            // Ograniczenie do ringu
            b1.x = Math.max(40, Math.min(560, b1.x));
            b1.y = Math.max(40, Math.min(360, b1.y));
            b2.x = Math.max(40, Math.min(560, b2.x));
            b2.y = Math.max(40, Math.min(360, b2.y));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Linie ringu
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            let p1Punch = (b1.punchCooldown % 40 < 20);
            let p2Punch = (b2.punchCooldown % 45 < 20);

            let angle1 = Math.atan2(b2.y - b1.y, b2.x - b1.x);
            let angle2 = Math.atan2(b1.y - b2.y, b1.x - b2.x);

            drawBoxer(b1, angle1, p1Punch);
            drawBoxer(b2, angle2, p2Punch);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        addLog("Gong! Walka rozpoczęta. Zawodnicy ruszają na środki ringu.");
        loop();
    </script>
</body>
</html>
