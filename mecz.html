<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Test Boksu</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; padding-top: 20px; }
        canvas { background: #222; border: 4px solid #555; display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>TEST WIDOCZNOSCI KULEK</h1>
    <canvas id="ring" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("ring");
        const ctx = canvas.getContext("2d");

        // Pozycje startowe na środku płótna
        let b1 = { x: 150, y: 200, color: "#ff5555", angle: 0 };
        let b2 = { x: 450, y: 200, color: "#5555ff", angle: Math.PI };

        function drawBoxer(b) {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.angle);

            // GŁOWA / KORPUS (widoczna kula, promień 25)
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            // RĘCE I RĘKAWICE Z BOKU
            for (let side of [-35, 35]) {
                // Ramię
                ctx.beginPath();
                ctx.moveTo(0, side * 0.5);
                ctx.lineTo(40, side);
                ctx.strokeStyle = "#aaaaaa";
                ctx.lineWidth = 6;
                ctx.stroke();

                // Rękawica (ogromna, promień 28)
                ctx.beginPath();
                ctx.arc(40, side, 28, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = b.color;
                ctx.stroke();
            }

            ctx.restore();
        }

        function loop() {
            // Czyszczenie i rysowanie ringu
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#444";
            ctx.lineWidth = 4;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

            // Rysowanie obu zawodników
            drawBoxer(b1);
            drawBoxer(b2);
        }

        // Uruchomienie pętli rysującej
        loop();
    </script>
</body>
</html>
